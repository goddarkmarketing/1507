number.\",\"toastFail\":\"Impossibile confermare la prenotazione. Per favore controlla i tuoi dati.\",\"types\":{\"one-way\":{\"label\":\"Unidirezionale\",\"desc\":\"Trasferimento singolo\",\"detail\":\"Trasferimento singolo punto a punto.\"},\"round-trip\":{\"label\":\"Andata e ritorno\",\"desc\":\"Viaggio di ritorno incluso\",\"detail\":\"Creeremo automaticamente una tratta di ritorno con percorso invertito.\"},\"multi-route\":{\"label\":\"Percorso multiplo\",\"desc\":\"Molteplici destinazioni\",\"detail\":\"Aggiungi tutte le tratte di cui hai bisogno per il tuo viaggio.\"},\"multi-day\":{\"label\":\"Multigiorno\",\"desc\":\"Date diverse\",\"detail\":\"Pianifica i trasferimenti in date diverse all'interno di una prenotazione.\"},\"daily-charter\":{\"label\":\"Carta giornaliera\",\"desc\":\"8 ore giornata intera\",\"detail\":\"Charter per l'intera giornata (8 ore): scegli il tuo veicolo e l'orario di inizio.\"},\"hourly-charter\":{\"label\":\"Carta oraria\",\"desc\":\"Minimo 3 ore\",\"detail\":\"Minimo 3 ore: fermate flessibili durante il periodo di noleggio.\"}},\"paymentSubtitlePlans\":\"Choose pay to driver, deposit, or pay in full — then complete payment details\",\"payAtPickup\":\"Pay at pickup\",\"balanceDueDriver\":\"Pay ฿{amount} in cash to the driver at pickup\",\"paymentPlanLabel\":\"Payment plan:\",\"confirmPayDriver\":\"Submit booking (awaiting staff confirmation)\",\"depositStepAdvanceTier\":\"Online deposit tiers: ≤฿1,000 → ฿200 · ฿1,001–฿2,999 → ฿500 · ≥฿3,000 → ฿1,000.\",\"toastPaymentPlan\":\"Please choose a payment plan\",\"routePreviewOfficial\":\"Official tariff\",\"routePreviewOnRequest\":\"On request\"},\"Pages\":{\"fleet\":\"La nostra flotta\",\"priceList\":\"Listino prezzi\",\"faq\":\"Domande frequenti\",\"reviews\":\"Recensioni dei clienti\",\"contact\":\"Contattaci\",\"articles\":\"Articoli di viaggio\",\"tours\":\"Tour\",\"boatSchedules\":\"Orari delle barche\",\"travelInfo\":\"Informazioni di viaggio\",\"fleetSubtitle\":\"8 classi di veicoli con foto reali e specifiche complete\",\"priceListSubtitle\":\"Tariffe trasparenti per trasferimenti e noleggio giornaliero\",\"reviewsSubtitle\":\"Feedback reali dai viaggiatori in tutto il sud della Thailandia\",\"contactSubtitle\":\"Hai domande? Il nostro team è pronto ad aiutarti con i tuoi piani di viaggio nel sud della Thailandia.\",\"articlesSubtitle\":\"Guide per trasferimenti aeroporto, spiaggia, molo e interprovincia\",\"toursSubtitle\":\"Gite di un giorno ed esperienze sull'isola intorno a Krabi\",\"boatSchedulesSubtitle\":\"Orari di partenza di traghetti e motoscafi simulati\",\"travelInfoSubtitle\":\"Consigli pratici per le destinazioni più popolari della Thailandia meridionale\"},\"Site\":{\"slogan\":\"La tua rete di trasferimento di fiducia nel sud della Thailandia\",\"tagline\":\"Piattaforma di viaggi e trasporti della Thailandia meridionale\"},\"Faq\":{\"pageTitle\":\"Domande frequenti e politiche\",\"pageSubtitle\":\"Tutto quello che devi sapere sulla prenotazione, sui pagamenti e sui nostri standard di servizio.\",\"sectionTitle\":\"Domande frequenti\",\"policiesTitle\":\"Politiche di servizio\",\"items\":{\"1\":{\"q\":\"Come prenoto un trasferimento?\",\"a\":\"Seleziona i luoghi di ritiro e riconsegna, scegli il veicolo, la data e l'ora, quindi completa il modulo di prenotazione. Riceverai immediatamente un e-Voucher con il codice QR.\"},\"2\":{\"q\":\"Posso prenotare più tratte in un'unica prenotazione?\",\"a\":\"SÌ. Il nostro sistema di prenotazione supporta prenotazioni di sola andata, di andata e ritorno, con più tratte, di più giorni e charter, il tutto in un'unica prenotazione.\"},\"3\":{\"q\":\"Cosa succede se il mio volo è in ritardo?\",\"a\":\"Monitoriamo gli orari dei voli. Per i prelievi aeroportuali includiamo 60 minuti di attesa gratuita a partire dall'orario di atterraggio effettivo.\"},\"4\":{\"q\":\"Quali metodi di pagamento accettate?\",\"a\":\"Accettiamo bonifici bancari, carte di credito/debito e PromptPay durante la prenotazione online (la demo utilizza dati di pagamento simulati). Puoi anche pagare l'autista in contanti (THB) se concordato in anticipo.\"},\"5\":{\"q\":\"Qual è la vostra politica di cancellazione?\",\"a\":\"Cancellazione gratuita fino a 24 ore prima del ritiro. Le cancellazioni entro 24 ore possono comportare un addebito del 50%. La mancata presentazione non è rimborsabile.\"},\"6\":{\"q\":\"Fornite seggiolini per bambini?\",\"a\":\"Sì, i seggiolini per bambini sono disponibili su richiesta senza alcun costo aggiuntivo. Si prega di specificare l'età/peso dei bambini al momento della prenotazione.\"},\"7\":{\"q\":\"I prezzi sono tutto compreso?\",\"a\":\"SÌ. I prezzi indicati includono pedaggi, parcheggio, carburante e servizio di autista. I costi aggiuntivi si applicano solo per l'attesa degli straordinari o per i componenti aggiuntivi opzionali richiesti.\"},\"8\":{\"q\":\"Come ricevo il mio voucher elettronico?\",\"a\":\"Dopo aver confermato la prenotazione, un e-Voucher con codice QR viene visualizzato immediatamente e può essere riaperto in qualsiasi momento dalla pagina di prenotazione. Mostralo all'autista al momento del ritiro.\"},\"9\":{\"q\":\"What documents and deposit are needed for car rental?\",\"a\":\"Please prepare an ID card or driver’s license, round-trip flight tickets in your name, and a reachable phone number. Security deposit is ฿3,000 for small cars and ฿5,000 for large cars. Pay ฿500 in advance when the car is confirmed; pay the rental fee and remaining deposit on contract day. The deposit is refunded after return and inspection. Free Krabi Airport pickup and drop-off is included.\"}},\"policies\":{\"waiting\":{\"title\":\"Tempo di attesa\",\"content\":\"I prelievi aeroportuali includono 60 minuti di attesa gratuiti. Il prelievo dall'hotel/molo include 15 minuti di attesa gratuita. L'attesa aggiuntiva prevede un costo di 200 THB ogni 30 minuti.\"},\"flight-delay\":{\"title\":\"Ritardo del volo\",\"content\":\"Monitoriamo il numero del tuo volo e regoliamo automaticamente l'orario di ritiro. Nessun costo aggiuntivo per ritardi fino a 2 ore.\"},\"child-seat\":{\"title\":\"Seggiolino per bambini\",\"content\":\"Seggiolini per neonati, bambini piccoli e rialzi disponibili gratuitamente. Richiedere in fase di prenotazione.\"},\"pets\":{\"title\":\"Animali domestici\",\"content\":\"Gli animali di piccola taglia nei trasportini sono i benvenuti nelle categorie SUV e Van. Potrebbero essere applicati costi aggiuntivi per la pulizia di 300 THB.\"},\"ferry\":{\"title\":\"Collegamenti in traghetto\",\"content\":\"I trasferimenti al molo includono il trasferimento al terminal dei traghetti. I biglietti del traghetto possono essere organizzati come servizio aggiuntivo.\"},\"toll\":{\"title\":\"Pedaggio e parcheggio\",\"content\":\"Tutti i pedaggi e le spese di parcheggio negli aeroporti/molo sono inclusi nel prezzo indicato.\"},\"payment\":{\"title\":\"Pagamento\",\"content\":\"Paga online tramite carta/bonifico o contanti all'autista in THB. I prezzi sono tutto compreso salvo diversa indicazione.\"},\"cancellation\":{\"title\":\"Cancellazione\",\"content\":\"Cancellazione gratuita almeno 24 ore prima del ritiro. Entro 24 ore: carica del 50%. No-show: nessun rimborso.\"},\"refund\":{\"title\":\"Rimborso\",\"content\":\"I rimborsi approvati vengono elaborati entro 5-7 giorni lavorativi tramite il metodo di pagamento originale.\"},\"rental-deposit\":{\"title\":\"Car rental deposit\",\"content\":\"Small cars: ฿3,000 deposit. Large cars: ฿5,000 deposit. After confirmation, pay ฿500 advance deposit first. Pay rental fee and remaining deposit on contract day. Deposit is refunded after car return and inspection. Free Krabi Airport pickup \u0026 drop-off.\"}}},\"Reviews\":{\"pageTitle\":\"Recensioni dei clienti\",\"pageSubtitle\":\"Feedback reali dai viaggiatori in tutto il sud della Thailandia.\",\"items\":{\"1\":{\"country\":\"Regno Unito\",\"comment\":\"Trasferimento agevole dall'aeroporto di Krabi ad Ao Nang. L'autista stava aspettando con un cartello, l'auto era pulita e confortevole.\",\"route\":\"Aeroporto KBV → Spiaggia di Ao Nang\"},\"2\":{\"country\":\"Germania\",\"comment\":\"Viaggio di andata e ritorno prenotato a Railay Beach. Comunicazione eccellente e servizio puntuale in entrambe le direzioni.\",\"route\":\"Aeroporto KBV ↔ Railay Beach\"},\"3\":{\"country\":\"Giappone\",\"comment\":\"Il furgone VIP per la nostra famiglia di 6 persone era perfetto. I bambini hanno adorato gli asciugamani freddi e gli snack!\",\"route\":\"Aeroporto KBV → Centara Grand\"},\"4\":{\"country\":\"Italia\",\"comment\":\"Trasferimento interprovinciale a Phuket dall'ottimo rapporto qualità-prezzo. Leggermente ritardato a causa del traffico ma l'autista ci ha tenuti informati.\",\"route\":\"Krabi → Aeroporto di Phuket\"},\"5\":{\"country\":\"Australia\",\"comment\":\"Il prelievo dall'hotel al molo era perfetto. L'autista ha aiutato con i bagagli e ha cronometrato tutto per il nostro traghetto Phi Phi.\",\"route\":\"Ao Nang Hotel → Molo di Ao Nang\"},\"6\":{\"country\":\"Francia\",\"comment\":\"Ho prenotato un trasferimento in spiaggia a Railay tramite il molo. Aggiornamenti chiari sulla LINEA e un furgone pulito per i nostri bagagli.\",\"route\":\"Città di Krabi → Molo di Railay\"},\"7\":{\"country\":\"Tailandia\",\"comment\":\"Li ho usati per viaggi di più giorni intorno a Krabi. Prenotazione facile, prezzo giusto e autisti sempre puntuali.\",\"route\":\"Charter giornaliero · Krabi\"}}},\"Transfer\":{\"fromEco\":\"Berlina economica da\",\"book\":\"Prenota\",\"bookRoute\":\"Prenota questo percorso\",\"popularRoutes\":\"Percorsi popolari\",\"popularRoutesHint\":\"Tariffe di esempio per la berlina Economy. Il prezzo finale dipende dal veicolo e dalla data.\",\"route\":\"Itinerario\",\"distance\":\"Distanza\",\"duration\":\"Durata\",\"fromPrice\":\"Da (ECO)\",\"recommended\":\"Veicoli consigliati\",\"recommendedBody\":\"Scegli un veicolo adatto alle dimensioni del tuo gruppo e al tuo bagaglio.\",\"ctaTitle\":\"Pronti per prenotare {title}?\",\"ctaBody\":\"Ottieni un e-Voucher istantaneo con il codice QR dopo la prenotazione.\",\"howTitle\":\"Come funziona la prenotazione\",\"howSubtitle\":\"Tre semplici passaggi dal preventivo al ritiro.\",\"step1Title\":\"Scegli il tuo percorso\",\"step1Body\":\"Seleziona ritiro, riconsegna, data e veicolo.\",\"step2Title\":\"Conferma e paga\",\"step2Body\":\"Paga in sicurezza e ricevi il tuo e-Voucher con QR.\",\"step3Title\":\"Incontra il tuo autista\",\"step3Body\":\"I dettagli del conducente arrivano prima del ritiro. Rilassati e pedala.\",\"includedTitle\":\"Cosa è incluso\",\"otherServices\":\"Altri servizi di trasferimento\",\"viewPrices\":\"Visualizza il listino prezzi\",\"startBooking\":\"Inizia a prenotare\",\"km\":\"{n}km\",\"approxMin\":\"~{n} min\",\"tipLabel\":\"Buono a sapersi\",\"categories\":{\"airport\":\"Aeroporto\",\"hotel\":\"Albergo\",\"pier\":\"Molo\",\"beach\":\"Spiaggia\",\"city\":\"Città\",\"attraction\":\"Attrazione\",\"inter-province\":\"Interprovincia\"},\"faqTitle\":\"Domande frequenti per questo servizio\",\"faqSubtitle\":\"Risposte rapide prima di prenotare.\",\"reviewsTitle\":\"Cosa dicono i viaggiatori\",\"allReviews\":\"Tutte le recensioni\",\"allFaq\":\"Tutte le domande frequenti\",\"includedBadge\":\"Incluso\"},\"TransferPages\":{\"airport-transfer\":{\"title\":\"Trasferimento aeroportuale\",\"subtitle\":\"Trasferimenti privati da e per gli aeroporti di Krabi e della Thailandia meridionale\",\"intro\":\"Prelievi a orari del volo con opzioni di accoglienza, spazio per i bagagli e corse dirette per hotel, spiagge e moli.\",\"tip\":\"Condividi il numero del tuo volo al momento della prenotazione. Punti d'incontro dell'aeroporto di Krabi: porta 15 nazionale, porta 16 internazionale: guarda a sinistra dopo l'uscita.\",\"benefit1\":\"Monitoraggio del volo e tempi di attesa flessibili\",\"benefit2\":\"Meet \u0026 greet agli arrivi su richiesta\",\"benefit3\":\"Spazio per le valigie: opzioni da berlina a furgone\",\"faq\":{\"1\":{\"q\":\"Cosa succede se il mio volo è in ritardo?\",\"a\":\"Monitoriamo i voli per i prelievi aeroportuali e includiamo circa 60 minuti di attesa gratuita dall'orario di atterraggio effettivo.\"},\"2\":{\"q\":\"Offri incontri e saluti?\",\"a\":\"SÌ. Aggiungi il numero del tuo volo al momento della prenotazione. All'aeroporto di Krabi, gli arrivi nazionali escono dalla porta 15 e gli arrivi internazionali escono dalla porta 16, quindi guarda a sinistra: l'autista attende con il tuo nome su un cartello.\"},\"3\":{\"q\":\"Quanti bagagli posso portare?\",\"a\":\"Le berline economiche possono contenere circa 3 borse medie. Per più bagagli o per una famiglia, scegli SUV, furgone o furgone VIP nel modulo di prenotazione.\"},\"4\":{\"q\":\"Puoi ritirare anche all'aeroporto di Phuket?\",\"a\":\"SÌ. Copriamo Krabi (KBV) e selezionati aeroporti della Thailandia meridionale, incluso Phuket, con tariffe private punto a punto.\"},\"5\":{\"q\":\"Come posso pagare il trasferimento aeroportuale?\",\"a\":\"Paga online tramite bonifico bancario, carta o PromptPay al momento della prenotazione. Se necessario, è possibile organizzare in anticipo il pagamento in contanti all'autista.\"},\"6\":{\"q\":\"Quando riceverò i dettagli del conducente?\",\"a\":\"Il nome dell'autista, il telefono e i dettagli dell'auto vengono condivisi prima del ritiro, solitamente entro 24 ore dall'orario di trasferimento.\"}}},\"hotel-transfer\":{\"title\":\"Trasferimento in albergo\",\"subtitle\":\"Corse porta a porta tra resort, hotel e luoghi chiave di Krabi\",\"intro\":\"Auto privata fino alla hall dell'hotel o al cancello della villa: niente furgoni condivisi, niente fermate extra.\",\"tip\":\"Aggiungi il nome o il PIN del tuo hotel nelle note della prenotazione per un trasferimento più agevole.\",\"benefit1\":\"Ritiro e riconsegna porta a porta\",\"benefit2\":\"Ideale per check-in posticipati e partenze anticipate\",\"benefit3\":\"Opzioni Premium e VIP per soggiorni speciali\",\"faq\":{\"1\":{\"q\":\"Mi lasci nella hall dell'hotel?\",\"a\":\"SÌ. I trasferimenti sono porta a porta fino alla hall o al cancello della villa. Aggiungi il nome dell'hotel o il segnaposto sulla mappa nelle note della prenotazione.\"},\"2\":{\"q\":\"Posso prenotare il ritiro in hotel a tarda notte?\",\"a\":\"SÌ. I trasferimenti privati ​​sono disponibili per partenze anticipate e check-in posticipati: scegli la data e l'orario al momento della prenotazione.\"},\"3\":{\"q\":\"E' una navetta condivisa?\",\"a\":\"No. Ogni prenotazione prevede un'auto privata solo per il tuo gruppo, senza soste extra in hotel.\"},\"4\":{\"q\":\"Quale veicolo è il migliore per un soggiorno in resort?\",\"a\":\"Berlina Premium o Signature Class si adatta alle coppie; Il furgone VIP è l'ideale per famiglie e bagagli extra.\"},\"5\":{\"q\":\"Posso modificare il drop-off dell'hotel dopo la prenotazione?\",\"a\":\"Sì, se il nuovo hotel è nelle vicinanze. Inviaci un messaggio on LINE con il tuo numero di prenotazione il prima possibile.\"},\"6\":{\"q\":\"Aspetti se il check-in ritarda?\",\"a\":\"Brevi attese in hotel vanno bene. Per ritardi più lunghi, comunicacelo su LINE in modo che l'autista possa adeguarsi.\"}}},\"pier-transfer\":{\"title\":\"Trasferimento al molo\",\"subtitle\":\"Collegamenti affidabili con i moli dei traghetti e dei motoscafi\",\"intro\":\"Arriva in tempo per Phi Phi, Railay e le partenze dell'isola con autisti che conoscono gli orari del molo.\",\"tip\":\"Prenota almeno 45-60 minuti prima della partenza del traghetto da Ao Nang o dalla città.\",\"benefit1\":\"Programmato per le partenze di barche e traghetti\",\"benefit2\":\"Aiuto con le valigie all'ingresso del molo\",\"benefit3\":\"Collegamenti dall'aeroporto, dall'hotel o dalla spiaggia\",\"faq\":{\"1\":{\"q\":\"Quanto presto dovrei arrivare prima del traghetto?\",\"a\":\"Pianifica di raggiungere il molo 45-60 minuti prima della partenza da Ao Nang o Krabi Town, soprattutto in alta stagione.\"},\"2\":{\"q\":\"L'autista può aiutare con i bagagli al molo?\",\"a\":\"SÌ. Gli autisti ti aiutano con i bagagli all'ingresso del molo in modo da poter effettuare più facilmente il check-in per la tua barca.\"},\"3\":{\"q\":\"Ti colleghi alle barche Phi Phi e Railay?\",\"a\":\"SÌ. Le tratte più popolari includono il molo di Ao Nang e i collegamenti verso i servizi marittimi di Phi Phi e Railay.\"},\"4\":{\"q\":\"Dove posso controllare gli orari delle navi?\",\"a\":\"Consulta la nostra pagina Orari delle barche per esempi di orari di traghetti e motoscafi, quindi prenota il trasferimento al molo di conseguenza.\"},\"5\":{\"q\":\"Cosa succede se la mia barca viene cancellata?\",\"a\":\"Contattaci subito. Possiamo riprogrammare il trasferimento o aiutare a regolare il rientro quando gli operatori della barca cambiano gli orari.\"},\"6\":{\"q\":\"Posso prenotare hotel → molo → hotel lo stesso giorno?\",\"a\":\"SÌ. Aggiungi entrambe le tratte in un'unica prenotazione come tratta multipla o prenota due trasferimenti di sola andata con orari corrispondenti.\"}}},\"beach-transfer\":{\"title\":\"Trasferimento in spiaggia\",\"subtitle\":\"Corse dirette per Ao Nang, Railay, Patong e le aree costiere\",\"intro\":\"Evita i taxi sul marciapiede: vai direttamente dall'aeroporto o dall'hotel alla spiaggia con una tariffa privata fissa.\",\"tip\":\"L'accesso al Railay può includere un breve tragitto in barca dal molo; chiedici quando prenoti.\",\"benefit1\":\"Tariffa privata fissa, nessuna sorpresa al tassametro\",\"benefit2\":\"Punti di riconsegna della spiaggia e del resort\",\"benefit3\":\"Disponibili veicoli per famiglie e gruppi\",\"faq\":{\"1\":{\"q\":\"La tariffa per la spiaggia è fissa?\",\"a\":\"SÌ. I trasferimenti per la spiaggia privata utilizzano una tariffa fissa per il tuo veicolo: nessuna sorpresa al tassametro sul marciapiede.\"},\"2\":{\"q\":\"Come posso arrivare a Railay Beach?\",\"a\":\"La maggior parte degli ospiti si dirige verso l'area del molo di Railay, quindi prende una breve longtail condivisa. Comunicaci al momento della prenotazione se hai bisogno di aiuto per la tempistica del molo.\"},\"3\":{\"q\":\"Puoi fare un salto negli stabilimenti balneari?\",\"a\":\"SÌ. Facciamo tappa negli hotel sulla spiaggia e nei punti di accesso alla spiaggia concordati attraverso Ao Nang, collegamenti Railay e aree costiere.\"},\"4\":{\"q\":\"Cosa succede se ho bambini e tante borse?\",\"a\":\"Scegli SUV o furgone per avere più spazio. I seggiolini per bambini possono essere richiesti anticipatamente tramite note di prenotazione o LINE.\"},\"5\":{\"q\":\"Vai anche in spiagge più tranquille?\",\"a\":\"Sì, dove l'accesso stradale lo consente. Aggiungi il nome della spiaggia o del resort nelle note e confermeremo il miglior punto di riconsegna.\"},\"6\":{\"q\":\"Il viaggio di andata e ritorno per la spiaggia è più economico?\",\"a\":\"Le prenotazioni di andata e ritorno includono un piccolo sconto rispetto a due viaggi di sola andata separati. Utilizza il controllo prezzi per confrontare.\"}}},\"city-transfer\":{\"title\":\"Trasferimento della città\",\"subtitle\":\"Viaggi confortevoli tra le città del sud della Thailandia\",\"intro\":\"Krabi Town, Trang, Surat Thani e altro: auto private per commissioni, hotel e spostamenti giornalieri.\",\"tip\":\"Per le corse urbane con più fermate, annota ciascuna fermata nei commenti della prenotazione.\",\"benefit1\":\"Punto a punto o multistop su richiesta\",\"benefit2\":\"Comfort con aria condizionata per spostamenti più lunghi in città\",\"benefit3\":\"Dalla berlina al furgone per famiglie e bagagli\",\"faq\":{\"1\":{\"q\":\"Posso fare più fermate in città?\",\"a\":\"Sì, su richiesta. Elenca ogni fermata nelle note della prenotazione in modo da poter pianificare il tempo e il preventivo in modo equo.\"},\"2\":{\"q\":\"Coprite Trang e Surat Thani?\",\"a\":\"SÌ. I trasferimenti in città e paesi includono Krabi Town e città selezionate del sud per viaggi privati ​​punto a punto.\"},\"3\":{\"q\":\"L'auto è dotata di aria condizionata?\",\"a\":\"Tutti i veicoli per il trasferimento sono climatizzati e adatti al caldo diurno e ai spostamenti più lunghi in città.\"},\"4\":{\"q\":\"Posso prenotare lo stesso giorno in città?\",\"a\":\"Spesso sì, soggetto a disponibilità. Prenota on-line il prima possibile, oppure inviaci un messaggio on LINE per viaggi urgenti.\"},\"5\":{\"q\":\"Posso tenere l'auto per qualche ora in città?\",\"a\":\"Per l'attesa o l'uso orario, scegli il noleggio orario o annota il tempo di attesa al momento della prenotazione in modo che possiamo quotare correttamente.\"},\"6\":{\"q\":\"Ritiri dalle stazioni degli autobus o dei treni?\",\"a\":\"Sì, dove elencato nelle nostre sedi. Seleziona la stazione come ritiro o riconsegna nel modulo di prenotazione.\"}}},\"attraction-transfer\":{\"title\":\"Trasferimento dell'attrazione\",\"subtitle\":\"Templi, piscine color smeraldo, sorgenti termali e percorsi panoramici\",\"intro\":\"Trasferimenti privati alle principali attrazioni di Krabi con opzioni di attesa e ritorno per gite di un giorno.\",\"tip\":\"Chiedi il servizio di attesa e riconsegna se desideri la stessa macchina per il viaggio di ritorno.\",\"benefit1\":\"Percorsi popolari dei parchi e dei templi\",\"benefit2\":\"Opzioni di gita di un giorno con andata e ritorno\",\"benefit3\":\"Furgoni per piccoli gruppi e attrezzatura turistica\",\"faq\":{\"1\":{\"q\":\"L'autista può aspettare mentre visitiamo?\",\"a\":\"SÌ. Chiedi il servizio di attesa e riconsegna al momento della prenotazione in modo che la stessa macchina possa riportarti indietro dopo Emerald Pool, templi o sorgenti termali.\"},\"2\":{\"q\":\"Quali luoghi copri?\",\"a\":\"I drop più popolari includono Emerald Pool, Tiger Cave Temple, sorgenti termali e altri parchi e punti panoramici di Krabi.\"},\"3\":{\"q\":\"È meglio un furgone per una giornata di visite turistiche?\",\"a\":\"Per 4+ ospiti o vestiti bagnati dopo il bagno, un furgone o un furgone VIP è più comodo di una berlina.\"},\"4\":{\"q\":\"I biglietti d'ingresso vengono forniti con il trasferimento?\",\"a\":\"No. Le tariffe di trasferimento coprono solo il trasporto. I biglietti per il parco e il tempio si pagano in loco a meno che non si prenoti un tour separato.\"},\"5\":{\"q\":\"Possiamo visitare più di un'attrazione?\",\"a\":\"SÌ. Elenca l'ordine delle fermate nelle note di prenotazione o prenota un charter multi-itinerario/giornaliero per un giro turistico completo.\"},\"6\":{\"q\":\"A che ora dovremmo partire per le visite mattutine?\",\"a\":\"Per luoghi famosi come Emerald Pool, partire presto aiuta a evitare il caldo e la folla: possiamo suggerire un orario di ritiro al momento della prenotazione.\"}}},\"inter-province-transfer\":{\"title\":\"Trasferimento interprovinciale\",\"subtitle\":\"Trasferimenti privati a lunga distanza nel sud della Thailandia\",\"intro\":\"Krabi–Phuket, Trang, Surat Thani e oltre: SUV, furgone o autobus privato per viaggiare comodamente in autostrada.\",\"tip\":\"Prenotazioni per tratte lunghe nei fine settimana: prenota presto per le partenze mattutine.\",\"benefit1\":\"Opzioni SUV, furgone e autobus pronti per l'autostrada\",\"benefit2\":\"Tariffa fissa per spostamenti da provincia a provincia\",\"benefit3\":\"Ideale per gruppi con bagagli e attrezzatura\",\"faq\":{\"1\":{\"q\":\"Qual è il veicolo migliore per i lunghi viaggi in autostrada?\",\"a\":\"SUV o furgone per il comfort; Furgone o autobus VIP per gruppi più numerosi e più bagagli sulle rotte Krabi–Phuket o Surat.\"},\"2\":{\"q\":\"Il prezzo è fisso tra province?\",\"a\":\"SÌ. I trasferimenti interprovinciali utilizzano una tariffa fissa privata per il veicolo prescelto, concordata prima del pagamento.\"},\"3\":{\"q\":\"Con quanto anticipo dovrei prenotare i viaggi del fine settimana?\",\"a\":\"I fine settimana e i giorni festivi si riempiono presto: prenota le partenze mattutine almeno un giorno prima quando puoi.\"},\"4\":{\"q\":\"I pedaggi autostradali sono inclusi?\",\"a\":\"I prezzi di trasferimento indicati includono i pedaggi standard e il parcheggio relativi al viaggio, salvo diversa indicazione al momento della prenotazione.\"},\"5\":{\"q\":\"Sono previste soste sui percorsi lunghi?\",\"a\":\"I conducenti possono fermarsi brevemente per servizi igienici o spuntini durante i lunghi viaggi in autostrada. Menziona le pause preferite nelle tue note.\"},\"6\":{\"q\":\"Puoi andare da Krabi a Phuket con trasferimento in hotel?\",\"a\":\"SÌ. Scegli il tuo hotel o aeroporto di Phuket come luogo di rientro: privato punto a punto, non un autobus condiviso.\"}}}},\"Vehicles\":{\"amenities\":{\"ac\":\"Aria condizionata\",\"water\":\"Acqua in bottiglia\",\"charger\":\"Caricabatterie del telefono\",\"legroom\":\"Spazio extra per le gambe\",\"groupSeating\":\"Posti a sedere di gruppo\",\"leather\":\"Sedili in pelle\",\"wifi\":\"Wi-Fi\",\"snacks\":\"Spuntini\",\"meetGreet\":\"Incontra e saluta\",\"luxury\":\"Berlina di lusso\",\"premium\":\"Servizi premium\",\"priority\":\"Servizio prioritario\",\"captain\":\"Sedili del Capitano\",\"privacy\":\"Vetro privacy\",\"usb\":\"Ricarica USB\",\"drinks\":\"Bevande fredde\",\"groupTravel\":\"Viaggi di gruppo\",\"tourGuide\":\"Spazio guida turistica\"},\"bags\":\"{n} borse\",\"largeCargo\":\"Ampio vano di carico\",\"pax\":\"{n}pax\",\"bags3\":\"3 borse\",\"bags4\":\"4 borse\",\"bags6\":\"6 borse\",\"bags8\":\"8 borse\",\"bags10\":\"10 borse\",\"ECO\":{\"name\":\"Taxi economico\",\"luggage\":\"3 borse\"},\"PREM\":{\"name\":\"Taxi di lusso\",\"luggage\":\"4 borse\"},\"SUV\":{\"name\":\"Taxi SUV\",\"luggage\":\"6 borse\"},\"VAN\":{\"name\":\"Furgone Taxi\",\"luggage\":\"6 borse\"},\"VIP\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 borse\"},\"SIG\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 borse\"},\"EXE\":{\"name\":\"Furgone VIP\",\"luggage\":\"8 borse\"},\"BUS\":{\"name\":\"Minibus\",\"luggage\":\"Ampio vano di carico\"}},\"Contact\":{\"title\":\"Contatti\",\"subtitle\":\"Hai domande? Il nostro team è pronto ad aiutarti con i tuoi piani di ,\"bookRoute\":\"Pronti a prenotare questo percorso?\",\"startBooking\":\"Inizia a prenotare\",\"highlights\":\"Punti salienti\",\"includes\":\"In genere include\",\"bookTransfer\":\"Trasferimento di libri\",\"inquire\":\"Informarsi\",\"quickTips\":\"Suggerimenti rapidi\",\"planTransfer\":\"Pianifica il trasferimento successivo\",\"moreGuides\":\"Più guide\",\"boatType\":\"Tipo di barca\",\"allBoats\":\"Tutte le barche\",\"ferry\":\"Traghetto\",\"speedboat\":\"Motoscafo\",\"longtail\":\"Coda lunga\",\"route\":\"Itinerario\",\"allRoutes\":\"Tutti i percorsi\",\"departures\":\"Partenze\",\"duration\":\"Durata\",\"transferTo\":\"Trasferimento a {pier}\",\"landTransfer\":\"Trasferimento via terra al molo\",\"emptyBoats\":\"Nessuna pianificazione corrisponde ai tuoi filtri.\",\"mockBanner\":\"Orari simulati della barca per la pianificazione: gli orari possono differire nella realtà.\",\"ctaArticlesBody\":\"Controlla i prezzi in tempo reale e prenota un'auto privata con l'e-Voucher istantaneo.\",\"bookRouteBody\":\"Ottieni un prezzo immediato e un e-voucher con il codice QR.\",\"relatedBoats\":\"Percorsi in barca correlati\",\"landTransferBody\":\"Non vendiamo biglietti del traghetto: ti portiamo al punto di partenza in tempo.\",\"tourCtaTitle\":\"Prenota il trasferimento dal molo o dall'hotel\",\"tourCtaBody\":\"I biglietti del tour sono venduti da operatori locali. Ti portiamo al molo dell'incontro in tempo con un e-Voucher.\",\"toursCtaBody\":\"I prezzi del tour sono stime dell'operatore (fittizie). Gestiamo i trasferimenti hotel-molo con un e-Voucher istantaneo.\",\"travelCtaBody\":\"Controlla gli orari della barca, quindi prenota un trasferimento privato al molo o all'hotel.\"},\"Articles\":{\"categories\":{\"Airport\":\"Aeroporto\",\"Beach\":\"Spiaggia\",\"Pier\":\"Molo\",\"Inter Province\":\"Interprovinciale\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"Guida al trasferimento all'aeroporto di Krabi: arrivo regolare al KBV\",\"excerpt\":\"Cosa aspettarsi dopo l'atterraggio all'aeroporto internazionale di Krabi, come funziona il servizio di accoglienza e come prenotare un trasferimento privato con un e-Voucher.\",\"p1\":\"L'atterraggio all'aeroporto internazionale di Krabi (KBV) è l'inizio del tuo viaggio nel sud della Thailandia. Un trasferimento aeroportuale privato ti aiuta a saltare le code dei taxi e ad andare direttamente al tuo hotel, spiaggia o molo.\",\"p2\":\"Con Krabi Links Taxi, il tuo autista traccia il volo e include tempo di attesa gratuito per il ritiro all'aeroporto. Riceverai un e-Voucher con un codice QR subito dopo la prenotazione: mostralo al punto d'incontro.\",\"p3\":\"I percorsi più popolari da KBV includono Ao Nang Beach, Railay, Centara Grand e Krabi Town. Scegli la Berlina Economy per le coppie o il Van se viaggi con famiglia e bagagli.\",\"p4\":\"Suggerimento: condividi il numero del volo e il nome dell'hotel al momento della prenotazione in modo che l'autista possa preparare un cartello con il nome e pianificare il percorso migliore per aggirare il traffico serale.\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"Suggerimenti per il trasferimento ad Ao Nang e Railay Beach\",\"excerpt\":\"Come spostarsi tra Ao Nang, Railay e le località vicine con auto private, moli e il veicolo giusto per le borse da spiaggia.\",\"p1\":\"Ao Nang è il fulcro di molti soggiorni sulla spiaggia di Krabi, mentre Railay è raggiungibile tramite brevi collegamenti dal molo. Pianificare il tuo trasferimento in anticipo semplifica la giornata.\",\"p2\":\"Dall'aeroporto o dalla città di Krabi, prenota un trasferimento privato alla spiaggia di Ao Nang o al tuo hotel. Per Railay, possiamo portarti al molo e aiutarti a programmare il collegamento in barca.\",\"p3\":\"Se porti con te attrezzatura per lo snorkeling o borse grandi, un SUV o un furgone standard offrono più spazio di una berlina. Le prenotazioni di andata e ritorno consentono inoltre di risparmiare tempo il giorno del check-out.\",\"p4\":\"I ritorni serali dalla spiaggia possono essere impegnativi: prenota in anticipo l'orario di ritiro, soprattutto nei fine settimana e nei giorni festivi.\"},\"pier-transfer-to-phi-phi\":{\"title\":\"Trasferimento dal molo a Phi Phi: cosa dovrebbero sapere i viaggiatori\",\"excerpt\":\"Una pratica lista di controllo per i trasferimenti dall'hotel al molo, gli orari dei traghetti e i consigli sui bagagli prima di dirigersi a Phi Phi.\",\"p1\":\"I giorni dell'isola iniziano sulla terraferma. Un trasferimento affidabile dal molo dal tuo hotel o dall'aeroporto ti consente di raggiungere il molo di Ao Nang o altri punti di partenza senza fretta.\",\"p2\":\"Aumenta il tempo di buffer per il check-in e l'imbarco. Ti consigliamo di arrivare al molo almeno 45-60 minuti prima della partenza del traghetto durante l'alta stagione.\",\"p3\":\"I furgoni privati sono ideali per i gruppi che condividono lo stesso traghetto. Le famiglie possono richiedere gratuitamente i seggiolini per bambini al momento della prenotazione.\",\"p4\":\"Dopo il tuo viaggio sull'isola, prenota un ritiro al molo di ritorno in modo che un autista sia pronto quando la barca attracca: utile soprattutto se arrivi dopo il tramonto.\"},\"krabi-to-phuket-inter-province\":{\"title\":\"Trasferimento interprovinciale da Krabi a Phuket\",\"excerpt\":\"Confronta il comfort e i tempi per il corridoio Krabi-Phuket, le opzioni dei veicoli e quando un trasferimento privato batte i furgoni condivisi.\",\"p1\":\"La rotta Krabi-Phuket è uno dei trasferimenti interprovinciali più richiesti nel sud della Thailandia. Le auto private danno il cronometraggio porta a porta senza fermate multiple.\",\"p2\":\"Viaggi tipici collegano KBV o Krabi Town con l'aeroporto di Phuket o Patong. Il tempo di viaggio dipende dal traffico e se si parte dall'aeroporto o dalla città.\",\"p3\":\"Per i viaggi più lunghi, le opzioni VIP Van o Mini Bus offrono più spazio e comfort. I prezzi sono comprensivi di pedaggi e parcheggio, a meno che non si aggiungano i tempi di attesa.\",\"p4\":\"Prenota andata e ritorno se voli in una provincia e fuori dall'altra: una prenotazione copre entrambe le tratte con un unico flusso di e-Voucher.\"}}},\"Admin\":{\"loading\":\"Caricamento…\",\"loginTitle\":\"Accesso amministratore\",\"loginHint\":\"Demo: {user} / {pass}\",\"username\":\"Nome utente\",\"password\":\"Parola d'ordine\",\"signIn\":\"Accedi\",\"loginError\":\"Nome utente o password non validi\",\"logout\":\"Esci\",\"backToSite\":\"Torna al sito web\",\"panelTitle\":\"Operazioni\",\"opsLabel\":\"Back office · Demo\",\"nav\":{\"dashboard\":\"Cruscotto\",\"bookings\":\"Prenotazioni\",\"payments\":\"Pagamenti\",\"schedule\":\"Programma\",\"drivers\":\"Driver\",\"customers\":\"Clienti\",\"prices\":\"Tabelle dei prezzi\",\"vehicles\":\"Veicoli\",\"settings\":\"Impostazioni\"},\"dashboardTitle\":\"Cruscotto\",\"dashboardSubtitle\":\"Panoramica in tempo reale di trasferimenti, pagamenti e autisti.\",\"resetDemo\":\"Reimposta i dati dimostrativi\",\"statOpen\":\"Lavori aperti\",\"statPayReview\":\"Revisione del pagamento\",\"statToday\":\"I viaggi di oggi\",\"statAssigned\":\"Assigned / on trip\",\"statDrivers\":\"Autisti in linea\",\"statRevenue\":\"Entrate pagate\",\"recentBookings\":\"Prenotazioni recenti\",\"recentBookingsHint\":\"Showing the 10 newest bookings. Open Bookings for the full list.\",\"recentEmpty\":\"No bookings match these filters.\",\"filterDate\":\"Pickup / created date\",\"pickupAt\":\"Pickup\",\"viewAll\":\"Visualizza tutto\",\"viewAllBookings\":\"All bookings\",\"bookingsTitle\":\"Prenotazioni\",\"bookingsSubtitle\":\"Cerca, aggiorna lo stato e assegna i driver.\",\"searchBookings\":\"Cerca prenotazione, nome, telefono...\",\"filterAll\":\"Tutti gli stati\",\"filterStatus\":\"Status\",\"filterService\":\"Service type\",\"filterPayment\":\"Payment method\",\"colService\":\"Service\",\"serviceTransfer\":\"Transfer\",\"serviceRental\":\"Car rental\",\"payToday\":\"Pay today\",\"estimatedTotal\":\"Estimated total\",\ unto panoramico di Maya Bay, soste per lo snorkeling e pranzo sulla spiaggia.\",\"duration\":\"Intera giornata (~8-9 ore)\",\"fromArea\":\"Ao Nang/Krabi\",\"toArea\":\"Isole Phi Phi\",\"highlights\":{\"1\":\"Punto panoramico di Maya Bay (soggetto alle regole del parco)\",\"2\":\"Fai snorkeling presso barriere coralline limpide\",\"3\":\"Pranzo in spiaggia a Phi Phi Don o nella baia vicina\",\"4\":\"Supporto per i tempi di ritiro dall'hotel o dal molo\"},\"includes\":{\"1\":\"Posto sul motoscafo o sul traghetto (a seconda dell'operatore)\",\"2\":\"Tasse per il parco nazionale (dove incluse dall'operatore)\",\"3\":\"Pranzo e acqua potabile\",\"4\":\"Giubbotto di salvataggio e attrezzatura per lo snorkeling\"},\"content\":{\"1\":\"Phi Phi rimane una delle gite giornaliere più richieste da Krabi. La maggior parte dei pacchi partono presto da Ao Nang o dai moli vicini e ritornano nel tardo pomeriggio.\",\"2\":\"Ti consigliamo di prenotare un trasferimento al molo privato in modo da arrivare con un margine di tempo prima del check-in. I ritorni serali possono essere impegnativi: prenota il tuo spazio di ritiro quando prenoti il ​​tour.\",\"3\":\"I prezzi dei tour indicati provengono da operatori locali tipici (prezzi di guida simulata). Conferma le inclusioni, il tipo di barca e le regole di accesso a Maya Bay per la data del tuo viaggio.\"}},\"four-islands-tour\":{\"title\":\"Tour delle 4 isole (pollo, Tup, Poda e Railay)\",\"excerpt\":\"Breve giro da un'isola all'altra vicino ad Ao Nang: barriere coralline poco profonde, rocce iconiche e spiagge di sabbia soffice.\",\"duration\":\"Mezza/intera giornata\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Pollo · Tup · Poda · Railay\",\"highlights\":{\"1\":\"Punto panoramico e snorkeling di Chicken Island\",\"2\":\"Banco di sabbia di Tup Island (a seconda della marea)\",\"3\":\"Sosta per il bagno a Poda Beach\",\"4\":\"Arrivo o visita Railay facoltativa\"},\"includes\":{\"1\":\"Longtail o motoscafo\",\"2\":\"Maschera da snorkeling e giubbotto di salvataggio\",\"3\":\"Frutta/bevande analcoliche (a seconda dell'operatore)\",\"4\":\"Guida a bordo\"},\"content\":{\"1\":\"Il percorso delle 4 isole è l'ideale se desideri uno scenario vicino ad Ao Nang senza una lunga traversata per Phi Phi.\",\"2\":\"La marea influisce sulla visibilità del banco di sabbia a Tup Island: le partenze mattutine di solito offrono le migliori condizioni.\",\"3\":\"Abbina questo tour a un trasferimento dall'hotel al molo in modo da non fare affidamento sui canti dell'ultimo minuto durante l'alta stagione.\"}},\"hong-island-lagoon\":{\"title\":\"Escursione alla Laguna dell'Isola di Hong\",\"excerpt\":\"Lagune tranquille, opzioni per il kayak e spiagge di sabbia finissima nel Parco Nazionale di Than Bok Khorani.\",\"duration\":\"Giornata intera\",\"fromArea\":\"Ao Nang/Nopparat Thara\",\"toArea\":\"Isola di Hong\",\"highlights\":{\"1\":\"Vista sulla laguna color smeraldo\",\"2\":\"Kayak attraverso canali calcarei\",\"3\":\"Tempo tranquillo in spiaggia\",\"4\":\"Scenario del parco nazionale\"},\"includes\":{\"1\":\"Trasferimento in barca all'Isola di Hong\",\"2\":\"Kayak (condiviso o privato, a seconda dell'operatore)\",\"3\":\"Tassa per il parco nazionale (spesso inclusa)\",\"4\":\"Pranzo su alcuni pacchetti\"},\"content\":{\"1\":\"L'isola di Hong è popolare tra i viaggiatori che preferiscono le lagune e il kayak alle giornate in motoscafo a lunga percorrenza.\",\"2\":\"Le partenze sono spesso dal lato Nopparat Thara / Ao Nang. Concedi più tempo se il tuo hotel si trova nell'entroterra o nella città di Krabi.\",\"3\":\"Chiedi al tuo operatore le regole di apertura del parco e se i kayak sono inclusi o noleggiati in loco.\"}},\"james-bond-island-phang-nga\":{\"title\":\"Isola di James Bond · Baia di Phang Nga\",\"excerpt\":\"Iconiche formazioni carsiche calcaree, canoa nelle grotte e il famoso ago di roccia di Koh Tapu.\",\"duration\":\"Giornata intera\",\"fromArea\":\"Lato Krabi/Phuket\",\"toArea\":\"Baia di Phang Nga\",\"highlights\":{\"1\":\"Koh Tapu (Isola di James Bond)\",\"2\":\"Canoa attraverso le grotte di mangrovie\",\"3\":\"Fermata del villaggio di pescatori musulmani (a seconda dell'operatore)\",\"4\":\"Crociera panoramica nella baia\"},\"includes\":{\"1\":\"Segmento di barche e canoe\",\"2\":\"Guida\",\"3\":\"Pranzo\",\"4\":\"Tasse per il parco nazionale (dipende dal pacchetto)\"},\"content\":{\"1\":\"I tour dell'Isola di James Bond possono iniziare da Krabi o Phuket. Il tempo di viaggio a terra potrebbe essere più lungo del segmento di barca stesso.\",\"2\":\"Un trasferimento privato tra il tuo hotel e il molo delle riunioni mantiene la giornata nei tempi previsti, soprattutto per il prelievo anticipato dall'hotel.\",\"3\":\"I prezzi variano ampiamente in base alla qualità della canoa e alle dimensioni del gruppo; utilizza il nostro prezzo iniziale solo come guida alla pianificazione.\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"Combinazione Piscina Smeraldo e Sorgente Termale\",\"excerpt\":\"Giornata dedicata alla natura a terra: piscine nella giungla color smeraldo e sorgenti termali minerali vicino alla città di Krabi.\",\"duration\":\"Mezza giornata\",\"fromArea\":\"Città di Krabi/Ao Nang\",\"toArea\":\"Piscina Smeraldo · Sorgente termale\",\"highlights\":{\"1\":\"Nuota alla Emerald Pool\",\"2\":\"Rilassati nella sorgente termale naturale\",\"3\":\"Opzione punto di vista Blue Pool\",\"4\":\"Mezza giornata facile per famiglie\"},\"includes\":{\"1\":\"Biglietti d'ingresso (a seconda del pacchetto)\",\"2\":\"Guida su alcuni pacchetti\",\"3\":\"Acqua potabile\"},\"content\":{\"1\":\"Questa combinazione è perfetta quando il mare è agitato o desideri una giornata sulla terraferma tra un viaggio sull'isola e l'altro.\",\"2\":\"Prenota un trasferimento per l'attrazione con tempi porta a porta senza ritardi del furgone condiviso.\",\"3\":\"Porta scarpe da scoglio: i sentieri possono essere scivolosi dopo la pioggia.\"}},\"railay-sunset-longtail\":{\"title\":\"Railay Sunset di Longtail\",\"excerpt\":\"Breve molo per Railay per punti panoramici, arrampicate su scogliere e foto dell'ora d'oro.\",\"duration\":\"3–5 ore/sera\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Spiaggia di Railay\",\"highlights\":{\"1\":\"Longtail per Railay ovest/est\",\"2\":\"Passeggiata sulla spiaggia della grotta di Phra Nang\",\"3\":\"Tramonto su Railay Ovest\",\"4\":\"Cena facoltativa sulla spiaggia\"},\"includes\":{\"1\":\"Andata e ritorno longtail (condiviso o privato)\",\"2\":\"Giubbotto di salvataggio\"},\"content\":{\"1\":\"Railay è solo un breve tragitto in barca da Ao Nang ma sembra una destinazione diversa.\",\"2\":\"Controlla gli orari di ritorno della barca se rimani al tramonto: i longtail privati sono flessibili quando le barche pubbliche rallentano.\",\"3\":\"Possiamo lasciarti al molo di Ao Nang e attendere il ritiro del tuo reso su richiesta.\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"Destinazione\",\"Island\":\"Isola\",\"Corridor\":\"Corridoio\",\"Practical\":\"Pratico\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"Ao Nang come base di Krabi\",\"excerpt\":\"Dove alloggiare, come raggiungere il molo e come collegare spiagge, Railay e gite di un giorno.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Rimani vicino alla strada per la spiaggia per un facile accesso a Railay.\",\"2\":\"Prenota i trasferimenti al molo la sera prima delle mattine trafficate in traghetto.\",\"3\":\"Il traffico serale tra Krabi Town e Ao Nang può aggiungere 15-25 minuti.\"},\"content\":{\"1\":\"Ao Nang è la base più pratica per chi visita per la prima volta: ristoranti, banchi turistici e accesso in barca si trovano vicini.\",\"2\":\"Utilizza i trasferimenti privati dall'aeroporto di Krabi (KBV) se arrivi con i bagagli o dopo il tramonto: i taxi con tassametro e i furgoni condivisi variano nei tempi di attesa.\",\"3\":\"Da Ao Nang puoi raggiungere Railay in circa 15 minuti con la coda lunga, unirti ai viaggi delle 4 isole o collegarti ai motoscafi Phi Phi.\",\"4\":\"Se il tuo hotel è in salita o nell'entroterra, aggiungi un tempo buffer ad ogni partenza dal molo.\"}},\"railay-access-tips\":{\"title\":\"Arrivare a Railay Beach senza stress\",\"excerpt\":\"Opzioni di barca, consigli sui bagagli e quando prenotare una barca longtail privata o condivisa.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Le valigie grandi sono più facili sui longtail privati.\",\"2\":\"Railay East può essere fangoso con la bassa marea, mentre l'ovest è migliore per il tramonto.\",\"3\":\"Conferma i piani di ritorno della barca prima di cena.\"},\"content\":{\"1\":\"Railay non ha accesso stradale. Quasi tutti arrivano in barca da Ao Nang o con percorsi più lunghi da Krabi Town.\",\"2\":\"I longtail condivisi sono economici e frequenti di giorno. Le barche private costano di più ma aiutano con tempi, bambini e borse ingombranti.\",\"3\":\"Arrampicata, kayak e Phra Nang Cave Beach sono percorribili a piedi una volta arrivati: pianifica le calzature per i sentieri rocciosi.\",\"4\":\"Possiamo trasferire il tuo hotel al molo di Ao Nang e organizzare un ritiro di ritorno programmato dopo il tramonto.\"}},\"phi-phi-arrival-checklist\":{\"title\":\"Lista di controllo per l'arrivo a Phi Phi\",\"excerpt\":\"Traghetto o motoscafo, orari del molo e come collegare i trasferimenti in hotel prima e dopo la traversata.\",\"region\":\"Phi Phi/Krabi\",\"tips\":{\"1\":\"Arrivo al molo 45-60 minuti prima in alta stagione.\",\"2\":\"I motoscafi sono più veloci; i traghetti sono generalmente più fluidi ed economici.\",\"3\":\"Prenota in anticipo il trasferimento via terra in modo da non avere fretta con i bagagli.\"},\"content\":{\"1\":\"I giorni dell'isola iniziano sulla terraferma. Un trasferimento affidabile dall'hotel al molo è importante quanto il biglietto della barca stesso.\",\"2\":\"Le regole meteorologiche e del parco possono modificare l'accesso a Maya Bay: verifica con il tuo operatore il giorno prima.\",\"3\":\"La sera del ritorno, i pick-up dal molo privato supe
