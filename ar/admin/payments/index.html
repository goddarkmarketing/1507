balanceDueDriver\":\"Pay ฿{amount} in cash to the driver at pickup\",\"paymentPlanLabel\":\"Payment plan:\",\"confirmPayDriver\":\"Submit booking (awaiting staff confirmation)\",\"depositStepAdvanceTier\":\"Online deposit tiers: ≤฿1,000 → ฿200 · ฿1,001–฿2,999 → ฿500 · ≥฿3,000 → ฿1,000.\",\"toastPaymentPlan\":\"Please choose a payment plan\",\"routePreviewOfficial\":\"Official tariff\",\"routePreviewOnRequest\":\"On request\"},\"Pages\":{\"fleet\":\"أسطولنا\",\"priceList\":\"قائمة الأسعار\",\"faq\":\"الأسئلة الشائعة\",\"reviews\":\"مراجعات العملاء\",\"contact\":\"اتصل بنا\",\"articles\":\"مقالات السفر\",\"tours\":\"جولات\",\"boatSchedules\":\"جداول القوارب\",\"travelInfo\":\"معلومات السفر\",\"fleetSubtitle\":\"8 فئات من المركبات بصور حقيقية ومواصفات كاملة\",\"priceListSubtitle\":\"أسعار شفافة للتحويلات والإيجار اليومي\",\"reviewsSubtitle\":\"ردود فعل حقيقية من المسافرين عبر جنوب تايلاند\",\"contactSubtitle\":\"هل لديك أسئلة؟ فريقنا على استعداد لمساعدتك في خطط السفر إلى جنوب تايلاند.\",\"articlesSubtitle\":\"أدلة للمطار والشاطئ والرصيف، والنقل بين المقاطعات\",\"toursSubtitle\":\"رحلات يومية وتجارب الجزيرة حول كرابي\",\"boatSchedulesSubtitle\":\"أوقات مغادرة العبّارات والقوارب السريعة الوهمية\",\"travelInfoSubtitle\":\"نصائح عملية للوجهات الشهيرة في جنوب تايلاند\"},\"Site\":{\"slogan\":\"شبكة نقل موثوقة في جنوب تايلاند\",\"tagline\":\"منصة السفر والنقل في جنوب تايلاند\"},\"Faq\":{\"pageTitle\":\"الأسئلة الشائعة والسياسات\",\"pageSubtitle\":\"كل ما تحتاج لمعرفته حول الحجز والمدفوعات ومعايير الخدمة لدينا.\",\"sectionTitle\":\"الأسئلة المتداولة\",\"policiesTitle\":\"سياسات الخدمة\",\"items\":{\"1\":{\"q\":\"كيف يمكنني حجز النقل؟\",\"a\":\"حدد مواقع الالتقاء والتوصيل، ثم اختر سيارتك والتاريخ والوقت، ثم أكمل نموذج الحجز. ستتلقى قسيمة إلكترونية تحتوي على رمز الاستجابة السريعة على الفور.\"},\"2\":{\"q\":\"هل يمكنني حجز مسارات متعددة في حجز واحد؟\",\"a\":\"نعم. يدعم نظام الحجز الخاص بنا الحجوزات في اتجاه واحد، ورحلات الذهاب والإياب، ومتعددة المسارات، ومتعددة الأيام، والحجوزات المستأجرة - كل ذلك في حجز واحد.\"},\"3\":{\"q\":\"ماذا لو تأخرت رحلتي؟\",\"a\":\"نحن نراقب جداول الرحلات. بالنسبة للنقل من المطار، فإننا نوفر 60 دقيقة من وقت الانتظار المجاني من وقت هبوطك الفعلي.\"},\"4\":{\"q\":\"ما هي طرق الدفع التي تقبلونها؟\",\"a\":\"نحن نقبل التحويل المصرفي وبطاقات الائتمان/الخصم وPromptPay أثناء الحجز عبر الإنترنت (يستخدم العرض التجريبي بيانات الدفع الوهمية). يمكنك أيضًا الدفع للسائق نقدًا (بات تايلاندي) إذا تم الترتيب مسبقًا.\"},\"5\":{\"q\":\"ما هي سياسة الإلغاء الخاصة بك؟\",\"a\":\"إلغاء مجاني حتى 24 ساعة قبل الاستلام. قد يؤدي الإلغاء خلال 24 ساعة إلى فرض رسوم بنسبة 50%. عدم الحضور غير قابل للاسترداد.\"},\"6\":{\"q\":\"هل توفرون مقاعد للأطفال؟\",\"a\":\"نعم، تتوفر مقاعد الأطفال عند الطلب دون أي رسوم إضافية. يرجى تحديد عمر/وزن الأطفال عند الحجز.\"},\"7\":{\"q\":\"هل الأسعار شاملة؟\",\"a\":\"نعم. تشمل الأسعار المذكورة رسوم المرور ومواقف السيارات والوقود وخدمة السائق. تنطبق الرسوم الإضافية فقط على انتظار العمل الإضافي أو الإضافات الاختيارية التي تطلبها.\"},\"8\":{\"q\":\"كيف يمكنني الحصول على قسيمتي الإلكترونية؟\",\"a\":\"بعد تأكيد حجزك، تظهر قسيمة إلكترونية تحتوي على رمز QR على الفور ويمكن إعادة فتحها في أي وقت من صفحة الحجز الخاصة بك. أظهرها للسائق عند الالتقاط.\"},\"9\":{\"q\":\"What documents and deposit are needed for car rental?\",\"a\":\"Please prepare an ID card or driver’s license, round-trip flight tickets in your name, and a reachable phone number. Security deposit is ฿3,000 for small cars and ฿5,000 for large cars. Pay ฿500 in advance when the car is confirmed; pay the rental fee and remaining deposit on contract day. The deposit is refunded after return and inspection. Free Krabi Airport pickup and drop-off is included.\"}},\"policies\":{\"waiting\":{\"title\":\"وقت الانتظار\",\"content\":\"تشمل خدمات الاستقبال في المطار انتظارًا مجانيًا لمدة 60 دقيقة. تشمل عمليات الاستقبال في الفندق/الرصيف انتظارًا مجانيًا لمدة 15 دقيقة. تبلغ تكلفة الانتظار الإضافي 200 بات تايلاندي لكل 30 دقيقة.\"},\"flight-delay\":{\"title\":\"تأخير الرحلة\",\"content\":\"نحن نتتبع رقم رحلتك ونضبط وقت الالتقاء تلقائيًا. لا توجد رسوم إضافية للتأخير لمدة تصل إلى ساعتين.\"},\"child-seat\":{\"title\":\"مقعد الطفل\",\"content\":\"تتوفر مقاعد الرضع والأطفال الصغار والمقاعد الداعمة مجانًا. الطلب أثناء الحجز.\"},\"pets\":{\"title\":\"الحيوانات الأليفة\",\"content\":\"نرحب بالحيوانات الأليفة الصغيرة في شركات النقل في فئتي سيارات الدفع الرباعي والشاحنات الصغيرة. قد يتم تطبيق رسوم تنظيف إضافية بقيمة 300 بات تايلاندي.\"},\"ferry\":{\"title\":\"اتصالات العبارة\",\"content\":\"تشمل عمليات النقل من الرصيف النزول في محطة العبارات. يمكن ترتيب تذاكر العبّارة كخدمة إضافية.\"},\"toll\":{\"title\":\"عدد القتلى ومواقف السيارات\",\"content\":\"يتم تضمين جميع رسوم المرور ورسوم مواقف السيارات في المطارات/الأرصفة البحرية في السعر المعروض.\"},\"payment\":{\"title\":\"الدفع\",\"content\":\"ادفع عبر الإنترنت عن طريق البطاقة/التحويل أو نقدًا للسائق بعملة بات تايلاندي. الأسعار شاملة ما لم ينص على خلاف ذلك.\"},\"cancellation\":{\"title\":\"الإلغاء\",\"content\":\"إلغاء مجاني قبل 24 ساعة من موعد الاستلام. خلال 24 ساعة: 50% رسوم. عدم الحضور: عدم استرداد المبلغ.\"},\"refund\":{\"title\":\"استرداد\",\"content\":\"تتم معالجة المبالغ المستردة المعتمدة في غضون 5 إلى 7 أيام عمل إلى طريقة الدفع الأصلية.\"},\"rental-deposit\":{\"title\":\"Car rental deposit\",\"content\":\"Small cars: ฿3,000 deposit. Large cars: ฿5,000 deposit. After confirmation, pay ฿500 advance deposit first. Pay rental fee and remaining deposit on contract day. Deposit is refunded after car return and inspection. Free Krabi Airport pickup \u0026 drop-off.\"}}},\"Reviews\":{\"pageTitle\":\"مراجعات العملاء\",\"pageSubtitle\":\"ردود فعل حقيقية من المسافرين عبر جنوب تايلاند.\",\"items\":{\"1\":{\"country\":\"المملكة المتحدة\",\"comment\":\"نقل سلس من مطار كرابي إلى آو نانغ. كان السائق ينتظر مع الإشارة، وكانت السيارة نظيفة ومريحة.\",\"route\":\"مطار KBV → شاطئ آو نانغ\"},\"2\":{\"country\":\"ألمانيا\",\"comment\":\"حجزت رحلة ذهابًا وإيابًا إلى شاطئ رايلاي. التواصل الممتاز والخدمة الدقيقة في كلا الاتجاهين.\",\"route\":\"مطار KBV ↔ شاطئ رايلاي\"},\"3\":{\"country\":\"اليابان\",\"comment\":\"سيارة VIP لعائلتنا المكونة من 6 أفراد كانت مثالية. أحب الأطفال المناشف الباردة والوجبات الخفيفة!\",\"route\":\"مطار KBV → سينتارا جراند\"},\"4\":{\"country\":\"إيطاليا\",\"comment\":\"خدمة نقل جيدة بين المقاطعات إلى فوكيت. تأخر قليلاً بسبب حركة المرور ولكن السائق أبقينا على اطلاع.\",\"route\":\"كرابي → مطار فوكيت\"},\"5\":{\"country\":\"أستراليا\",\"comment\":\"خدمة الاستقبال في الفندق إلى الرصيف كانت على الفور. ساعد السائق في حمل الحقائب وحدد توقيت كل شيء لعبّارة Phi Phi.\",\"route\":\"فندق آو نانغ → رصيف آو نانغ\"},\"6\":{\"country\":\"فرنسا\",\"comment\":\"حجزت خدمة النقل إلى الشاطئ إلى Railay عبر الرصيف. مسح التحديثات على LINE وشاحنة نظيفة لأمتعتنا.\",\"route\":\"مدينة كرابي → رصيف رايلاي\"},\"7\":{\"country\":\"تايلاند\",\"comment\":\"استخدمها في رحلات متعددة الأيام حول كرابي. الحجز سهل، وسعر عادل، والسائقون دائمًا في الوقت المحدد.\",\"route\":\"الميثاق اليومي · كرابي\"}}},\"Transfer\":{\"fromEco\":\"سيدان اقتصادية من\",\"book\":\"كتاب\",\"bookRoute\":\"حجز هذا الطريق\",\"popularRoutes\":\"الطرق الشعبية\",\"popularRoutesHint\":\"عينة من أسعار سيارات السيدان الاقتصادية. السعر النهائي يعتمد على المركبة والتاريخ.\",\"route\":\"الطريق\",\"distance\":\"المسافة\",\"duration\":\"المدة\",\"fromPrice\":\"من (ايكو)\",\"recommended\":\"المركبات الموصى بها\",\"recommendedBody\":\"اختر مركبة تناسب حجم مجموعتك وأمتعتك.\",\"ctaTitle\":\"جاهز للحجز {title}؟\",\"ctaBody\":\"احصل على قسيمة إلكترونية فورية مع رمز الاستجابة السريعة بعد الحجز.\",\"howTitle\":\"كيف يعمل الحجز\",\"howSubtitle\":\"ثلاث خطوات بسيطة من الاقتباس إلى الاستلام.\",\"step1Title\":\"اختر طريقك\",\"step1Body\":\"حدد الالتقاط والتوصيل والتاريخ والمركبة.\",\"step2Title\":\"تأكيد والدفع\",\"step2Body\":\"ادفع بأمان واحصل على قسيمتك الإلكترونية باستخدام QR.\",\"step3Title\":\"تعرف على سائقك\",\"step3Body\":\"تصل تفاصيل السائق قبل الاستلام. استرخ واركب.\",\"includedTitle\":\"ما هو مدرج\",\"otherServices\":\"خدمات نقل أخرى\",\"viewPrices\":\"عرض قائمة الأسعار\",\"startBooking\":\"ابدأ الحجز\",\"km\":\"{n} كم\",\"approxMin\":\"~{n} دقيقة\",\"tipLabel\":\"من الجيد أن نعرف\",\"categories\":{\"airport\":\"المطار\",\"hotel\":\"فندق\",\"pier\":\"الرصيف\",\"beach\":\"الشاطئ\",\"city\":\"المدينة\",\"attraction\":\"الجذب\",\"inter-province\":\"مقاطعة إنتر\"},\"faqTitle\":\"الأسئلة الشائعة لهذه الخدمة\",\"faqSubtitle\":\"إجابات سريعة قبل الحجز.\",\"reviewsTitle\":\"ماذا يقول المسافرون\",\"allReviews\":\"جميع التقييمات\",\"allFaq\":\"جميع الأسئلة الشائعة\",\"includedBadge\":\"متضمنة\"},\"TransferPages\":{\"airport-transfer\":{\"title\":\"نقل المطار\",\"subtitle\":\"النقل الخاص من وإلى مطاري كرابي وجنوب تايلاند\",\"intro\":\"شاحنات صغيرة في توقيت الرحلة مع خيارات الاستقبال والترحيب، ومساحة للأمتعة، ورحلات مباشرة إلى الفنادق والشواطئ والأرصفة البحرية.\",\"tip\":\"شارك رقم رحلتك عند الحجز. نقاط الالتقاء بمطار كرابي: الباب المحلي 15، الباب الدولي 16 - انظر إلى اليسار بعد الخروج.\",\"benefit1\":\"مراقبة الرحلات الجوية ووقت الانتظار المرن\",\"benefit2\":\"اللقاء والترحيب عند القادمين عند الطلب\",\"benefit3\":\"مساحة لحقائب السفر - خيارات من سيارة السيدان إلى الشاحنة\",\"faq\":{\"1\":{\"q\":\"ماذا لو تأخرت رحلتي؟\",\"a\":\"نحن نراقب الرحلات الجوية الخاصة بالتوصيل من المطار ونضمن حوالي 60 دقيقة من الانتظار المجاني من وقت هبوطك الفعلي.\"},\"2\":{\"q\":\"هل تقدمون اللقاء والترحيب؟\",\"a\":\"نعم. أضف رقم رحلتك عند الحجز. في مطار كرابي، يخرج الوافدون المحليون من الباب 15 ويخرج القادمون الدوليون من الباب 16، ثم انظر إلى اليسار - ينتظر السائق واسمك على لافتة.\"},\"3\":{\"q\":\"ما مقدار الأمتعة التي يمكنني إحضارها؟\",\"a\":\"سيارات السيدان الاقتصادية تناسب حوالي 3 حقائب متوسطة الحجم. للمزيد من الأمتعة أو للعائلة، اختر سيارة الدفع الرباعي أو الشاحنة أو سيارة VIP في نموذج الحجز.\"},\"4\":{\"q\":\"هل يمكنك الاستقبال في مطار فوكيت أيضًا؟\",\"a\":\"نعم. نحن نغطي مطارات كرابي (KBV) ومطارات مختارة في جنوب تايلاند بما في ذلك فوكيت، مع أسعار خاصة من نقطة إلى نقطة.\"},\"5\":{\"q\":\"كيف أدفع مقابل خدمة نقل المطار؟\",\"a\":\"ادفع عبر الإنترنت عن طريق التحويل المصرفي أو البطاقة أو PromptPay عند الحجز. يمكن ترتيب الدفع نقدًا للسائق مسبقًا إذا لزم الأمر.\"},\"6\":{\"q\":\"متى أحصل على تفاصيل السائق؟\",\"a\":\"تتم مشاركة اسم السائق والهاتف وتفاصيل السيارة قبل الاستلام — عادةً خلال 24 ساعة من وقت النقل.\"}}},\"hotel-transfer\":{\"title\":\"نقل الفندق\",\"subtitle\":\"جولات من الباب إلى الباب بين المنتجعات والفنادق والمواقع الرئيسية في كرابي\",\"intro\":\"سيارة خاصة تصل إلى ردهة الفندق أو بوابة الفيلا - لا توجد حافلات مشتركة، ولا محطات إضافية.\",\"tip\":\"أضف اسم فندقك أو دبوسًا في ملاحظات الحجز لتسهيل عملية النزول.\",\"benefit1\":\"الاستلام والتوصيل من الباب إلى الباب\",\"benefit2\":\"مثالية لتسجيل الوصول المتأخر والمغادرة المبكرة\",\"benefit3\":\"خيارات متميزة وVIP للإقامات الخاصة\",\"faq\":{\"1\":{\"q\":\"هل ستوصلني إلى بهو الفندق؟\",\"a\":\"نعم. يتم النقل من الباب إلى الباب إلى الردهة أو بوابة الفيلا. أضف اسم الفندق أو دبوس الخريطة في ملاحظات الحجز الخاصة بك.\"},\"2\":{\"q\":\"هل يمكنني حجز خدمة التوصيل من الفندق في وقت متأخر من الليل؟\",\"a\":\"نعم. تتوفر خدمات النقل الخاصة عند المغادرة المبكرة وتسجيل الوصول المتأخر - اختر التاريخ والوقت عند الحجز.\"},\"3\":{\"q\":\"هل هذه مكوك مشترك؟\",\"a\":\"لا، كل حجز عبارة عن سيارة خاصة لمجموعتك فقط، دون توقف إضافي في الفندق.\"},\"4\":{\"q\":\"ما هي السيارة الأفضل للإقامة في المنتجع؟\",\"a\":\"سيارة السيدان الفاخرة أو الفئة المميزة تناسب الأزواج؛ تعتبر سيارة VIP مثالية للعائلات والأمتعة الإضافية.\"},\"5\":{\"q\":\"هل يمكنني تغيير موعد التوصيل إلى الفندق بعد الحجز؟\",\"a\":\"نعم، إذا كان الفندق الجديد قريب. قم بمراسلتنا على LINE مع رقم الحجز الخاص بك في أقرب وقت ممكن.\"},\"6\":{\"q\":\"هل تنتظر إذا تأخر تسجيل الوصول؟\",\"a\":\"فترات الانتظار القصيرة في الفندق جيدة. بالنسبة للتأخيرات الأطول، أخبرنا على LINE حتى يتمكن السائق من التكيف.\"}}},\"pier-transfer\":{\"title\":\"نقل الرصيف\",\"subtitle\":\"اتصالات موثوقة إلى أرصفة العبارات والقوارب السريعة\",\"intro\":\"يمكنك الوصول في الوقت المحدد لمغادرة Phi Phi وRailey والجزيرة مع السائقين الذين يعرفون جداول الرصيف.\",\"tip\":\"احجز ما لا يقل عن 45-60 دقيقة قبل مغادرة العبارة من آو نانغ أو المدينة.\",\"benefit1\":\"توقيت مغادرة القوارب والعبارات\",\"benefit2\":\"مساعدة في الحقائب إلى مدخل الرصيف\",\"benefit3\":\"روابط من المطار أو الفندق أو الشاطئ\",\"faq\":{\"1\":{\"q\":\"في أي وقت يجب أن أصل قبل العبارة؟\",\"a\":\"خطط للوصول إلى الرصيف قبل 45-60 دقيقة من المغادرة من آو نانج أو مدينة كرابي، خاصة في موسم الذروة.\"},\"2\":{\"q\":\"هل يمكن للسائق المساعدة في حمل الحقائب على الرصيف؟\",\"a\":\"نعم. يساعد السائقون في نقل الأمتعة إلى مدخل الرصيف حتى تتمكن من تسجيل الوصول لقاربك بسهولة أكبر.\"},\"3\":{\"q\":\"هل تتصل بقوارب Phi Phi و Railay؟\",\"a\":\"نعم. تشمل نقاط الانحدار الشهيرة رصيف Ao Nang وخطوط المواصلات المؤدية إلى خدمات قوارب Phi Phi وRailey.\"},\"4\":{\"q\":\"أين يمكنني التحقق من أوقات القارب؟\",\"a\":\"راجع صفحة جداول القوارب الخاصة بنا للحصول على نماذج لأوقات العبّارات والقوارب السريعة، ثم قم بحجز خدمة النقل من الرصيف الخاص بك بما يناسبها.\"},\"5\":{\"q\":\"ماذا لو تم إلغاء القارب الخاص بي؟\",\"a\":\"اتصل بنا على الفور. يمكننا إعادة جدولة عملية النقل أو المساعدة في ضبط عملية الإنزال عندما يقوم مشغلو القوارب بتغيير الأوقات.\"},\"6\":{\"q\":\"هل يمكنني حجز الفندق ← الرصيف ← الفندق في نفس اليوم؟\",\"a\":\"نعم. أضف كلا الرحلتين في حجز واحد كمسارات متعددة، أو احجز رحلتي نقل في اتجاه واحد مع أوقات متطابقة.\"}}},\"beach-transfer\":{\"title\":\"نقل الشاطئ\",\"subtitle\":\"رحلات مباشرة إلى آو نانج ورايلاي وباتونج والمناطق الساحلية\",\"intro\":\"تخطي سيارات الأجرة عند الرصيف - انتقل مباشرة من المطار أو الفندق إلى الشاطئ بأجرة خاصة ثابتة.\",\"tip\":\"قد يشمل الوصول إلى Railay قفزة قصيرة بالقارب من الرصيف. اسألنا عند الحجز.\",\"benefit1\":\"أجرة خاصة ثابتة، لا مفاجآت على العداد\",\"benefit2\":\"نقاط النزول إلى الشاطئ والمنتجع\",\"benefit3\":\"المركبات العائلية والجماعية متاحة\",\"faq\":{\"1\":{\"q\":\"هل الأجرة ثابتة إلى الشاطئ؟\",\"a\":\"نعم. تستخدم وسائل النقل الخاصة إلى الشاطئ أجرة ثابتة لسيارتك - ولا توجد مفاجآت عند الرصيف.\"},\"2\":{\"q\":\"كيف أصل إلى شاطئ رايلاي؟\",\"a\":\"يركب معظم الضيوف إلى منطقة رصيف رايلاي، ثم يستقلون رحلة طويلة مشتركة قصيرة. أخبرنا عند الحجز إذا كنت بحاجة إلى مساعدة في توقيت الرصيف.\"},\"3\":{\"q\":\"هل يمكنك النزول إلى المنتجعات الشاطئية؟\",\"a\":\"نعم. ننزل في الفنادق المطلة على الشاطئ ونقاط الوصول إلى الشاطئ المتفق عليها عبر آو نانغ وروابط رايلاي والمناطق الساحلية.\"},\"4\":{\"q\":\"ماذا لو كان لدي أطفال والكثير من الحقائب؟\",\"a\":\"اختر سيارة الدفع الرباعي أو الشاحنة للحصول على مساحة إضافية. يمكن طلب مقاعد الأطفال مسبقًا عبر ملاحظات الحجز أو الخط.\"},\"5\":{\"q\":\"هل تذهب إلى الشواطئ الأكثر هدوءًا أيضًا؟\",\"a\":\"نعم، حيث يسمح الوصول إلى الطريق. أضف اسم الشاطئ أو المنتجع في الملاحظات وسنقوم بتأكيد أفضل نقطة إنزال.\"},\"6\":{\"q\":\"هل الذهاب والعودة إلى الشاطئ أرخص؟\",\"a\":\"تتضمن حجوزات الرحلات ذهابًا وإيابًا خصمًا صغيرًا مقابل رحلتين منفصلتين في اتجاه واحد. استخدم مدقق الأسعار للمقارنة.\"}}},\"city-transfer\":{\"title\":\"نقل المدينة\",\"subtitle\":\"رحلات مريحة بين المدن في جميع أنحاء جنوب تايلاند\",\"intro\":\"مدينة كرابي، وترانج، وسورات ثاني، والمزيد - سيارات خاصة للمهمات والفنادق والتنقلات اليومية.\",\"tip\":\"بالنسبة للجري متعدد المحطات في المدينة، قم بتدوين كل محطة في تعليقات الحجز.\",\"benefit1\":\"من نقطة إلى نقطة أو توقف متعدد عند الطلب\",\"benefit2\":\"راحة مكيفة للتنقلات الطويلة في المدينة\",\"benefit3\":\"سيارة سيدان إلى شاحنة للعائلات والأمتعة\",\"faq\":{\"1\":{\"q\":\"هل يمكنني التوقف عدة مرات في المدينة؟\",\"a\":\"نعم، عند الطلب. قم بإدراج كل محطة في ملاحظات الحجز حتى نتمكن من تخطيط الوقت وعرض الأسعار بشكل عادل.\"},\"2\":{\"q\":\"هل تغطي ترانج وسورات ثاني؟\",\"a\":\"نعم. تشمل خدمات النقل بين المدن والبلدات مدينة كرابي بالإضافة إلى مدن جنوبية مختارة لرحلات خاصة من نقطة إلى نقطة.\"},\"3\":{\"q\":\"هل السيارة مكيفة ؟\",\"a\":\"جميع مركبات النقل مكيفة ومناسبة للحرارة أثناء النهار والقفزات الطويلة في المدينة.\"},\"4\":{\"q\":\"هل يمكنني الحجز في نفس اليوم في المدينة؟\",\"a\":\"في كثير من الأحيان نعم، رهن التوفر. احجز عبر الإنترنت في أقرب وقت ممكن، أو راسلنا على LINE للرحلات العاجلة.\"},\"5\":{\"q\":\"هل يمكنني الاحتفاظ بالسيارة لبضع ساعات في المدينة؟\",\"a\":\"للانتظار أو الاستخدام بالساعة، اختر ميثاق الساعة أو لاحظ وقت الانتظار عند الحجز حتى نتمكن من عرض الأسعار بشكل صحيح.\"},\"6\":{\"q\":\"هل تلتقط من محطات الحافلات أو القطار؟\",\"a\":\"نعم، حيث المدرجة في مواقعنا. حدد المحطة كمحطة الالتقاط أو التوصيل في نموذج الحجز.\"}}},\"attraction-transfer\":{\"title\":\"نقل الجذب\",\"subtitle\":\"المعابد، وحمامات الزمرد، والينابيع الساخنة، ووجهات النظر\",\"intro\":\"خدمات نقل خاصة إلى أهم المعالم السياحية في كرابي مع خيارات الانتظار والعودة للرحلات اليومية.\",\"tip\":\"اطلب الانتظار والعودة إذا كنت تريد نفس السيارة لرحلة العودة.\",\"benefit1\":\"طرق المنتزهات والمعابد الشعبية\",\"benefit2\":\"خيارات الرحلات النهارية للانتظار والعودة\",\"benefit3\":\"عربات صغيرة للمجموعات الصغيرة ومعدات الرحلات\",\"faq\":{\"1\":{\"q\":\"هل يمكن للسائق الانتظار أثناء زيارتنا؟\",\"a\":\"نعم. اطلب الانتظار والعودة عند الحجز حتى تتمكن نفس السيارة من إعادتك بعد Emerald Pool أو المعابد أو الينابيع الساخنة.\"},\"2\":{\"q\":\"ما هي المعالم السياحية التي تغطيها؟\",\"a\":\"تشمل القطرات الشهيرة مسبح إميرالد ومعبد كهف النمر والينابيع الساخنة ومتنزهات ووجهات نظر كرابي الأخرى.\"},\"3\":{\"q\":\"هل الشاحنة أفضل ليوم من مشاهدة المعالم السياحية؟\",\"a\":\"بالنسبة للضيوف الذين يزيد عددهم عن 4 أشخاص أو الملابس المبللة بعد السباحة، تعتبر الشاحنة أو شاحنة VIP أكثر راحة من سيارة السيدان.\"},\"4\":{\"q\":\"هل تذاكر الدخول تأتي مع النقل؟\",\"a\":\"لا، أسعار النقل تغطي النقل فقط. يتم دفع تذاكر المنتزه والمعبد في الموقع ما لم تقم بحجز جولة منفصلة.\"},\"5\":{\"q\":\"هل يمكننا زيارة أكثر من معلم سياحي؟\",\"a\":\"نعم. قم بإدراج ترتيب نقاط التوقف في ملاحظات الحجز، أو احجز رحلة متعددة المسارات / يومية للحصول على حلقة كاملة لمشاهدة معالم المدينة.\"},\"6\":{\"q\":\"في أي وقت يجب أن نغادر لرؤية الصباح؟\",\"a\":\"بالنسبة للأماكن الشهيرة مثل Emerald Pool، تساعد البداية المبكرة على تجنب الحرارة والازدحام - يمكننا اقتراح وقت الالتقاء عند الحجز.\"}}},\"inter-province-transfer\":{\"title\":\"نقل بين المحافظات\",\"subtitle\":\"النقل الخاص لمسافات طويلة عبر جنوب تايلاند\",\"intro\":\"كرابي-فوكيت، ترانج، سورات ثاني وما بعدها - سيارات الدفع الرباعي الخاصة، أو الشاحنات الصغيرة، أو الحافلات لسفر مريح على الطرق السريعة.\",\"tip\":\"يتم حجز الرحلات الطويلة في عطلات نهاية الأسبوع - احجز مبكرًا للمغادرة في الصباح.\",\"benefit1\":\"خيارات سيارات الدفع الرباعي والشاحنات والحافلات الجاهزة للطرق السريعة\",\"benefit2\":\"أجرة ثابتة للرحلات من مقاطعة إلى مقاطعة\",\"benefit3\":\"مثالية للمجموعات التي لديها أمتعة ومعدات\",\"faq\":{\"1\":{\"q\":\"ما هي السيارة الأفضل للرحلات الطويلة على الطرق السريعة؟\",\"a\":\"سيارات الدفع الرباعي أو الشاحنة للراحة؛ حافلة أو حافلة VIP للمجموعات الكبيرة والمزيد من الأمتعة على طرق كرابي-فوكيت أو سورات.\"},\"2\":{\"q\":\"هل السعر ثابت بين المحافظات؟\",\"a\":\"نعم. تستخدم خدمات النقل بين المقاطعات أجرة خاصة ثابتة للمركبة التي اخترتها، ويتم الاتفاق عليها قبل الدفع.\"},\"3\":{\"q\":\"في أي وقت مبكر يجب أن أحجز رحلات عطلة نهاية الأسبوع؟\",\"a\":\"تمتلئ عطلات نهاية الأسبوع والعطلات مبكرًا - احجز رحلات المغادرة الصباحية قبل يوم واحد على الأقل عندما يكون ذلك ممكنًا.\"},\"4\":{\"q\":\"هل تشمل رسوم الطرق السريعة؟\",\"a\":\"تشمل أسعار النقل المذكورة رسوم المرور القياسية ومواقف السيارات المتعلقة بالرحلة ما لم يُذكر خلاف ذلك عند الحجز.\"},\"5\":{\"q\":\"هل نقاط الاستراحة مشمولة في الرحلات الطويلة؟\",\"a\":\"يمكن للسائقين التوقف لفترة وجيزة للحصول على المراحيض أو الوجبات الخفيفة في الرحلات الطويلة على الطرق السريعة. اذكر الفواصل المفضلة في ملاحظاتك.\"},\"6\":{\"q\":\"هل يمكنك الذهاب من كرابي إلى فوكيت مع التوصيل إلى الفندق؟\",\"a\":\"نعم. اختر فندقك أو مطار فوكيت الخاص بك كنقطة توصيل - من نقطة إلى نقطة خاصة، وليس حافلة مشتركة.\"}}}},\"Vehicles\":{\"amenities\":{\"ac\":\"تكييف الهواء\",\"water\":\"المياه المعبأة في زجاجات\",\"charger\":\"شاحن الهاتف\",\"legroom\":\"مساحة إضافية للأرجل\",\"groupSeating\":\"جلوس جماعي\",\"leather\":\"مقاعد جلدية\",\"wifi\":\"واي فاي\",\"snacks\":\"وجبات خفيفة\",\"meetGreet\":\"لقاء وتحية\",\"luxury\":\"سيدان فاخرة\",\"premium\":\"وسائل راحة allArticles\":\"جميع المقالات\",\"allTours\":\"جميع الجولات\",\"allTravel\":\"جميع معلومات السفر\",\"relatedArticles\":\"مقالات ذات صلة\",\"relatedTours\":\"الجولات ذات الصلة\",\"bookRoute\":\"هل أنت مستعد لحجز هذا الطريق؟\",\"startBooking\":\"ابدأ الحجز\",\"highlights\":\"أبرز\",\"includes\":\"يتضمن عادة\",\"bookTransfer\":\"نقل الكتاب\",\"inquire\":\"استفسر\",\"quickTips\":\"نصائح سريعة\",\"planTransfer\":\"خطط للنقل بعد ذلك\",\"moreGuides\":\"المزيد من الأدلة\",\"boatType\":\"نوع القارب\",\"allBoats\":\"جميع القوارب\",\"ferry\":\"العبارة\",\"speedboat\":\"قارب سريع\",\"longtail\":\"ذيل طويل\",\"route\":\"الطريق\",\"allRoutes\":\"جميع الطرق\",\"departures\":\"المغادرين\",\"duration\":\"المدة\",\"transferTo\":\"تحويل إلى {pier}\",\"landTransfer\":\"نقل الأرض إلى الرصيف\",\"emptyBoats\":\"لا توجد جداول زمنية تتطابق مع عوامل التصفية الخاصة بك.\",\"mockBanner\":\"جداول القارب الوهمي للتخطيط - قد تختلف الأوقات في الواقع.\",\"ctaArticlesBody\":\"تحقق من الأسعار المباشرة وحجز سيارة خاصة باستخدام قسيمة إلكترونية فورية.\",\"bookRouteBody\":\"احصل على سعر فوري وقسيمة إلكترونية مع رمز الاستجابة السريعة.\",\"relatedBoats\":\"طرق القوارب ذات الصلة\",\"landTransferBody\":\"نحن لا نبيع تذاكر العبّارة - فنحن نوصلك إلى نقطة المغادرة في الوقت المحدد.\",\"tourCtaTitle\":\"حجز الرصيف أو نقل الفندق\",\"tourCtaBody\":\"يتم بيع تذاكر الجولة من قبل المشغلين المحليين. سنوصلك إلى رصيف الاجتماعات في الوقت المحدد باستخدام قسيمة إلكترونية.\",\"toursCtaBody\":\"أسعار الجولات هي تقديرات المشغلين (وهمية). نحن نتعامل مع عمليات النقل من الفندق إلى الرصيف باستخدام قسيمة إلكترونية فورية.\",\"travelCtaBody\":\"تحقق من أوقات القارب، ثم احجز وسيلة نقل خاصة إلى الرصيف أو الفندق.\"},\"Articles\":{\"categories\":{\"Airport\":\"المطار\",\"Beach\":\"الشاطئ\",\"Pier\":\"الرصيف\",\"Inter Province\":\"مقاطعة إنتر\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"دليل النقل من مطار كرابي: الوصول السلس إلى KBV\",\"excerpt\":\"ما الذي يمكن توقعه بعد الهبوط في مطار كرابي الدولي، وكيفية عمل الاستقبال والترحيب، وكيفية حجز وسيلة نقل خاصة باستخدام قسيمة إلكترونية.\",\"p1\":\"الهبوط في مطار كرابي الدولي (KBV) هو بداية رحلتك إلى جنوب تايلاند. تساعدك خدمة نقل المطار الخاصة على تخطي طوابير سيارات الأجرة والذهاب مباشرة إلى الفندق أو الشاطئ أو الرصيف.\",\"p2\":\"مع Krabi Links Taxi، يتتبع سائقك الرحلة ويتضمن وقت انتظار مجاني للنقل من المطار. ستتلقى قسيمة إلكترونية تحتوي على رمز الاستجابة السريعة مباشرة بعد الحجز - قم بإظهارها في نقطة الالتقاء.\",\"p3\":\"تشمل الطرق الشهيرة من KBV شاطئ آو نانغ، ورايلي، وسنتارا غراند، ومدينة كرابي. اختر سيارة سيدان اقتصادية للأزواج أو سيارة فان إذا كنت تسافر مع العائلة والأمتعة.\",\"p4\":\"نصيحة: قم بمشاركة رقم رحلتك واسم الفندق عند الحجز حتى يتمكن السائق من إعداد لافتة اسم وتخطيط أفضل طريق حول حركة المرور المسائية.\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"نصائح حول نقل شاطئ آو نانغ ورايلي\",\"excerpt\":\"كيفية التنقل بين آونانغ ورايلاي والمنتجعات القريبة باستخدام السيارات الخاصة والأرصفة والمركبة المناسبة لحقائب الشاطئ.\",\"p1\":\"تُعد آو نانغ مركزًا للعديد من الإقامات على شاطئ كرابي، بينما يمكن الوصول إلى رايلاي عبر وصلات قصيرة على الرصيف. التخطيط لعملية النقل الخاصة بك مسبقًا يجعل اليوم بسيطًا.\",\"p2\":\"من المطار أو مدينة كرابي، احجز خدمة التوصيل الخاصة إلى شاطئ آو نانغ أو فندقك. بالنسبة لـ Railay، يمكننا أن نأخذك إلى الرصيف ونساعدك في تحديد وقت اتصال القارب الخاص بك.\",\"p3\":\"إذا كنت تحمل معدات الغطس أو حقائب كبيرة، فإن سيارة الدفع الرباعي أو الشاحنة القياسية توفر مساحة أكبر من سيارة السيدان. كما توفر حجوزات الرحلات ذهابًا وإيابًا الوقت في يوم الخروج.\",\"p4\":\"يمكن أن تكون العودة المسائية من الشاطئ مزدحمة - احجز وقت الالتقاء مبكرًا، خاصة في عطلات نهاية الأسبوع والعطلات الرسمية.\"},\"pier-transfer-to-phi-phi\":{\"title\":\"نقل الرصيف إلى فاي فاي: ما يجب أن يعرفه المسافرون\",\"excerpt\":\"قائمة مرجعية عملية للانتقالات من الفندق إلى الرصيف، وتوقيت العبّارة، ونصائح حول الأمتعة قبل التوجه إلى فاي فاي.\",\"p1\":\"تبدأ أيام الجزيرة على الأرض. إن النقل الموثوق به من الرصيف من فندقك أو المطار يعني أنك تصل إلى رصيف آو نانغ أو نقاط المغادرة الأخرى دون التسرع.\",\"p2\":\"تخصيص وقت عازل لتسجيل الوصول والصعود إلى الطائرة. نوصي بالوصول إلى الرصيف قبل 45-60 دقيقة على الأقل من مغادرة العبارة خلال موسم الذروة.\",\"p3\":\"تعتبر الشاحنات الخاصة مثالية للمجموعات التي تتشارك نفس العبارة. يمكن للعائلات طلب مقاعد الأطفال مجانًا عند الحجز.\",\"p4\":\"بعد رحلتك إلى الجزيرة، احجز خدمة التوصيل من الرصيف حتى يكون السائق جاهزًا عندما يرسو القارب - وهو أمر مفيد بشكل خاص إذا وصلت بعد حلول الظلام.\"},\"krabi-to-phuket-inter-province\":{\"title\":\"النقل من كرابي إلى فوكيت بين المقاطعات\",\"excerpt\":\"قارن الراحة والتوقيت في ممر كرابي-فوكيت، وخيارات المركبات، ومتى تتفوق وسائل النقل الخاصة على الشاحنات المشتركة.\",\"p1\":\"يعد طريق كرابي-فوكيت واحدًا من أكثر طرق النقل بين المقاطعات طلبًا في جنوب تايلاند. توفر السيارات الخاصة توقيتًا للوصول من الباب إلى الباب دون توقفات متعددة.\",\"p2\":\"تربط الرحلات النموذجية مدينة KBV أو مدينة كرابي بمطار بوكيت أو باتونج. يعتمد وقت السفر على حركة المرور وما إذا كنت تبدأ من المطار أو المدينة.\",\"p3\":\"للرحلات الطويلة، توفر خيارات VIP Van أو Mini Bus مساحة وراحة أكبر. الأسعار شاملة رسوم المرور ومواقف السيارات ما لم تقم بإضافة وقت الانتظار.\",\"p4\":\"احجز رحلة ذهابًا وإيابًا إذا سافرت إلى مقاطعة واحدة وخارج الأخرى - يغطي الحجز الواحد كلا الرحلتين بقسيمة إلكترونية واحدة.\"}}},\"Admin\":{\"loading\":\"جارٍ التحميل…\",\"loginTitle\":\"تسجيل الدخول المشرف\",\"loginHint\":\"التجريبي: {user} / {pass}\",\"username\":\"اسم المستخدم\",\"password\":\"كلمة المرور\",\"signIn\":\"تسجيل الدخول\",\"loginError\":\"اسم المستخدم أو كلمة المرور غير صالحة\",\"logout\":\"تسجيل الخروج\",\"backToSite\":\"العودة إلى الموقع\",\"panelTitle\":\"العمليات\",\"opsLabel\":\"المكتب الخلفي · العرض التوضيحي\",\"nav\":{\"dashboard\":\"لوحة القيادة\",\"bookings\":\"الحجوزات\",\"payments\":\"المدفوعات\",\"schedule\":\"الجدول الزمني\",\"drivers\":\"السائقين\",\"customers\":\"العملاء\",\"prices\":\"جداول الأسعار\",\"vehicles\":\"المركبات\",\"settings\":\"الإعدادات\"},\"dashboardTitle\":\"لوحة القيادة\",\"dashboardSubtitle \":{\"categories\":{\"Island\":\"الجزيرة\",\"Snorkel\":\"اشنركل\",\"Kayak\":\"كاياك\",\"Sightseeing\":\"مشاهدة المعالم السياحية\",\"Combo\":\"كومبو\"},\"items\":{\"phi-phi-islands-day-trip\":{\"title\":\"رحلة نهارية إلى جزر فاي فاي\",\"excerpt\":\"رحلة نهارية كلاسيكية في أندامان مع إطلالة على خليج مايا وتوقف الغطس والغداء على الشاطئ.\",\"duration\":\"يوم كامل (~ 8-9 ساعات)\",\"fromArea\":\"آو نانج / كرابي\",\"toArea\":\"جزر فاي فاي\",\"highlights\":{\"1\":\"وجهة نظر خليج مايا (تخضع لقواعد المنتزه)\",\"2\":\"اشنركل في الشعاب المرجانية الصافية\",\"3\":\"غداء على الشاطئ في جزيرة Phi Phi Don أو الخليج القريب\",\"4\":\"دعم توقيت الالتقاط من الفندق أو الرصيف\"},\"includes\":{\"1\":\"مقعد القارب السريع أو مقعد العبارة (يعتمد على المشغل)\",\"2\":\"رسوم الحديقة الوطنية (حيث يتم تضمينها من قبل المشغل)\",\"3\":\"الغداء ومياه الشرب\",\"4\":\"سترة النجاة ومعدات الغطس\"},\"content\":{\"1\":\"تظل Phi Phi واحدة من أكثر الرحلات اليومية المطلوبة من كرابي. تغادر معظم الطرود مبكرًا من آو نانج أو الأرصفة القريبة وتعود في وقت متأخر بعد الظهر.\",\"2\":\"نوصي بحجز خدمة نقل خاصة عبر الرصيف حتى تصل بوقت فاصل قبل تسجيل الوصول. يمكن أن تكون العودة المسائية مزدحمة - احجز مكان الالتقاء الخاص بك عندما تحجز الجولة.\",\"3\":\"أسعار الجولات المعروضة هي من مشغلين محليين نموذجيين (أسعار إرشادية وهمية). تأكد من التضمينات ونوع القارب وقواعد الوصول إلى خليج مايا لتاريخ سفرك.\"}},\"four-islands-tour\":{\"title\":\"جولة في 4 جزر (الدجاج والتوب والبودا والريلاي)\",\"excerpt\":\"التنقل بين الجزر القصيرة بالقرب من آونانغ - الشعاب المرجانية الضحلة والصخور الشهيرة والشواطئ ذات الرمال الناعمة.\",\"duration\":\"نصف / يوم كامل\",\"fromArea\":\"آو نانغ\",\"toArea\":\"دجاج · توب · بودا · رايلاي\",\"highlights\":{\"1\":\"وجهة نظر جزيرة الدجاج والغطس\",\"2\":\"الشريط الرملي لجزيرة توب (يعتمد على المد والجزر)\",\"3\":\"محطة السباحة في شاطئ بودا\",\"4\":\"إسقاط أو زيارة Railay الاختيارية\"},\"includes\":{\"1\":\"ذيل طويل أو قارب سريع\",\"2\":\"قناع الغطس وسترة النجاة\",\"3\":\"الفواكه / المشروبات الغازية (يعتمد على المشغل)\",\"4\":\"دليل على متن الطائرة\"},\"content\":{\"1\":\"يعد طريق الجزر الأربع مثاليًا إذا كنت تريد مناظر طبيعية قريبة من Ao Nang دون عبور طويل إلى Phi Phi.\",\"2\":\"يؤثر المد والجزر على رؤية الشريط الرملي في جزيرة توب - عادةً ما توفر رحلات المغادرة الصباحية أفضل الظروف.\",\"3\":\"قم بإقران هذه الجولة مع خدمة النقل من الفندق إلى الرصيف حتى لا تعتمد على أغاني اللحظة الأخيرة خلال موسم الذروة.\"}},\"hong-island-lagoon\":{\"title\":\"رحلة بحيرة جزيرة هونج\",\"excerpt\":\"البحيرات الهادئة وخيارات التجديف بالكاياك والشواطئ الرملية الناعمة في متنزه ثان بوك خوراني الوطني.\",\"duration\":\"يوم كامل\",\"fromArea\":\"آو نانغ / نوبارات ثارا\",\"toArea\":\"جزيرة هونغ\",\"highlights\":{\"1\":\"إطلالات على بحيرة الزمرد\",\"2\":\"قوارب الكاياك من خلال قنوات الحجر الجيري\",\"3\":\"وقت الشاطئ الهادئ\",\"4\":\"مشهد الحديقة الوطنية\"},\"includes\":{\"1\":\"نقل بالقارب إلى جزيرة هونغ\",\"2\":\"قوارب الكاياك (مشتركة أو خاصة - تعتمد على المشغل)\",\"3\":\"رسوم الحديقة الوطنية (غالبًا ما تكون متضمنة)\",\"4\":\"الغداء على بعض الحزم\"},\"content\":{\"1\":\"تحظى جزيرة هونغ بشعبية بين المسافرين الذين يفضلون البحيرات والتجديف بالكاياك خلال أيام القوارب السريعة لمسافات طويلة.\",\"2\":\"غالبًا ما تكون المغادرة من جانب نوبارات ثارا / آو نانغ. امنح وقتًا إضافيًا إذا كان فندقك داخليًا أو في مدينة كرابي.\",\"3\":\"اسأل المشغل الخاص بك عن قواعد فتح المتنزه وما إذا كانت قوارب الكاياك متضمنة أو مستأجرة في الموقع.\"}},\"james-bond-island-phang-nga\":{\"title\":\"جزيرة جيمس بوند · خليج فانغ نجا\",\"excerpt\":\"الصخور الجيرية الكارستية الشهيرة والتجديف في الكهوف وإبرة كوه تابو الصخرية الشهيرة.\",\"duration\":\"يوم كامل\",\"fromArea\":\"جانب كرابي / فوكيت\",\"toArea\":\"خليج فانغ نجا\",\"highlights\":{\"1\":\"كوه تابو (جزيرة جيمس بوند)\",\"2\":\"الزورق من خلال كهوف المنغروف\",\"3\":\"محطة قرية الصيد الإسلامية (تعتمد على المشغل)\",\"4\":\"رحلة بحرية في الخليج ذات المناظر الخلابة\"},\"includes\":{\"1\":\"قطاع القوارب والزوارق\",\"2\":\"دليل\",\"3\":\"الغداء\",\"4\":\"رسوم الحديقة الوطنية (تعتمد على الباقة)\"},\"content\":{\"1\":\"يمكن أن تبدأ جولات جزيرة جيمس بوند من كرابي أو بوكيت. قد يكون وقت السفر على الأرض أطول من وقت السفر بالقارب نفسه.\",\"2\":\"تعمل خدمة النقل الخاصة بين فندقك ورصيف الاجتماعات على إبقاء اليوم في الموعد المحدد - خاصة بالنسبة للالتقاء المبكر بالفندق.\",\"3\":\"تختلف الأسعار بشكل كبير حسب جودة الزورق وحجم المجموعة؛ استخدم سعرنا كدليل تخطيط فقط.\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"تجمع الزمرد والينابيع الساخنة كومبو\",\"excerpt\":\"يوم طبيعة بري - مسابح الغابة الزمردية وينابيع المياه المعدنية الساخنة بالقرب من مدينة كرابي.\",\"duration\":\"نصف يوم\",\"fromArea\":\"مدينة كرابي / آو نانج\",\"toArea\":\"بركة الزمرد · الينابيع الساخنة\",\"highlights\":{\"1\":\"السباحة في بركة الزمرد\",\"2\":\"استرخ في ينبوع المياه الحارة الطبيعي\",\"3\":\"خيار وجهة نظر Blue Pool\",\"4\":\"نصف يوم سهل للعائلات\"},\"includes\":{\"1\":\"رسوم الدخول (تعتمد على الحزمة)\",\"2\":\"دليل على بعض الحزم\",\"3\":\"مياه الشرب\"},\"content\":{\"1\":\"يعد هذا التحرير والسرد مثاليًا عندما يكون البحر هائجًا أو عندما ترغب في قضاء يوم على الأرض بين رحلات الجزيرة.\",\"2\":\"قم بحجز وسيلة نقل سياحية للتوقيت من الباب إلى الباب دون تأخير في الشاحنة المشتركة.\",\"3\":\"أحضر أحذية مائية - يمكن أن تكون المسارات زلقة بعد المطر.\"}},\"railay-sunset-longtail\":{\"title\":\"رايلاي غروب الشمس بواسطة Longtail\",\"excerpt\":\"قم بالقفز على الرصيف القصير إلى Railay للحصول على وجهات النظر وتسلق المنحدرات والتقاط صور الساعة الذهبية.\",\"duration\":\"3 – 5 ساعات / مساءاً\",\"fromArea\":\"آو نانغ\",\"toArea\":\"شاطئ رايلاي\",\"highlights\":{\"1\":\"Longtail إلى رايلاي الغرب / الشرق\",\"2\":\"المشي على شاطئ كهف فرا نانغ\",\"3\":\"غروب الشمس في رايلي ويست\",\"4\":\"عشاء اختياري على الشاطئ\"},\"includes\":{\"1\":\"رحلة طويلة ذهابًا وإيابًا (مشتركة أو خاصة)\",\"2\":\"سترة النجاة\"},\"content\":{\"1\":\"تقع Railay على بعد مسافة قصيرة بالقارب من Ao Nang ولكنها تبدو وكأنها وجهة مختلفة.\",\"2\":\"تحقق من أوقات عودة القارب إذا بقيت حتى غروب الشمس - فالقوارب الطويلة الخاصة تكون مرنة عندما تتباطأ القوارب العامة.\",\"3\":\"يمكننا توصيلك إلى رصيف آو نانغ وانتظار عودتك عند الطلب.\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"الوجهة\",\"Island\":\"الجزيرة\",\"Corridor\":\"الممر\",\"Practical\":\"عملي\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"آو نانغ كقاعدة كرابي الخاصة بك\",\"excerpt\":\"مكان الإقامة وكيفية الوصول إلى الرصيف وكيفية ربط الشواطئ والريلاي والرحلات اليومية.\",\"region\":\"كرابي\",\"tips\":{\"1\":\"يمكنك البقاء بالقرب من طريق الشاطئ لسهولة الوصول إلى Railay.\",\"2\":\"احجز رحلات النقل من الرصيف في الليلة التي تسبق صباح العبارة المزدحمة.\",\"3\":\"يمكن أن تضيف حركة المرور المسائية بين مدينة كرابي وآو نانغ ما بين 15 إلى 25 دقيقة.\"},\"content\":{\"1\":\"تُعد آو نانغ القاعدة الأكثر عملية للزوار لأول مرة: حيث تقع المطاعم ومكاتب الجولات السياحية وإمكانية الوصول بالقوارب بالقرب من بعضها البعض.\",\"2\":\"استخدم وسائل النقل الخاصة من مطار كرابي (KBV) إذا وصلت بأمتعة أو بعد حلول الظلام - تختلف سيارات الأجرة والشاحنات المشتركة ذات العدادات في وقت الانتظار.\",\"3\":\"من Ao Nang، يمكنك الوصول إلى Railay في حوالي 15 دقيقة بالقطار الطويل، أو الانضمام إلى رحلات الجزر الأربعة، أو الاتصال بقوارب Phi Phi السريعة.\",\"4\":\"إذا كان فندقك مرتفعًا أو داخليًا، فأضف وقتًا مؤقتًا لكل رحلة مغادرة للرصيف.\"}},\"railay-access-tips\":{\"title\":\"الوصول إلى شاطئ رايلاي دون ضغوط\",\"excerpt\":\"خيارات القوارب، ونصائح الأمتعة، ومتى يتم حجز قوارب خاصة طويلة الذيل مقابل القوارب المشتركة.\",\"region\":\"كرابي\",\"tips\":{\"1\":\"الحقائب الكبيرة أسهل على ذوي الذيل الطويلة الخاصة.\",\"2\":\"يمكن أن يكون شرق رايلاي موحلًا عند انخفاض المد، بينما يكون الغرب أفضل عند غروب الشمس.\",\"3\":\"تأكيد خطط عودة القارب قبل العشاء.\"},\"content\":{\"1\":\"Railay لا يوجد لديه الوصول إلى الطريق. يصل الجميع تقريبًا بالقوارب من آونانج أو عبر طرق أطول من مدينة كرابي.\",\"2\":\"تعتبر الذيل الطويلة المشتركة رخيصة الثمن ومتكررة نهارًا. تكلف القوارب الخاصة أكثر ولكنها تساعد في التوقيت والأطفال والحقائب الضخمة.\",\"3\":\"يمكنك المشي على الأقدام بمجرد وصولك إلى التسلق والتجديف بالكاياك وشاطئ فرا نانغ كيف - خطط لارتداء أحذية للمسارات الصخرية.\",\"4\":\"يمكننا نقلك إلى الفندق → Ao Nang Pier وترتيب خدمة التوصيل في وقت محدد بعد غروب الشمس.\"}},\"phi-phi-arrival-checklist\":{\"title\":\"قائمة مراجعة وصول فاي فاي\",\"excerpt\":\"العبارة مقابل القارب السريع، وتوقيت الرصيف، وكيفية ربط خدمات النقل من الفندق قبل وبعد العبور.\",\"region\":\"فاي فاي / كرابي\",\"tips\":{\"1\":\"يمكنك الوصول إلى الرصيف قبل 45-60 دقيقة في وقت مبكر من موسم الذروة.\",\"2\":\"الزوارق السريعة أسرع. العبارات عادة ما تكون أكثر سلاسة وأرخص.\",\"3\":\"احجز خدمة النقل البري مسبقًا حتى لا تتعجل بالأمتعة.\"},\"content\":{\"1\":\"تبدأ أيام الجزيرة على الأرض. تعتبر خدمة النقل الموثوقة من الفندق إلى الرصيف لا تقل أهمية عن تذكرة القارب نفسها.\",\"2\":\"يمكن لقواعد الطقس والمتنزهات أن تغير إمكانية الوصول إلى خليج مايا - تحقق مع المشغل الخاص بك في اليوم السابق.\",\"3\":\"في أمسيات العودة، تتفوق شاحنات النقل الخاصة على الرصيف في انتظار الشاحنات المشتركة، خاصة مع الحقائب المبللة والأطفال المتعبين.\",\"4\":\"إذا سافرت من فوكيت أو كرابي في صباح اليوم التالي، فاترك وقتًا احتياطيًا لتأخير العبّارة.\"}},\"krabi-phuket-corridor\":{\"title\":\"ممر كرابي – فوكيت: نصائح حول النقل\",\"excerpt\":\"عندما تتفوق سيارة خاصة على الشاحنات المشتركة على الطريق الأكثر ازدحامًا بين المقاطعات في الجنوب.\",\"region\":\"كرابي · فوكيت\",\"tips\":{\"1\":\"تتخطى السيارات الخاصة التي تصل من الباب إلى الباب عدة محطات في الفندق.\",\"2\":\"تحتاج خدمات النقل من المطار إلى المطار إلى تتبع الرحلة ووقت الانتظار.\",\"3\":\"عادةً ما يتم تضمين رسوم المرور ومواقف السيارات في عروض الأسعار الخاصة.\"},\"content\":{\"1\":\"كرابي ↔ فوكيت هو الممر بين المقاطعات الأكثر طلبًا لرحلات الطيران والرحلات متعددة الإقامات.\",\"2\":\"تعتبر الشاحنات المشتركة أرخص ولكنها تضيف وقتًا مع التوقف. سيارات الدفع الرباعي الخاصة أو الشاحنات الصغيرة تناسب العائلات وجداول الرحلات الضيقة.\",\"3\":\"تربط الأرجل النموذجية KBV أو مدينة كرابي بمطار بوكيت أو باتونج أو فنادق الساحل الغربي.\",\"4\":\"احجز رحلة ذهابًا وإيابًا إذا سافرت إلى مقاطعة واحدة وخارج الأخرى - قسيمة إلكترونية واحدة تغطي كلا الساقين.\"}}}},\"Boats\":{\"items\":{\"ao-nang-railay-longtail\":{\"routeLabel\":\"رصيف آو نانغ → شاطئ رايلاي\",\"operator\":\"ذيل طويل محلي (مشترك)\",\"notes\":\"ذيول طويلة مشتركة متكررة. ميثاق خاص متاح. قوارب المساء تضعف بعد غروب الشمس.\"},\"railay-ao-nang-longtail\":{\"routeLabel\":\"شاطئ رايلاي → رصيف آو نانغ\",\"operator\":\"ذيل طويل محلي (مشترك)\",\"notes\":\"عودة القوارب من Railay West / East اعتمادًا على المد والأمتعة.\"},\"ao-nang-phi-phi-speedboat\":{\"routeLabel\":\"آو نانغ / تونساي → فاي فاي\",\"operator\":\"مشغلو القوارب السريعة (وهمية)\",\"notes\":\"يعتمد الرصيف الدقيق (آو نانغ ضد تونساي) على المشغل. الوصول قبل 30-45 دقيقة في وقت مبكر من موسم الذروة.\"},\"phi-phi-ao-nang-speedboat\":{\"routeLabel\":\"فاي فاي → آو نانغ / تونساي\",\"operator\":\"مشغلو القوارب السريعة (وهمية)\",\"notes\":\"قم بحجز خدمة الاستقبال في رصيف العودة مقدمًا إذا وصلت بعد حلول الظلام.\"},\"ao-nang-phi-phi-ferry\":{\"routeLabel\":\"منطقة آو نانغ → فاي فاي (العبّارة)\",\"operator\":\"العبارة / النقل المشترك (وهمي)\",\"notes\":\"أبطأ وعادة ما تكون أرخص من القارب السريع. قد تشمل الشاحنة إلى رصيف العبارات الأكبر.\"},\"krabi-lanta-ferry\":{\"routeLabel\":\"كرابي → كوه لانتا\",\"operator\":\"عبارة + شاحنة كومبو (وهمية)\",\"notes\":\"تستخدم العديد من العروض مدينة كرابي أو الأرصفة البحرية القريبة؛ تأكيد نقطة الالتقاء. المدة تشمل الطريق + البحر.\"},\"phi-phi-phuket-ferry\":{\"routeLabel\":\"فاي فاي → فوكيت\",\"operator\":\"مشغلي العبارات (وهمية)\",\"notes\":\"تواصل مع مطار بوكيت أو باتونج للنقل الخاص بعد الوصول.\"},\"railay-hong-island-speedboat\":{\"routeLabel\":\"آو نانغ → جزيرة هونغ\",\"operator\":\"رحلة نهارية بالقارب السريع (وهمية)\",\"notes\":\"تُباع عادةً كحزمة يومية ذهابًا وإيابًا بدلاً من تذاكر ذهاب فقط.\"}}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":[\"$L14\",\"$L15\",\"$L16\"]}]\n"])</script><script>self.__next_f.push([1,"17:I[46615,[\"/nx/static/chunks/05-c3ty_6dwfk.js\",\"/nx/static/chunks/14mrh2-p_w84d.js\",\"/nx/static/chunks/21tc7p_83e_60.js
