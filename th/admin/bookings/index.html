{\"categories\":{\"Airport\":\"สนามบิน\",\"Beach\":\"ชายหาด\",\"Pier\":\"ท่าเรือ\",\"Inter Province\":\"ข้ามจังหวัด\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"คู่มือรับส่งสนามบินกระบี่: ถึง KBV อย่างราบรื่น\",\"excerpt\":\"หลังจากลงจอดที่สนามบินนานาชาติกระบี่ต้องรู้อะไร บริการรับถึงที่ทำงานอย่างไร และจองรถรับส่งส่วนตัวพร้อม e-Voucher อย่างไร\",\"p1\":\"การลงจอดที่สนามบินนานาชาติกระบี่ (KBV) คือจุดเริ่มต้นทริปภาคใต้ รถรับส่งสนามบินส่วนตัวช่วยให้คุณไม่ต้องต่อคิวแท็กซี่ และไปโรงแรม ชายหาด หรือท่าเรือได้ทันที\",\"p2\":\"กับ Krabi Links Taxi คนขับติดตามเที่ยวบินและมีเวลารอฟรีสำหรับการรับที่สนามบิน คุณจะได้รับ e-Voucher พร้อม QR Code ทันทีหลังจอง — แสดงที่จุดนัดพบ\",\"p3\":\"เส้นทางยอดนิยมจาก KBV ได้แก่ หาดอ่าวนาง ไร่เลย์ Centara Grand และตัวเมืองกระบี่ เลือกรถเก๋งประหยัดสำหรับคู่รัก หรือรถตู้หากเดินทางกับครอบครัวและสัมภาระ\",\"p4\":\"เคล็ดลับ: แจ้งหมายเลขเที่ยวบินและชื่อโรงแรมตอนจอง เพื่อให้คนขับเตรียมป้ายชื่อและวางแผนเส้นทางเลี่ยงรถติดช่วงเย็น\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"เคล็ดลับรับส่งหาดอ่าวนางและไร่เลย์\",\"excerpt\":\"วิธีเดินทางระหว่างอ่าวนาง ไร่เลย์ และรีสอร์ทใกล้เคียงด้วยรถส่วนตัว ท่าเรือ และประเภทรถที่เหมาะกับกระเป๋าชายหาด\",\"p1\":\"อ่าวนางเป็นศูนย์กลางของที่พักชายหาดหลายแห่งในกระบี่ ส่วนไร่เลย์เข้าถึงผ่านท่าเรือระยะสั้น การวางแผนรับส่งล่วงหน้าทำให้วันนั้นง่ายขึ้น\",\"p2\":\"จากสนามบินหรือตัวเมืองกระบี่ จองส่งตรงไปหาดอ่าวนางหรือโรงแรม สำหรับไร่เลย์ เราพาไปท่าเรือและช่วยจับเวลาเชื่อมต่อเรือได้\",\"p3\":\"ถ้ามีอุปกรณ์ดำน้ำหรือกระเป๋าใหญ่ รถ SUV หรือรถตู้มาตรฐานให้พื้นที่มากกว่าเก๋ง การจองไป-กลับยังช่วยประหยัดเวลาวันเช็คเอาท์\",\"p4\":\"เที่ยวกลับช่วงเย็นจากชายหาดอาจแน่น — จองเวลารับล่วงหน้า โดยเฉพาะสุดสัปดาห์และวันหยุดนักขัตฤกษ์\"},\"pier-transfer-to-phi-phi\":{\"title\":\"รับส่งท่าเรือไปพีพี: สิ่งที่นักท่องเที่ยวควรรู้\",\"excerpt\":\"เช็คลิสต์จริงจังสำหรับรับส่งโรงแรม–ท่าเรือ จังหวะเรือเฟอร์รี่ และเคล็ดลับสัมภาระก่อนไปพีพี\",\"p1\":\"วันเที่ยวเกาะเริ่มบนบก รถรับส่งท่าเรือที่เชื่อถือได้จากโรงแรมหรือสนามบินช่วยให้ถึงท่าเรืออ่าวนางหรือจุดออกเดินทางอื่นโดยไม่เร่งรีบ\",\"p2\":\"เผื่อเวลาเช็คอินและขึ้นเรือ แนะนำถึงท่าเรืออย่างน้อย 45–60 นาทีก่อนเรือออกในช่วงไฮซีซัน\",\"p3\":\"รถตู้ส่วนตัวเหมาะกับกลุ่มที่ขึ้นเรือเฟอร์รี่รอบเดียวกัน ครอบครัวขอคาร์ซีทเด็กได้ฟรีตอนจอง\",\"p4\":\"หลังเที่ยวเกาะ จองรับกลับที่ท่าเรือให้คนขับรอเมื่อเรือเทียบท่า — มีประโยชน์มากหากถึงหลังมืด\"},\"krabi-to-phuket-inter-province\":{\"title\":\"รับส่งข้ามจังหวัดกระบี่–ภูเก็ต\",\"excerpt\":\"เทียบความสะดวกและเวลาบนเส้นทางกระบี่–ภูเก็ต ตัวเลือกรถ และเมื่อไหร่ที่รถรับส่งส่วนตัวดีกว่าแวนรวม\",\"p1\":\"เส้นทางกระบี่–ภูเก็ตเป็นหนึ่งในรับส่งข้ามจังหวัดที่ยอดนิยมที่สุดในภาคใต้ รถส่วนตัวให้บริการถึงที่โดยไม่แวะหลายจุด\",\"p2\":\"ทริปทั่วไปเชื่อม KBV หรือตัวเมืองกระบี่กับสนามบินภูเก็ตหรือป่าตอง เวลาเดินทางขึ้นกับรถติดและจุดเริ่มต้น\",\"p3\":\"สำหรับทางไกล รถตู้ VIP หรือมินิบัสให้พื้นที่และความสะดวกสบายมากขึ้น ราคารวมค่าทางด่วนและที่จอด เว้นแต่เพิ่มเวลารอ\",\"p4\":\"จองไป-กลับหากบินเข้าจังหวัดหนึ่งและออกอีกจังหวัด — ใบจองเดียวครอบคลุมทั้งสองเที่ยวพร้อม e-Voucher\"}}},\"Admin\":{\"loading\":\"กำลังโหลด…\",\"loginTitle\":\"เข้าสู่ระบบแอดมิน\",\"loginHint\":\"เข้าสู่ระบบด้วยบัญชีพนักงาน\",\"username\":\"ชื่อผู้ใช้\",\"password\":\"รหัสผ่าน\",\"signIn\":\"เข้าสู่ระบบ\",\"loginError\":\"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง\",\"logout\":\"ออกจากระบบ\",\"backToSite\":\"กลับเว็บไซต์\",\"panelTitle\":\"ระบบปฏิบัติการ\",\"opsLabel\":\"หลังบ้าน\",\"nav\":{\"dashboard\":\"แดชบอร์ด\",\"bookings\":\"การจอง\",\"payments\":\"การชำระเงิน\",\"schedule\":\"ตารางงาน\",\"drivers\":\"คนขับ\",\"customers\":\"ลูกค้า\",\"prices\":\"ตารางราคา\",\"vehicles\":\"รถรับส่ง\",\"settings\":\"ตั้งค่า\"},\"dashboardTitle\":\"แดชบอร์ด\",\"dashboardSubtitle\":\"ภาพรวมงานรับส่ง การชำระเงิน และคนขับ\",\"resetDemo\":\"รีเซ็ตข้อมูลเดโม\",\"statOpen\":\"งานค้าง\",\"statPayReview\":\"รอตรวจสลิป\",\"statToday\":\"ทริปวันนี้\",\"statAssigned\":\"มอบหมาย / กำลังวิ่ง\",\"statDrivers\":\"คนขับออนไลน์\",\"statRevenue\":\"ยอดชำระแล้ว\",\"recentBookings\":\"การจองล่าสุด\",\"recentBook ps\":\"ปฏิบัติการ\",\"finance\":\"การเงิน\",\"driver\":\"คนขับ\"},\"driversAdd\":\"เพิ่มคนขับ\",\"driversEdit\":\"แก้ไขคนขับ\",\"driversLine\":\"ไลน์ไอดี\",\"driversPlate\":\"ทะเบียนรถ\",\"driversRemoved\":\"ลบคนขับแล้ว\",\"catalogIssue\":{\"empty\":\"ไฟล์ว่าง\",\"missingModel\":\"ไม่มีรุ่นรถ\",\"badCategory\":\"หมวดไม่ถูกต้อง\",\"badLocation\":\"ไม่รู้จักจุดต้นทาง/ปลายทาง\",\"sameLocation\":\"ต้นทางกับปลายทางซ้ำกัน\",\"missingPrice\":\"ราคาประเภทรถไม่ครบ\"},\"confirmOrder\":\"ยืนยันออเดอร์\",\"orderConfirmDue\":\"ยอดออเดอร์\",\"toastOrderOk\":\"ยืนยันออเดอร์แล้ว — ส่ง voucher ได้\",\"planPayDriver\":\"จ่ายคนขับ\",\"planDeposit\":\"มัดจำ\",\"planFull\":\"จ่ายเต็ม\",\"settingsAdvanceDepositTiers\":\"มัดจำออนไลน์คำนวณอัตโนมัติตามยอดจอง: ไม่เกิน 1000 -\u003e 200 · เกิน 1000 ไม่ถึง 3000 -\u003e 500 · ตั้งแต่ 3000 -\u003e 1000 (แก้ไขไม่ได้)\"},\"Tours\":{\"categories\":{\"Island\":\"เกาะ\",\"Snorkel\":\"ดำน้ำตื้น\",\"Kayak\":\"พายเรือคายัค\",\"Sightseeing\":\"เที่ยวชมสถานที่\",\"Combo\":\"คอมโบ\"},\"items\":{\"phi-phi-islands-day-trip\":{\"title\":\"ทัวร์เกาะพีพีวันเดียว\",\"excerpt\":\"ทริปวันเดียวสุดคลาสสิกอันดามันพร้อมจุดชมวิวอ่าวมาหยา จุดดำน้ำตื้น และรับประทานอาหารกลางวันบนชายหาด\",\"duration\":\"เต็มวัน (~8–9 ชม.)\",\"fromArea\":\"อ่าวนาง/กระบี่\",\"toArea\":\"เกาะพีพี\",\"highlights\":{\"1\":\"จุดชมวิวอ่าวมาหยา (ขึ้นอยู่กับกฎอุทยาน)\",\"2\":\"ดำน้ำดูปะการังที่ใสสะอาด\",\"3\":\"รับประทานอาหารกลางวันริมชายหาดที่เกาะพีพีดอนหรืออ่าวใกล้เคียง\",\"4\":\"รองรับการกำหนดเวลารับที่โรงแรมหรือท่าเรือ\"},\"includes\":{\"1\":\"ที่นั่งเรือสปีดโบ๊ตหรือเรือเฟอร์รี่ (ขึ้นอยู่กับผู้ประกอบการ)\",\"2\":\"ค่าธรรมเนียมอุทยานแห่งชาติ (ตามที่ผู้ประกอบการรวมไว้แล้ว)\",\"3\":\"อาหารกลางวันและน้ำดื่ม\",\"4\":\"เสื้อชูชีพและอุปกรณ์ดำน้ำ\"},\"content\":{\"1\":\"เกาะพีพียังคงเป็นหนึ่งในการเดินทางแบบไปเช้าเย็นกลับที่ได้รับการร้องขอมากที่สุดจากกระบี่ แพ็คเกจส่วนใหญ่ออกจากอ่าวนางหรือท่าเรือใกล้เคียงก่อนเวลา และกลับมาในช่วงบ่ายแก่ๆ\",\"2\":\"เราขอแนะนำให้จองบริการรับส่งจากท่าเรือส่วนตัวเพื่อให้คุณมาถึงโดยเผื่อเวลาไว้ก่อนเช็คอิน การส่งคืนในช่วงเย็นอาจไม่ว่าง โปรดจองช่องรับของคุณเมื่อคุณจองทัวร์\",\"3\":\"ราคาทัวร์ที่แสดงมาจากผู้ให้บริการในท้องถิ่นทั่วไป (ราคาไกด์จำลอง) ยืนยันการรวม ประเภทเรือ และกฎการเข้าอ่าวมาหยาสำหรับวันเดินทางของคุณ\"}},\"four-islands-tour\":{\"title\":\"ทัวร์ 4 เกาะ (ไก่ ทับ ปอดะ ไร่เลย์)\",\"excerpt\":\"เที่ยวเกาะสั้นๆ ใกล้อ่าวนาง - แนวปะการังน้ำตื้น หินอันเป็นเอกลักษณ์ และหาดทรายนุ่ม\",\"duration\":\"ครึ่ง/เต็มวัน\",\"fromArea\":\"อ่าวนาง\",\"toArea\":\"ไก่ · ทับ · ปอดะ · ไร่เลย์\",\"highlights\":{\"1\":\"จุดชมวิวเกาะไก่และดำน้ำตื้น\",\"2\":\"สันทรายเกาะทับ (ขึ้นอยู่กับน้ำขึ้นน้ำลง)\",\"3\":\"จุดเล่นน้ำหาดปอดะ\",\"4\":\"ทางเลือกแวะไร่เลย์หรือเยี่ยมชม\"},\"includes\":{\"1\":\"เรือหางยาวหรือเรือเร็ว\",\"2\":\"หน้ากากดำน้ำและเสื้อชูชีพ\",\"3\":\"ผลไม้ / น้ำอัดลม (ขึ้นอยู่กับผู้ประกอบการ)\",\"4\":\"ไกด์บนเรือ\"},\"content\":{\"1\":\"เส้นทาง 4 เกาะเหมาะอย่างยิ่งหากคุณต้องการทิวทัศน์ใกล้กับอ่าวนางโดยไม่ต้องข้ามไปยังเกาะพีพีเป็นเวลานาน\",\"2\":\"น้ำขึ้นส่งผลต่อทัศนวิสัยสันทรายที่เกาะทับ การออกเดินทางตอนเช้ามักให้เงื่อนไขที่ดีที่สุด\",\"3\":\"จับคู่ทัวร์นี้กับบริการรับส่งระหว่างโรงแรมและท่าเรือ เพื่อให้คุณไม่ต้องพึ่งรถสองแถวในนาทีสุดท้ายในช่วงฤดูท่องเที่ยว\"}},\"hong-island-lagoon\":{\"title\":\"ทริปเกาะห้องลากูน\",\"excerpt\":\"ทะเลสาบอันเงียบสงบ ตัวเลือกพายเรือคายัค และหาดทรายละเอียดในอุทยานแห่งชาติธารโบกขรณี\",\"duration\":\"เต็มวัน\",\"fromArea\":\"อ่าวนาง/นพรัตน์ธารา\",\"toArea\":\"เกาะห้อง\",\"highlights\":{\"1\":\"วิวทะเลสาบมรกต\",\"2\":\"พายเรือคายัคผ่านช่องหินปูน\",\"3\":\"เวลาชายหาดที่เงียบสงบ\",\"4\":\"ทิวทัศน์อุทยานแห่งชาติ\"},\"includes\":{\"1\":\"เรือรับส่งไปเกาะห้อง\",\"2\":\"พายเรือคายัค (แชร์หรือส่วนตัว — ขึ้นอยู่กับผู้ให้บริการ)\",\"3\":\"ค่าธรรมเนียมอุทยานแห่งชาติ (รวมอยู่บ่อยครั้ง)\",\"4\":\"รับประทานอาหารกลางวันบนแพ็คเกจบางส่วน\"},\"content\":{\"1\":\"เกาะห้องเป็นที่นิยมของนักท่องเที่ยวที่ชื่นชอบทะเลสาบและพายเรือคายัคในช่วงวันเดินทางด้วยเรือเร็ว\",\"2\":\"ขาออกมักจะมาจากฝั่งนพรัตน์ธารา / อ่าวนาง โปรดเผื่อเวลาไว้เป็นพิเศษหากโรงแรมของคุณอยู่ภายในประเทศหรือในตัวเมืองกระบี่\",\"3\":\"สอบถามผู้ให้บริการของคุณเกี่ยวกับกฎการเปิดอุทยาน และรวมหรือเช่าเรือคายัคในสถานที่หรือไม่\"}},\"james-bond-island-phang-nga\":{\"title\":\"เกาะเจมส์บอนด์ · อ่าวพังงา\",\"excerpt\":\"ภูเขาหินปูนอันโด่งดัง พายเรือแคนูในถ้ำ และเข็มหินเกาะตะปูอันโด่งดัง\",\"duration\":\"เต็มวัน\",\"fromArea\":\"ฝั่งกระบี่/ภูเก็ต\",\"toArea\":\"อ่าวพังงา\",\"highlights\":{\"1\":\"เกาะตะปู (เกาะเจมส์บอนด์)\",\"2\":\"พายเรือแคนูผ่านถ้ำป่าชายเลน\",\"3\":\"จุดจอดหมู่บ้านชาวประมงมุสลิม (ขึ้นอยู่กับผู้ประกอบการ)\",\"4\":\"ล่องเรือชมอ่าวอันสวยงาม\"},\"includes\":{\"1\":\"ส่วนเรือและเรือแคนู\",\"2\":\"คู่มือ\",\"3\":\"อาหารกลางวัน\",\"4\":\"ค่าธรรมเนียมอุทยานแห่งชาติ (ขึ้นอยู่กับแพ็คเกจ)\"},\"content\":{\"1\":\"ทัวร์เกาะเจมส์บอนด์สามารถเริ่มต้นจากกระบี่หรือภูเก็ต เวลาเดินทางบนบกอาจนานกว่าส่วนของเรือเอง\",\"2\":\"บริการรับส่งส่วนตัวระหว่างโรงแรมของคุณและท่าเรือนัดพบช่วยให้วันเป็นไปตามกำหนดการ โดยเฉพาะการรับที่โรงแรมแต่เช้า\",\"3\":\"ราคาแตกต่างกันไปตามคุณภาพเรือแคนูและขนาดกลุ่ม ใช้ราคาเริ่มต้นของเราเป็นแนวทางในการวางแผนเท่านั้น\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"สระมรกตและบ่อน้ำพุร้อน\",\"excerpt\":\"วันธรรมชาติบนบก — แอ่งน้ำสีเขียวมรกตและบ่อน้ำแร่ใกล้ตัวเมืองกระบี่\",\"duration\":\"ครึ่งวัน\",\"fromArea\":\"เมืองกระบี่/อ่าวนาง\",\"toArea\":\"สระมรกต · บ่อน้ำพุร้อน\",\"highlights\":{\"1\":\"ว่ายน้ำที่สระมรกต\",\"2\":\"พักผ่อนที่บ่อน้ำพุร้อนธรรมชาติ\",\"3\":\"ตัวเลือกจุดชมวิวบลูพูล\",\"4\":\"ครึ่งวันสบายๆ สำหรับครอบครัว\"},\"includes\":{\"1\":\"ค่าธรรมเนียมแรกเข้า (ขึ้นอยู่กับแพ็คเกจ)\",\"2\":\"คำแนะนำเกี่ยวกับแพ็คเกจบางอย่าง\",\"3\":\"น้ำดื่ม\"},\"content\":{\"1\":\"คอมโบนี้เหมาะอย่างยิ่งเมื่อทะเลมีคลื่นลมแรงหรือคุณต้องการมีวันขึ้นบกระหว่างทริปเกาะต่างๆ\",\"2\":\"จองบริการรับส่งสถานที่ท่องเที่ยวตามกำหนดเวลาแบบ door-to-door โดยไม่ทำให้รถตู้ร่วมล่าช้า\",\"3\":\"นำรองเท้าลุยน้ำมาด้วย - เส้นทางอาจลื่นหลังฝนตก\"}},\"railay-sunset-longtail\":{\"title\":\"ไร่เลย์ ซันเซ็ท บาย ลองเทล\",\"excerpt\":\"ท่าเรือระยะสั้นไปยังไร่เลย์เพื่อชมวิว ปีนหน้าผา และถ่ายรูปในชั่วโมงทอง\",\"duration\":\"3-5ชม./เย็น\",\"fromArea\":\"อ่าวนาง\",\"toArea\":\"หาดไร่เลย์\",\"highlights\":{\"1\":\"หางยาวไปไร่เลย์ตะวันตก/ตะวันออก\",\"2\":\"เดินหาดถ้ำพระนาง\",\"3\":\"พระอาทิตย์ตกที่ไร่เลย์ตะวันตก\",\"4\":\"รับประทานอาหารเย็นตามอัธยาศัยบนชายหาด\"},\"includes\":{\"1\":\"หางยาวไป-กลับ (แชร์หรือส่วนตัว)\",\"2\":\"เสื้อชูชีพ\"},\"content\":{\"1\":\"ไร่เลย์อยู่ห่างจากอ่าวนางโดยใช้เวลานั่งเรือเพียงระยะสั้น ๆ แต่ให้ความรู้สึกเหมือนเป็นจุดหมายปลายทางที่แตกต่าง\",\"2\":\"ตรวจสอบเวลาเรือขากลับหากคุณเข้าพักในช่วงพระอาทิตย์ตก เรือหางยาวส่วนตัวจะยืดหยุ่นได้เมื่อเรือสาธารณะชะลอความเร็ว\",\"3\":\"เราสามารถไปส่งคุณที่ท่าเรืออ่าวนางและรอรับกลับตามคำขอ\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"จุดหมายปลายทาง\",\"Island\":\"เกาะ\",\"Corridor\":\"ทางเดิน\",\"Practical\":\"ใช้งานได้จริง\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"อ่าวนางเป็นฐานทัพกระบี่ของคุณ\",\"excerpt\":\"ที่พัก วิธีไปท่าเรือ วิธีเชื่อมต่อหาด ไร่เลย์ และเดย์ทริป\",\"region\":\"กระบี่\",\"tips\":{\"1\":\"อยู่ใกล้ถนนเลียบชายหาดเพื่อเข้าถึงหาดไร่เลย์ได้โดยง่าย\",\"2\":\"ท่าเรือจองโอนในคืนก่อนเช้าเรือข้ามฟากอันวุ่นวาย\",\"3\":\"การจราจรในช่วงเย็นระหว่างเมืองกระบี่และอ่าวนางอาจใช้เวลาเพิ่ม 15–25 นาที\"},\"content\":{\"1\":\"อ่าวนางเป็นฐานที่เป็นประโยชน์มากที่สุดสำหรับผู้มาเยือนครั้งแรก โดยมีร้านอาหาร โต๊ะบริการทัวร์ และทางลงเรืออยู่ใกล้กัน\",\"2\":\"ใช้บริการรับส่งส่วนตัวจากสนามบินกระบี่ (KBV) หากคุณมาถึงพร้อมกระเป๋าเดินทางหรือหลังมืด แท็กซี่มิเตอร์และรถตู้ร่วมจะแตกต่างกันไปตามระยะเวลารอ\",\"3\":\"จากอ่าวนางคุณสามารถไปถึงไร่เลย์ได้ในเวลาประมาณ 15 นาทีโดยเรือหางยาว ร่วมทริป 4 เกาะ หรือต่อเรือเร็วเกาะพีพี\",\"4\":\"หากโรงแรมของคุณอยู่บนเนินหรือบนบก ให้เพิ่มเวลาเผื่อเวลาออกเดินทางของท่าเรือทุกแห่ง\"}},\"railay-access-tips\":{\"title\":\"เที่ยวหาดไร่เลย์แบบไร้กังวล\",\"excerpt\":\"ตัวเลือกเรือ เคล็ดลับกระเป๋าเดินทาง และเวลาที่ควรจองเรือหางยาวส่วนตัวหรือเรือร่วม\",\"region\":\"กระบี่\",\"tips\":{\"1\":\"กระเป๋าเดินทางขนาดใหญ่จะง่ายกว่าสำหรับเรือหางยาวส่วนตัว\",\"
