n.\",\"reqHintId\":\"Prepare your national ID card or driver’s license.\",\"reqHintFlight\":\"Prepare round-trip flight tickets with the customer’s name.\",\"reqHintPhone\":\"Provide a phone number we can reach you on.\",\"specialRequests\":\"Speciale verzoeken\",\"phName\":\"Johannes Smit\",\"phPhone\":\"+66 ...\",\"phEmail\":\"e-mail@voorbeeld.com\",\"phFlight\":\"FD1234\",\"phNotes\":\"Kinderzitje, extra stops, enz.\",\"paymentTitle\":\"Betaling\",\"paymentSubtitle\":\"Kies hoe u wilt betalen: bankgegevens, QR- en kaartvelden zijn nep-demogegevens\",\"paymentSubtitleTransfer\":\"Bank transfer or PromptPay — upload your slip to confirm\",\"paymentSubtitleRental\":\"Choose a payment plan: tiered deposit or pay in full — balance due later\",\"summaryTitle\":\"Boekingsoverzicht\",\"summarySubtitle\":\"Controleer voordat u bevestigt\",\"total\":\"Totaal\",\"estimatedTotal\":\"Estimated rental total\",\"payToday\":\"Pay today\",\"balanceDue\":\"฿{amount} balance due at contract signing\",\"paymentMethod\":\"Betaalmethode:\",\"bankTransfer\":\"Overschrijving\",\"card\":\"Kaart\",\"promptpay\":\"PromptPay\",\"cash\":\"Contant aan de chauffeur\",\"confirmBooking\":\"Boeking bevestigen\",\"confirmBank\":\"Bevestig boeking (in afwachting van overdracht)\",\"confirmCard\":\"Betaal met kaart en bevestig\",\"confirmPromptPay\":\"Bevestig de PromptPay-betaling\",\"confirmCash\":\"Bevestig contante boeking\",\"cancelPolicyNote\":\"Gratis annuleren tot {hours} uur voor afhalen. Daarna geldt een toeslag van {percent}%.\",\"noShowPolicyNote\":\"No-show fee is {percent}% of the booking amount.\",\"refundPolicyNote\":\"Refunds are processed within {days} business days after approval.\",\"policyBoxTitle\":\"Booking \u0026 payment notes\",\"policyBoxHint\":\"Tap to view cancellation, deposit, and airport notes\",\"policyBoxTitleTransfer\":\"Cancellation policy\",\"policyBoxHintTransfer\":\"Tap to view transfer cancellation terms\",\"cancelTitle\":\"Cancellation\",\"depositTitle\":\"Car rental deposit\",\"depositSmallLabel\":\"Small car\",\"depositSmallAmount\":\"฿3,000\",\"depositLargeLabel\":\"Large car\",\"depositLargeAmount\":\"฿5,000\",\"depositStepAdvance\":\"After confirmation, pay {amount} advance deposit first.\",\"depositStepContract\":\"Pay rental fee and remaining deposit on contract day.\",\"depositStepRefund\":\"Deposit is refunded after car return and inspection.\",\"airportTitle\":\"Airport transfer\",\"depositNote\":\"Car rental security deposit: small car ฿3,000 · large car ฿5,000. Online booking deposit uses tiers: ≤฿1,000 → ฿200; ฿1,001–฿2,999 → ฿500; ≥฿3,000 → ฿1,000. Remaining balance is paid later. Security deposit refunded after return and inspection.\",\"airportTransferNote\":\"Free Krabi Airport pickup \u0026 drop-off for car rental customers.\",\"processing\":\"Verwerken...\",\"demoNote\":\"Demobetaling — geen echte kosten · e-Voucher uitgegeven na bevestiging\",\"at\":\"bij\",\"toastCustomer\":\"Vul alle klantgegevens in\",\"toastAdvance24h\":\"Please book at least 24 hours in advance\",\"advanceBookingHint\":\"Bookings must be made at least 24 hours before pickup. Night pickups (00:00–08:00) include a ฿200 driver service charge.\",\"nightSurchargeLabel\":\"Night driver service charge (00:00–08:00)\",\"nightSurchargeHint\":\"Special overnight hours — ฿200 added for the driver.\",\"toastPayment\":\"Selecteer een betaalmethode\",\"toastRemoteSyncOk\":\"Booking saved to the cloud — you can reopen the voucher anytime.\",\"toastRemoteSyncFail\":\"Saved on this device only. Cloud sync failed — keep your booking number.\",\"toastFail\":\"Kon de boeking niet bevestigen. Controleer uw gegevens.\",\"types\":{\"one-way\":{\"label\":\"Eén manier\",\"desc\":\"Enkele overdracht\",\"detail\":\"Eén punt-naar-punt overdracht.\"},\"round-trip\":{\"label\":\"Rondreis\",\"desc\":\"Terugreis inbegrepen\",\"detail\":\"We maken automatisch een terugreis met omgekeerde route.\"},\"multi-route\":{\"label\":\"Meerdere routes\",\"desc\":\"Meerdere bestemmingen\",\"detail\":\"Voeg zoveel routetrajecten toe als u nodig heeft voor uw reis.\"},\"multi-day\":{\"label\":\"Meerdere dagen\",\"desc\":\"Verschillende data\",\"detail\":\"Plan transfers op verschillende data binnen één boeking.\"},\"daily-charter\":{\"label\":\"Dagelijks charter\",\"desc\":\"8 uur volledige dag\",\"detail\":\"Charter voor een hele dag (8 uur) — kies uw voertuig en starttijd.\"},\"hourly-charter\":{\"label\":\"Uurcharter\",\"desc\":\"Min. 3 uur\",\"detail\":\"Minimaal 3 uur — flexibele stops binnen uw charterperiode.\"}},\"paymentSubtitlePlans\":\"Choose pay to driver, deposit, or pay in full — then complete payment details\",\"payAtPickup\":\"Pay at pickup\",\"balanceDueDriver\":\"Pay ฿{amount} in cash to the driver at pickup\",\"paymentPlanLabel\":\"Payment plan:\",\"confirmPayDriver\":\"Submit booking (awaiting staff confirmation)\",\"depositStepAdvanceTier\":\"Online deposit tiers: ≤฿1,000 → ฿200 · ฿1,001–฿2,999 → ฿500 · ≥฿3,000 → ฿1,000.\",\"toastPaymentPlan\":\"Please choose a payment plan\",\"routePreviewOfficial\":\"Official tariff\",\"routePreviewOnRequest\":\"On request\"},\"Pages\":{\"fleet\":\"Onze vloot\",\"priceList\":\"Prijslijst\",\"faq\":\"Veelgestelde vragen\",\"reviews\":\"Klantrecensies\",\"contact\":\"Neem contact met ons op\",\"articles\":\"Reisartikelen\",\"tours\":\"Rondleidingen\",\"boatSchedules\":\"Bootschema's\",\"travelInfo\":\"Reisinformatie\",\"fleetSubtitle\":\"8 voertuigklassen met echte foto's en volledige specificaties\",\"priceListSubtitle\":\"Transparante tarieven voor transfers en dagelijkse huur\",\"reviewsSubtitle\":\"Echte feedback van reizigers in Zuid-Thailand\",\"contactSubtitle\":\"Heeft u vragen? Ons team staat klaar om u te helpen met uw reisplannen voor Zuid-Thailand.\",\"articlesSubtitle\":\"Gidsen voor luchthaven-, strand-, pier- en interprovinciale transfers\",\"toursSubtitle\":\"Dagtochten en eilandervaringen rond Krabi\",\"boatSchedulesSubtitle\":\"Mock-vertrektijden van veerboten en speedboten\",\"travelInfoSubtitle\":\"Praktische tips voor populaire bestemmingen in Zuid-Thailand\"},\"Site\":{\"slogan\":\"Uw vertrouwde Zuid-Thailand transfernetwerk\",\"tagline\":\"Zuid-Thailand reis- en transportplatform\"},\"Faq\":{\"pageTitle\":\"Veelgestelde vragen en beleid\",\"pageSubtitle\":\"Alles wat u moet weten over boeken, betalingen en onze servicenormen.\",\"sectionTitle\":\"Veelgestelde vragen\",\"policiesTitle\":\"Servicebeleid\",\"items\":{\"1\":{\"q\":\"Hoe boek ik een transfer?\",\"a\":\"Selecteer uw ophaal- en afleverlocaties, kies uw voertuig, datum en tijd en vul vervolgens het boekingsformulier in. U ontvangt direct een e-voucher met QR-code.\"},\"2\":{\"q\":\"Kan ik meerdere routes in één boeking boeken?\",\"a\":\"Ja. Ons boekingssysteem ondersteunt boekingen voor een enkele reis, retour, meerdere routes, meerdaagse boekingen en charters – allemaal in één reservering.\"},\"3\":{\"q\":\"Wat moet ik doen als mijn vlucht vertraagd is?\",\"a\":\"Wij houden de vluchtschema's in de gaten. Voor het ophalen op de luchthaven rekenen we 60 minuten gratis wachttijd vanaf uw werkelijke landingstijd mee.\"},\"4\":{\"q\":\"Welke betaalmethoden accepteert u?\",\"a\":\"Wij accepteren bankoverschrijvingen, creditcards/betaalkaarten en PromptPay tijdens het online boeken (demo maakt gebruik van nepbetalingsgegevens). Indien vooraf afgesproken, kunt u de chauffeur ook contant (THB) betalen.\"},\"5\":{\"q\":\"Wat zijn uw annuleringsvoorwaarden?\",\"a\":\"Gratis annuleren tot 24 uur voor afhaling. Voor annuleringen binnen 24 uur kan een toeslag van 50% in rekening worden gebracht. No-shows kunnen niet worden gerestitueerd.\"},\"6\":{\"q\":\"Heeft u kinderzitjes?\",\"a\":\"Ja, kinderzitjes zijn op aanvraag en zonder extra kosten beschikbaar. Geef tijdens het reserveren de leeftijd/het gewicht van de kinderen aan.\"},\"7\":{\"q\":\"Zijn de prijzen all-inclusive?\",\"a\":\"Ja. De genoemde prijzen zijn inclusief tol, parkeren, brandstof en chauffeursdienst. Er gelden alleen extra kosten voor wachten op overuren of optionele extra's die u aanvraagt.\"},\"8\":{\"q\":\"Hoe ontvang ik mijn e-voucher?\",\"a\":\"Nadat u uw boeking heeft bevestigd, wordt er direct een e-voucher met QR-code weergegeven, die u op elk moment opnieuw kunt openen vanaf uw boekingspagina. Laat het bij het ophalen aan de chauffeur zien.\"},\"9\":{\"q\":\"What documents and deposit are needed for car rental?\",\"a\":\"Please prepare an ID card or driver’s license, round-trip flight tickets in your name, and a reachable phone number. Security deposit is ฿3,000 for small cars and ฿5,000 for large cars. Pay ฿500 in advance when the car is confirmed; pay the rental fee and remaining deposit on contract day. The deposit is refunded after return and inspection. Free Krabi Airport pickup and drop-off is included.\"}},\"policies\":{\"waiting\":{\"title\":\"Wachttijd\",\"content\":\"Bij het ophalen op de luchthaven is 60 minuten gratis wachten inbegrepen. Bij het ophalen bij uw hotel/pier is 15 minuten gratis wachten inbegrepen. Extra wachten kost 200 THB per 30 minuten.\"},\"flight-delay\":{\"title\":\"Vlucht vertraging\",\"content\":\"We volgen uw vluchtnummer en passen de ophaaltijd automatisch aan. Geen extra kosten bij vertragingen tot 2 uur.\"},\"child-seat\":{\"title\":\"Kinderzitje\",\"content\":\"Baby-, peuter- en stoelverhogers zijn gratis beschikbaar. Verzoek tijdens het boeken.\"},\"pets\":{\"title\":\"Huisdieren\",\"content\":\"Kleine huisdieren in reismanden zijn welkom in de categorieën SUV's en bestelwagens. Er kunnen extra schoonmaakkosten van 300 THB van toepassing zijn.\"},\"ferry\":{\"title\":\"Veerbootverbindingen\",\"content\":\"Bij piertransfers is het afzetten bij de veerbootterminal inbegrepen. Ferrytickets kunnen als extra service worden geregeld.\"},\"toll\":{\"title\":\"Tol en parkeren\",\"content\":\"Alle tolgelden en parkeerkosten op luchthavens/pieren zijn bij de opgegeven prijs inbegrepen.\"},\"payment\":{\"title\":\"Betaling\",\"content\":\"Betaal online via kaart/overboeking of contant aan de chauffeur in THB. Prijzen zijn all-in, tenzij anders vermeld.\"},\"cancellation\":{\"title\":\"Annulering\",\"content\":\"Gratis annuleren 24+ uur voor het ophalen. Binnen 24 uur: 50% opgeladen. No-show: geen restitutie.\"},\"refund\":{\"title\":\"Terugbetaling\",\"content\":\"Goedgekeurde terugbetalingen worden binnen 5 tot 7 werkdagen verwerkt via de oorspronkelijke betaalmethode.\"},\"rental-deposit\":{\"title\":\"Car rental deposit\",\"content\":\"Small cars: ฿3,000 deposit. Large cars: ฿5,000 deposit. After confirmation, pay ฿500 advance deposit first. Pay rental fee and remaining deposit on contract day. Deposit is refunded after car return and inspection. Free Krabi Airport pickup \u0026 drop-off.\"}}},\"Reviews\":{\"pageTitle\":\"Klantrecensies\",\"pageSubtitle\":\"Echte feedback van reizigers in Zuid-Thailand.\",\"items\":{\"1\":{\"country\":\"Verenigd Koninkrijk\",\"comment\":\"Vlotte transfer van Krabi Airport naar Ao Nang. Chauffeur wachtte met een bord, auto was schoon en comfortabel.\",\"route\":\"KBV-luchthaven → Ao Nang-strand\"},\"2\":{\"country\":\"Duitsland\",\"comment\":\"Retour geboekt naar Railay Beach. Uitstekende communicatie en stipte service in beide richtingen.\",\"route\":\"KBV-luchthaven ↔ Railay Beach\"},\"3\":{\"country\":\"Japan\",\"comment\":\"VIP-busje voor ons gezin van 6 was perfect. Kinderen hielden van de koude handdoeken en snacks!\",\"route\":\"KBV Luchthaven → Centara Grand\"},\"4\":{\"country\":\"Italië\",\"comment\":\"Voordelige interprovinciale transfer naar Phuket. Iets vertraagd vanwege verkeer, maar de chauffeur hield ons op de hoogte.\",\"route\":\"Krabi → Phuket Luchthaven\"},\"5\":{\"country\":\"Australië\",\"comment\":\"Het ophalen van het hotel naar de pier was perfect. De chauffeur hielp met tassen en timede alles voor onze Phi Phi-veerboot.\",\"route\":\"Ao Nang Hotel → Ao Nang-pier\"},\"6\":{\"country\":\"Frankrijk\",\"comment\":\"Via de pier een strandtransfer naar Railay geboekt. Duidelijke updates over LINE en een schoon busje voor onze bagage.\",\"route\":\"Krabi → Railay Pier\"},\"7\":{\"country\":\"Thailand\",\"comment\":\"Gebruikte ze voor meerdaagse reizen rond Krabi. Gemakkelijk boeken, eerlijke prijs en chauffeurs die altijd op tijd zijn.\",\"route\":\"Dagelijks charter · Krabi\"}}},\"Transfer\":{\"fromEco\":\"Economy Sedan vanaf\",\"book\":\"Boek\",\"bookRoute\":\"Boek dit traject\",\"popularRoutes\":\"Populaire trajecten\",\"popularRoutesHint\":\"Voorbeeldtarieven voor Economy Sedan. De uiteindelijke prijs is afhankelijk van voertuig en datum.\",\"route\":\"Route\",\"distance\":\"Afstand\",\"duration\":\"Duur\",\"fromPrice\":\"Van (ECO)\",\"recommended\":\"Aanbevolen voertuigen\",\"recommendedBody\":\"Kies een voertuig dat past bij uw groepsgrootte en bagage.\",\"ctaTitle\":\"Klaar om te boeken {title}?\",\"ctaBody\":\"Ontvang direct een e-voucher met QR-code na het boeken.\",\"howTitle\":\"Hoe boeken werkt\",\"howSubtitle\":\"Drie eenvoudige stappen van offerte tot afhaling.\",\"step1Title\":\"Kies uw route\",\"step1Body\":\"Selecteer ophalen, afleveren, datum en voertuig.\",\"step2Title\":\"Bevestig \u0026 betaal\",\"step2Body\":\"Betaal veilig en ontvang uw e-Voucher met QR.\",\"step3Title\":\"Maak kennis met uw chauffeur\",\"step3Body\":\"Gegevens van de chauffeur arriveren vóór het ophalen. Ontspan en rijd.\",\"includedTitle\":\"Wat is inbegrepen\",\"otherServices\":\"Andere transferdiensten\",\"viewPrices\":\"Bekijk prijslijst\",\"startBooking\":\"Begin met boeken\",\"km\":\"{n} km\",\"approxMin\":\"~{n} min\",\"tipLabel\":\"Goed om te weten\",\"categories\":{\"airport\":\"Luchthaven\",\"hotel\":\"Hotel\",\"pier\":\"Pier\",\"beach\":\"Strand\",\"city\":\"Stad\",\"attraction\":\"Aantrekkingskracht\",\"inter-province\":\"Interprovincie\"},\"faqTitle\":\"Veelgestelde vragen over deze dienst\",\"faqSubtitle\":\"Snelle antwoorden voordat u boekt.\",\"reviewsTitle\":\"Wat reizigers zeggen\",\"allReviews\":\"Alle beoordelingen\",\"allFaq\":\"Alle veelgestelde vragen\",\"includedBadge\":\"Inbegrepen\"},\"TransferPages\":{\"airport-transfer\":{\"title\":\"Luchthaventransfer\",\"subtitle\":\"Privétransfers van en naar de luchthavens van Krabi en Zuid-Thailand\",\"intro\":\"Ophaalservice op vluchttijd met meet \u0026 greet-opties, bagageruimte en directe ritten naar hotels, stranden en pieren.\",\"tip\":\"Deel uw vluchtnummer tijdens het boeken. Ontmoetingspunten op de luchthaven van Krabi: binnenlandse deur 15, internationale deur 16 - kijk naar links nadat u bent uitgestapt.\",\"benefit1\":\"Vluchtbewaking en flexibele wachttijd\",\"benefit2\":\"Meet \u0026 greet bij aankomst op aanvraag\",\"benefit3\":\"Ruimte voor koffers – opties van sedan tot bestelwagen\",\"faq\":{\"1\":{\"q\":\"Wat moet ik doen als mijn vlucht vertraagd is?\",\"a\":\"We monitoren vluchten voor het ophalen vanaf de luchthaven en omvatten ongeveer 60 minuten gratis wachten vanaf uw werkelijke landingstijd.\"},\"2\":{\"q\":\"Biedt u een meet \u0026 greet aan?\",\"a\":\"Ja. Voeg uw vluchtnummer toe tijdens het boeken. Op Krabi Airport verlaten binnenlandse aankomsten deur 15 en internationale aankomsten verlaten deur 16. Kijk vervolgens naar links: de chauffeur wacht met uw naam op een bord.\"},\"3\":{\"q\":\"Hoeveel bagage mag ik meenemen?\",\"a\":\"In Economy sedans passen ongeveer 3 middelgrote tassen. Voor meer bagage of een gezin kiest u SUV, busje of VIP-busje op het boekingsformulier.\"},\"4\":{\"q\":\"Kun je ook ophalen op Phuket Airport?\",\"a\":\"Ja. We bestrijken Krabi (KBV) en geselecteerde luchthavens in Zuid-Thailand, inclusief Phuket, met privé point-to-point-tarieven.\"},\"5\":{\"q\":\"Hoe betaal ik voor luchthaventransfer?\",\"a\":\"Betaal online via bankoverschrijving, kaart of PromptPay wanneer u boekt. Indien nodig kan contant geld bij de chauffeur vooraf worden geregeld.\"},\"6\":{\"q\":\"Wanneer ontvang ik chauffeursgegevens?\",\"a\":\"De naam van de bestuurder, het telefoonnummer en de autogegevens worden vóór het ophalen gedeeld, meestal binnen 24 uur na uw overstaptijd.\"}}},\"hotel-transfer\":{\"title\":\"Hoteltransfer\",\"subtitle\":\"Deur-tot-deur ritten tussen resorts, hotels en belangrijke plekken in Krabi\",\"intro\":\"Privéauto naar uw hotellobby of villapoort - geen gedeelde busjes, geen extra stops.\",\"tip\":\"Voeg uw hotelnaam of speld toe aan de boekingsnotities voor een vlottere aflevering.\",\"benefit1\":\"Ophalen en wegbrengen van deur tot deur\",\"benefit2\":\"Ideaal voor late check-ins en vroeg vertrek\",\"benefit3\":\"Premium- en VIP-opties voor speciale verblijven\",\"faq\":{\"1\":{\"q\":\"Zet je me af in de hotellobby?\",\"a\":\"Ja. Transfers zijn van deur tot deur naar de lobby of de poort van de villa. Voeg de hotelnaam of kaartspeld toe aan uw boekingsnotities.\"},\"2\":{\"q\":\"Kan ik een ophaalservice bij het hotel 's avonds laat boeken?\",\"a\":\"Ja. Er zijn privétransfers beschikbaar voor vroeg vertrek en laat inchecken. Kies uw datum en tijd wanneer u boekt.\"},\"3\":{\"q\":\"Is dit een gedeelde shuttle?\",\"a\":\"Nee. Elke boeking is uitsluitend een privéauto voor uw groep, zonder extra hotelstops.\"},\"4\":{\"q\":\"Welk voertuig is het beste voor een resortverblijf?\",\"a\":\"Premium sedan of Signature Class is geschikt voor koppels; VIP-busje is ideaal voor gezinnen en extra bagage.\"},\"5\":{\"q\":\"Kan ik de hotelaflevering na het boeken wijzigen?\",\"a\":\"Ja, als het nieuwe hotel in de buurt is. Stuur ons zo vroeg mogelijk een bericht via LINE met uw boekingsnummer.\"},\"6\":{\"q\":\"Wacht u als het inchecken vertraagd is?\",\"a\":\"Korte wachttijden bij het hotel zijn prima. Voor langere vertragingen kunt u ons dat via LINE vertellen, zodat de chauffeur zich kan aanpassen.\"}}},\"pier-transfer\":{\"title\":\"Pier-overdracht\",\"subtitle\":\"Betrouwbare verbindingen met veerboot- en speedbootpieren\",\"intro\":\"Kom op tijd aan voor vertrek naar Phi Phi, Railay en eilanden met chauffeurs die de dienstregelingen van de pier kennen.\",\"tip\":\"Boek minimaal 45-60 minuten vóór vertrek van de veerboot vanuit Ao Nang of de stad.\",\"benefit1\":\"Getimed voor het vertrek van boten en veerboten\",\"benefit2\":\"Hulp met tassen naar de ingang van de pier\",\"benefit3\":\"Links vanaf luchthaven, hotel of strand\",\"faq\":{\"1\":{\"q\":\"Hoe vroeg moet ik vóór de veerboot aanwezig zijn?\",\"a\":\"Plan om de pier 45-60 minuten voor vertrek vanuit Ao Nang of Krabi te bereiken, vooral in het hoogseizoen.\"},\"2\":{\"q\":\"Kan de chauffeur helpen met tassen op de pier?\",\"a\":\"Ja. Chauffeurs helpen met bagage naar de ingang van de pier, zodat u gemakkelijker kunt inchecken voor uw boot.\"},\"3\":{\"q\":\"Heeft u verbinding met Phi Phi- en Railay-boten?\",\"a\":\"Ja. Populaire bestemmingen zijn de Ao Nang Pier en verbindingen naar de Phi Phi- en Railay-bootdiensten.\"},\"4\":{\"q\":\"Waar kan ik de vaartijden controleren?\",\"a\":\"Zie onze pagina Bootschema's voor voorbeelden van veerboot- en speedboottijden en boek vervolgens uw bijpassende piertransfer.\"},\"5\":{\"q\":\"Wat moet ik doen als mijn boot wordt geannuleerd?\",\"a\":\"Neem direct contact met ons op. We kunnen de transfer opnieuw plannen of helpen de drop-off aan te passen wanneer bootoperators van tijd veranderen.\"},\"6\":{\"q\":\"Kan ik dezelfde dag hotel → pier → hotel boeken?\",\"a\":\"Ja. Voeg beide etappes toe aan één boeking als multi-route, of boek twee enkele transfers met bijpassende tijden.\"}}},\"beach-transfer\":{\"title\":\"Strandoverdracht\",\"subtitle\":\"Directe ritten naar Ao Nang, Railay, Patong en kustgebieden\",\"intro\":\"Sla taxi's aan de stoep over en ga rechtstreeks van het vliegveld of hotel naar het strand tegen een vast privétarief.\",\"tip\":\"Toegang tot Railay kan een korte boottocht vanaf de pier omvatten; vraag het ons als u boekt.\",\"benefit1\":\"Vast privétarief, geen meterverrassingen\",\"benefit2\":\"Afleverpunten voor strand en resort\",\"benefit3\":\"Familie- en groepsvoertuigen beschikbaar\",\"faq\":{\"1\":{\"q\":\"Is het tarief voor het strand vast?\",\"a\":\"Ja. Bij privéstrandtransfers wordt een vast tarief voor uw voertuig gehanteerd – geen verrassingen op de stoeprand.\"},\"2\":{\"q\":\"Hoe bereik ik Railay-strand?\",\"a\":\"De meeste gasten rijden naar de Railay-pier en nemen vervolgens een korte gedeelde longtail. Vertel ons wanneer u boekt of u hulp nodig heeft bij het bepalen van de pier.\"},\"3\":{\"q\":\"Kun je langskomen bij strandresorts?\",\"a\":\"Ja. We stoppen bij hotels aan het strand en afgesproken strandtoegangspunten in Ao Nang, Railay-verbindingen en kustgebieden.\"},\"4\":{\"q\":\"Wat als ik kinderen en veel tassen heb?\",\"a\":\"Kies een SUV of bestelwagen voor extra ruimte. Kinderzitjes kunnen vooraf worden aangevraagd via boekingsnotities of LINE.\"},\"5\":{\"q\":\"Ga jij ook naar rustigere stranden?\",\"a\":\"Ja, waar de toegang tot de weg dit toelaat. Voeg de naam van het strand of resort toe in de notities en wij bevestigen het beste afleverpunt.\"},\"6\":{\"q\":\"Is een retourtje naar het strand goedkoper?\",\"a\":\"Retourboekingen zijn inclusief een kleine korting ten opzichte van twee afzonderlijke enkele reizen. Gebruik de prijschecker om te vergelijken.\"}}},\"city-transfer\":{\"title\":\"Stadsoverdracht\",\"subtitle\":\"Comfortabele ritten tussen steden in Zuid-Thailand\",\"intro\":\"Krabi, Trang, Surat Thani en meer: privéauto's voor boodschappen, hotels en dagverhuizingen.\",\"tip\":\"Voor stadsritten met meerdere tussenstops vermeldt u elke stop in het boekingsopmerkingen.\",\"benefit1\":\"Point-to-point of multi-stop op aanvraag\",\"benefit2\":\"Comfort met airconditioning voor langere stadswandelingen\",\"benefit3\":\"Van sedan tot busje voor gezinnen en bagage\",\"faq\":{\"1\":{\"q\":\"Kan ik meerdere tussenstops in de stad maken?\",\"a\":\"Ja, op aanvraag. Vermeld elke stop in de boekingsnotities, zodat we de tijd kunnen plannen en eerlijk kunnen citeren.\"},\"2\":{\"q\":\"Cover jij Trang en Surat Thani?\",\"a\":\"Ja. Stads- en stadstransfers omvatten Krabi en geselecteerde zuidelijke steden voor privé-punt-tot-punt-reizen.\"},\"3\":{\"q\":\"Is de auto voorzien van airconditioning?\",\"a\":\"Alle transfervoertuigen zijn voorzien van airconditioning en geschikt voor hitte overdag en langere stadsritten.\"},\"4\":{\"q\":\"Kan ik in de stad voor dezelfde dag boeken?\",\"a\":\"Vaak wel, afhankelijk van beschikbaarheid. Boek zo vroeg mogelijk online of stuur ons een bericht via LINE voor dringende reizen.\"},\"5\":{\"q\":\"Kan ik de auto een paar uur in de stad laten staan?\",\"a\":\"Voor wachten of gebruik op uurbasis kiest u voor charter per uur of noteert u de wachttijd bij het boeken, zodat we een correcte offerte kunnen maken.\"},\"6\":{\"q\":\"Haalt u op van bus- of treinstations?\",\"a\":\"Ja, waar vermeld op onze locaties. Selecteer het station als ophalen of afzetten op het boekingsformulier.\"}}},\"attraction-transfer\":{\"title\":\"Attractieoverdracht\",\"subtitle\":\"Tempels, smaragdgroene poelen, warmwaterbronnen en uitkijkpunten\",\"intro\":\"Privétransfers naar de belangrijkste bezienswaardigheden van Krabi met wacht-en-terug-opties voor dagtochten.\",\"tip\":\"Vraag om wait-and-return als u dezelfde auto wilt voor de terugreis.\",\"benefit1\":\"Populaire park- en tempelroutes\",\"benefit2\":\"Opties voor dagtochten met wacht en terugkomst\",\"benefit3\":\"Bestelwagens voor kleine groepen en touruitrusting\",\"faq\":{\"1\":{\"q\":\"Kan de chauffeur wachten terwijl wij langskomen?\",\"a\":\"Ja. Vraag om wait-and-return wanneer u boekt, zodat dezelfde auto u terug kan brengen na Emerald Pool, tempels of warmwaterbronnen.\"},\"2\":{\"q\":\"Welke bezienswaardigheden bestrijk je?\",\"a\":\"Populaire plekken zijn Emerald Pool, Tiger Cave Temple, warmwaterbronnen en andere Krabi-parken en uitkijkpunten.\"},\"3\":{\"q\":\"Is een busje beter voor een dagje sightseeing?\",\"a\":\"Voor 4+ gasten of natte kleding na het zwemmen is een busje of VIP-busje comfortabeler dan een sedan.\"},\"4\":{\"q\":\"Zijn er toegangskaarten bij de overstap inbegrepen?\",\"a\":\"Nee. Transfertarieven dekken alleen vervoer. Park- en tempeltickets worden ter plaatse betaald, tenzij je een aparte tour boekt.\"},\"5\":{\"q\":\"Kunnen we meer dan één attractie bezoeken?\",\"a\":\"Ja. Vermeld de volgorde van de tussenstops in uw boekingsnotities, of boek een charter voor meerdere routes/dagen voor een volledige rondrit.\"},\"6\":{\"q\":\"Hoe laat moeten we vertrekken voor ochtendbezichtigingen?\",\"a\":\"Voor populaire plekken zoals Emerald Pool helpt een vroege start hitte en drukte te voorkomen; we kunnen een ophaaltijd voorstellen als je boekt.\"}}},\"inter-province-transfer\":{\"title\":\"Interprovinciale overdracht\",\"subtitle\":\"Privétransfers over lange afstanden door Zuid-Thailand\",\"intro\":\"Krabi – Phuket, Trang, Surat Thani en verder: privé-SUV, busje of bus voor comfortabel reizen over de snelweg.\",\"tip\":\"Lange routes worden in het weekend geboekt – reserveer vroeg voor vertrek in de ochtend.\",\"benefit1\":\"Snelwegklare SUV-, bestelwagen- en busopties\",\"benefit2\":\"Vast tarief voor reizen van provincie naar provincie\",\"benefit3\":\"Ideaal voor groepen met bagage en uitrusting\",\"faq\":{\"1\":{\"q\":\"Welk voertuig is het beste voor lange snelwegritten?\",\"a\":\"SUV of busje voor comfort; VIP-busje of bus voor grotere groepen en meer bagage op de routes Krabi – Phuket of Surat.\"},\"2\":{\"q\":\"Is de prijs vast tussen provincies?\",\"a\":\"Ja. Voor transfers tussen provincies wordt een vast privétarief gebruikt voor het door u gekozen voertuig, dat wordt overeengekomen voordat u betaalt.\"},\"3\":{\"q\":\"Hoe vroeg moet ik weekendtrips boeken?\",\"a\":\"Weekends en feestdagen lopen vroeg vol: reserveer ochtendvertrek minimaal een dag van tevoren als je kunt.\"},\"4\":{\"q\":\"Zijn tolwegen op de snelweg inbegrepen?\",\"a\":\"De genoemde transferprijzen zijn inclusief standaard tolgelden en parkeren gerelateerd aan de reis, tenzij anders aangegeven bij de boeking.\"},\"5\":{\"q\":\"Zijn er rustpauzes inbegrepen op lange routes?\",\"a\":\"Chauffeurs kunnen tijdens lange snelwegritten kort stoppen voor toiletten of snacks. Vermeld de gewenste pauzes in uw aantekeningen.\"},\"6\":{\"q\":\"Kun je van Krabi naar Phuket reizen met vervoer naar je hotel?\",\"a\":\"Ja. Kies uw hotel of luchthaven in Phuket als drop-off: privé point-to-point, geen gedeelde bus.\"}}}},\"Vehicles\":{\"amenities\":{\"ac\":\"Airconditioning\",\"water\":\"Flessenwater\",\"charger\":\"Telefoon oplader\",\"legroom\":\"Extra beenruimte\",\"groupSeating\":\"Groepszitplaatsen\",\"leather\":\"Lederen stoelen\",\"wifi\":\"Wifi\",\"snacks\":\"Snacks\",\"meetGreet\":\"Ontmoet \u0026 begroet\",\"luxury\":\"Luxe sedan\",\"premium\":\"Premium voorzieningen\",\"priority\":\"Prioritaire dienst\",\"captain\":\"Kapiteinsstoelen\",\"privacy\":\"Privacyglas\",\"usb\":\"USB-opladen\",\"drinks\":\"Koude drankjes\",\"groupTravel\":\"Groepsreizen\",\"tourGuide\":\"Gidsruimte\"},\"bags\":\"{n} zakken\",\"largeCargo\":\"Grote laadruimte\",\"pax\":\"{n} pax\",\"bags3\":\"3 zakken\",\"bags4\":\"4 zakken\",\"bags6\":\"6 zakken\",\"bags8\":\"8 zakken\",\"bags10\":\"10 zakken\",\"ECO\":{\"name\":\"Economy-taxi\",\"luggage\":\"3 zakken\"},\"PREM\":{\"name\":\"Luxe Taxi\",\"luggage\":\"4 zakken\"},\"SUV\":{\"name\":\"SUV-taxi\",\"luggage\":\"6 zakken\"},\"VAN\":{\"name\":\"Van Taxi\",\"luggage\":\"6 zakken\"},\"VIP\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 zakken\"},\"SIG\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 zakken\"},\"EXE\":{\"name\":\"VIP-busje\",\"luggage\":\"8 zakken\"},\"BUS\":{\"name\":\"Minibus\",\"luggage\":\"Grote laadruimte\"}},\"Contact\":{\"title\":\"Neem contact met ons op\",\"subtitle\":\"Heeft u vragen? Ons team staat klaar om u te helpen met uw reisplannen voor Zuid-Thailand.\",\"sendTitle\":\"Stuur een bericht\",\"sendSubtitle\":\"Wij reageren doorgaans binnen 24 uur\",\"name\":\"Naam\",\"email\":\" le boten\",\"ferry\":\"Veerboot\",\"speedboat\":\"Speedboot\",\"longtail\":\"Langstaart\",\"route\":\"Route\",\"allRoutes\":\"Alle trajecten\",\"departures\":\"Vertrek\",\"duration\":\"Duur\",\"transferTo\":\"Overbrengen naar {pier}\",\"landTransfer\":\"Landoverdracht naar de pier\",\"emptyBoats\":\"Er zijn geen schema's die overeenkomen met uw filters.\",\"mockBanner\":\"Mock-bootschema's voor planning - tijden kunnen in werkelijkheid afwijken.\",\"ctaArticlesBody\":\"Bekijk live prijzen en boek een privéauto met directe e-Voucher.\",\"bookRouteBody\":\"Ontvang direct een prijs en een e-voucher met QR-code.\",\"relatedBoats\":\"Gerelateerde bootroutes\",\"landTransferBody\":\"Wij verkopen geen veerboottickets; wij brengen u op tijd naar het vertrekpunt.\",\"tourCtaTitle\":\"Boek pier- of hoteltransfer\",\"tourCtaBody\":\"Tourtickets worden verkocht door lokale exploitanten. Wij brengen u op tijd naar de vergaderpier met een e-Voucher.\",\"toursCtaBody\":\"Tourprijzen zijn schattingen van de exploitant (nep). Wij verzorgen hotel-piertransfers met een directe e-voucher.\",\"travelCtaBody\":\"Controleer de boottijden en boek vervolgens een privétransfer naar de pier of het hotel.\"},\"Articles\":{\"categories\":{\"Airport\":\"Luchthaven\",\"Beach\":\"Strand\",\"Pier\":\"Pier\",\"Inter Province\":\"Interprovincie\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"Krabi Airport Transfer Guide: vlotte aankomst bij KBV\",\"excerpt\":\"Wat u kunt verwachten na de landing op Krabi International Airport, hoe meet \u0026 greet werkt en hoe u een privétransfer boekt met een e-voucher.\",\"p1\":\"Landen op Krabi International Airport (KBV) is het begin van uw reis naar Zuid-Thailand. Met een privéluchthaventransfer kunt u wachtrijen voor taxi's overslaan en rechtstreeks naar uw hotel, strand of pier gaan.\",\"p2\":\"Met Krabi Links Taxi volgt uw chauffeur de vlucht en omvat hij gratis wachttijd voor het ophalen op de luchthaven. U ontvangt direct na het boeken een e-voucher met een QR-code. Toon deze op het ontmoetingspunt.\",\"p3\":\"Populaire routes vanaf KBV zijn onder meer Ao Nang Beach, Railay, Centara Grand en Krabi. Kies Economy Sedan voor koppels of een Van als u met familie en bagage reist.\",\"p4\":\"Tip: Geef tijdens het boeken uw vluchtnummer en hotelnaam door, zodat de chauffeur een naambordje kan voorbereiden en de beste route kan plannen rond avondverkeer.\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"Ao Nang en Railay strandtransfertips\",\"excerpt\":\"Hoe u zich kunt verplaatsen tussen Ao Nang, Railay en nabijgelegen resorts met privéauto's, pieren en het juiste voertuig voor strandtassen.\",\"p1\":\"Ao Nang is het knooppunt voor veel strandverblijven in Krabi, terwijl Railay bereikbaar is via korte pierverbindingen. Door uw transfer vooraf te plannen, blijft de dag eenvoudig.\",\"p2\":\"Boek vanaf de luchthaven of Krabi een privétransfer naar Ao Nang Beach of uw hotel. Voor Railay kunnen we u naar de pier brengen en u helpen bij het timen van uw bootverbinding.\",\"p3\":\"Als je snorkelspullen of grote tassen bij je hebt, geeft een SUV of Standard Van meer ruimte dan een sedan. Retourboekingen besparen ook tijd op de uitcheckdag.\",\"p4\":\"Avondretouren vanaf het strand kunnen druk zijn; reserveer uw ophaaltijd vroeg, vooral in het weekend en op feestdagen.\"},\"pier-transfer-to-phi-phi\":{\"title\":\"Piertransfer naar Phi Phi: wat reizigers moeten weten\",\"excerpt\":\"Een praktische checklist voor transfers van hotel naar pier, veerboottijden en bagagetips voordat u naar Phi Phi vertrekt.\",\"p1\":\"Eilanddagen beginnen op het land. Een betrouwbare piertransfer vanaf uw hotel of de luchthaven betekent dat u de Ao Nang Pier of andere vertrekpunten zonder haast bereikt.\",\"p2\":\"Bouw buffertijd in voor het inchecken en instappen. Tijdens het hoogseizoen raden we aan om minimaal 45-60 minuten vóór vertrek van de veerboot op de pier aan te komen.\",\"p3\":\"Privébusjes zijn ideaal voor groepen die dezelfde veerboot delen. Gezinnen kunnen tijdens het reserveren gratis kinderzitjes aanvragen.\",\"p4\":\"Na uw eilandtrip kunt u een ophaalservice vanaf de pier boeken, zodat er een chauffeur klaarstaat als de boot aanmeert – vooral handig als u in het donker aankomt.\"},\"krabi-to-phuket-inter-province\":{\"title\":\"Interprovinciale transfer van Krabi naar Phuket\",\"excerpt\":\"Vergelijk het comfort en de timing voor de corridor Krabi-Phuket, de voertuigopties en wanneer een privétransfer beter is dan gedeelde busjes.\",\"p1\":\"De route Krabi-Phuket is een van de meest gevraagde transfers tussen provincies in Zuid-Thailand. Privéauto's geven deur-tot-deur-timing zonder meerdere stops.\",\"p2\":\"Typische reizen verbinden KBV of Krabi met Phuket Airport of Patong. De reistijd is afhankelijk van het verkeer en of u vanaf het vliegveld of de stad vertrekt.\",\"p3\":\"Voor langere ritten bieden VIP Van- of Minibus-opties meer ruimte en comfort. De prijzen zijn all-inclusive, inclusief tolgelden en parkeren, tenzij u de wachttijd erbij optelt.\",\"p4\":\"Boek een retourvlucht als u naar de ene provincie en vanuit de andere vliegt: één reservering dekt beide trajecten met één e-voucherstroom.\"}}},\"Admin\":{\"loading\":\"Laden…\",\"loginTitle\":\"Beheerder inloggen\",\"loginHint\":\"Demo: {user} / {pass}\",\"username\":\"Gebruikersnaam\",\"password\":\"Wachtwoord\",\"signIn\":\"Log in\",\"loginError\":\"Ongeldige gebruikersnaam of wachtwoord\",\"logout\":\"Uitloggen\",\"backToSite\":\"Terug naar website\",\"panelTitle\":\"Operaties\",\"opsLabel\":\"Backoffice · Demo\",\"nav\":{\"dashboard\":\"Dashboard\",\"bookings\":\"Boekingen\",\"payments\":\"Betalingen\",\"schedule\":\"Schema\",\"drivers\":\"Chauffeurs\",\"customers\":\"Klanten\",\"prices\":\"Prijs tabellen\",\"vehicles\":\"Voertuigen\",\"settings\":\"Instellingen\"},\"dashboardTitle\":\"Dashboard\",\"dashboardSubtitle\":\"Live overzicht van overschrijvingen, betalingen en chauffeurs.\",\"resetDemo\":\"Demogegevens reset "onbekend van/naar locatie\",\"sameLocation\":\"van en naar zijn hetzelfde\",\"missingPrice\":\"ontbrekende voertuigprijs\"},\"confirmOrder\":\"Confirm order\",\"orderConfirmDue\":\"Order total\",\"toastOrderOk\":\"Order confirmed — voucher can be issued\",\"planPayDriver\":\"Pay driver\",\"planDeposit\":\"Deposit\",\"planFull\":\"Full payment\",\"settingsAdvanceDepositTiers\":\"Online deposit is automatic by booking total: \u003c=1000 -\u003e 200 / 1001-2999 -\u003e 500 / \u003e=3000 -\u003e 1000 (not editable).\"},\"Tours\":{\"categories\":{\"Island\":\"Eiland\",\"Snorkel\":\"Snorkelen\",\"Kayak\":\"Kajakken\",\"Sightseeing\":\"Bezienswaardigheden\",\"Combo\":\"Combinatie\"},\"items\":{\"phi-phi-islands-day-trip\":{\"title\":\"Dagtrip naar de Phi Phi-eilanden\",\"excerpt\":\"Klassieke Andaman-dagtocht met uitkijkpunt Maya Bay, snorkelstops en lunch op het strand.\",\"duration\":\"Volledige dag (~8–9 uur)\",\"fromArea\":\"Ao Nang / Krabi\",\"toArea\":\"Phi Phi-eilanden\",\"highlights\":{\"1\":\"Uitkijkpunt Maya Bay (afhankelijk van parkregels)\",\"2\":\"Snorkel bij heldere riffen\",\"3\":\"Strandlunch op Phi Phi Don of nabijgelegen baai\",\"4\":\"Ondersteuning voor ophaaltijden bij hotel of pier\"},\"includes\":{\"1\":\"Speedboot- of veerbootstoel (afhankelijk van de exploitant)\",\"2\":\"Kosten voor nationale parken (indien inbegrepen door de exploitant)\",\"3\":\"Lunch en drinkwater\",\"4\":\"Reddingsvest en snorkeluitrusting\"},\"content\":{\"1\":\"Phi Phi blijft een van de meest gevraagde dagtochten vanuit Krabi. De meeste pakketten vertrekken vroeg vanaf Ao Nang of nabijgelegen pieren en komen laat in de middag terug.\",\"2\":\"We raden u aan een privépiertransfer te boeken, zodat u vóór het inchecken met buffertijd arriveert. Avondretouren kunnen druk zijn; reserveer uw ophaalmoment wanneer u de tour boekt.\",\"3\":\"De getoonde tourprijzen zijn van typische lokale operators (nep-gidsprijzen). Bevestig de insluitsels, het boottype en de toegangsregels voor Maya Bay voor uw reisdatum.\"}},\"four-islands-tour\":{\"title\":\"4 Eilanden Tour (Kip, Tup, Poda \u0026 Railay)\",\"excerpt\":\"Kort eilandhoppen in de buurt van Ao Nang - ondiepe riffen, iconische rotsen en zachte zandstranden.\",\"duration\":\"Halve/hele dag\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Kip · Tup · Poda · Railay\",\"highlights\":{\"1\":\"Chicken Island-uitkijkpunt en snorkel\",\"2\":\"Zandbank van Tup Island (getijdenafhankelijk)\",\"3\":\"Zwemstop bij Poda Beach\",\"4\":\"Optionele Railay-drop of bezoek\"},\"includes\":{\"1\":\"Longtail- of speedboot\",\"2\":\"Snorkelmasker en reddingsvest\",\"3\":\"Fruit / frisdranken (afhankelijk van de operator)\",\"4\":\"Gids aan boord\"},\"content\":{\"1\":\"De 4 Eilandenroute is ideaal als je een landschap dichtbij Ao Nang wilt, zonder een lange overtocht naar Phi Phi.\",\"2\":\"Het getij beïnvloedt de zichtbaarheid van de zandbanken op Tup Island – vertrek in de ochtend geeft meestal de beste omstandigheden.\",\"3\":\"Combineer deze tour met een hotel-pier transfer, zodat u tijdens het hoogseizoen niet afhankelijk bent van last-minute songthaews.\"}},\"hong-island-lagoon\":{\"title\":\"Lagunereis naar Hong Island\",\"excerpt\":\"Kalme lagunes, kajakmogelijkheden en poederzandstranden in het Than Bok Khorani National Park.\",\"duration\":\"Volledige dag\",\"fromArea\":\"Ao Nang / Nopparat Thara\",\"toArea\":\"Hong-eiland\",\"highlights\":{\"1\":\"Uitzicht op de Emerald lagune\",\"2\":\"Kajak door kalkstenen kanalen\",\"3\":\"Rustige strandtijd\",\"4\":\"Nationaal park landschap\"},\"includes\":{\"1\":\"Boottransfer naar Hong Island\",\"2\":\"Kajak (gedeeld of privé – afhankelijk van de exploitant)\",\"3\":\"Nationaal parktarief (vaak inbegrepen)\",\"4\":\"Lunch op sommige pakketten\"},\"content\":{\"1\":\"Hong Island is populair bij reizigers die de voorkeur geven aan lagunes en kajakken boven dagen met een speedboot over lange afstanden.\",\"2\":\"Vertrek vindt vaak plaats vanaf de kant van Nopparat Thara / Ao Nang. Reken extra tijd als uw hotel in het binnenland of in Krabi ligt.\",\"3\":\"Vraag uw exploitant naar de openingsregels van het park en of kajaks zijn inbegrepen of ter plaatse worden gehuurd.\"}},\"james-bond-island-phang-nga\":{\"title\":\"James Bond-eiland · Baai van Phang Nga\",\"excerpt\":\"Iconische kalkstenen karsts, kanoën in grotten en de beroemde Koh Tapu-rotsnaald.\",\"duration\":\"Volledige dag\",\"fromArea\":\"Krabi / Phuket-kant\",\"toArea\":\"Phang Nga-baai\",\"highlights\":{\"1\":\"Koh Tapu (James Bond-eiland)\",\"2\":\"Kanoën door mangrovegrotten\",\"3\":\"Stop voor een moslim vissersdorp (afhankelijk van de exploitant)\",\"4\":\"Schilderachtige baaicruise\"},\"includes\":{\"1\":\"Boot- en kanosegment\",\"2\":\"Gids\",\"3\":\"Lunchen\",\"4\":\"Nationale parktarieven (pakketafhankelijk)\"},\"content\":{\"1\":\"Tours naar James Bond Island kunnen starten vanuit Krabi of Phuket. De reistijd aan land kan langer zijn dan het bootsegment zelf.\",\"2\":\"Een privétransfer tussen uw hotel en de vergaderpier zorgt ervoor dat de dag op schema blijft, vooral als u vroeg bij uw hotel wordt opgehaald.\",\"3\":\"Prijzen variëren sterk afhankelijk van de kwaliteit van de kano en de groepsgrootte; gebruik onze vanaf-prijs uitsluitend als planningsleidraad.\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"Combinatie van smaragdgroen zwembad en warmwaterbron\",\"excerpt\":\"Natuurdag op het land – smaragdgroene junglepoelen en minerale warmwaterbronnen in de buurt van Krabi.\",\"duration\":\"Halve dag\",\"fromArea\":\"Krabi-stad / Ao Nang\",\"toArea\":\"Emerald Pool · Hete bron\",\"highlights\":{\"1\":\"Zwem in Emerald Pool\",\"2\":\"Ontspan bij de natuurlijke warmwaterbron\",\"3\":\"Blue Pool-uitkijkpuntoptie\",\"4\":\"Gemakkelijke halve dag voor gezinnen\"},\"includes\":{\"1\":\"Entreegelden (pakketafhankelijk)\",\"2\":\"Handleiding voor sommige pakketten\",\"3\":\"Drinkwater\"},\"content\":{\"1\":\"Deze combinatie is perfect als de zee ruig is of als je een dag aan land wilt tussen eilandtrips.\",\"2\":\"Boek een attractietransfer voor deur-tot-deur-timing zonder vertragingen bij gedeelde busjes.\",\"3\":\"Neem waterschoenen mee, de paden kunnen na regen glad zijn.\"}},\"railay-sunset-longtail\":{\"title\":\"Railay-zonsondergang per langstaart\",\"excerpt\":\"Korte piersprong naar Railay voor uitzichtpunten, kliffen beklimmen en foto's van het gouden uur.\",\"duration\":\"3–5 uur / avond\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Railay-strand\",\"highlights\":{\"1\":\"Longtail naar Railay West/Oost\",\"2\":\"Phra Nang Cave Beach-wandeling\",\"3\":\"Zonsondergang op Railay West\",\"4\":\"Optioneel diner op het strand\"},\"includes\":{\"1\":\"Longtail retour (gedeeld of privé)\",\"2\":\"Reddingsvest\"},\"content\":{\"1\":\"Railay ligt op slechts een korte boottocht van Ao Nang, maar voelt als een andere bestemming.\",\"2\":\"Controleer de retourboottijden als u voor zonsondergang blijft; privé-longtails zijn flexibel wanneer openbare boten vertragen.\",\"3\":\"We kunnen u op verzoek afzetten bij de Ao Nang Pier en wachten tot u wordt opgehaald.\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"Bestemming\",\"Island\":\"Eiland\",\"Corridor\":\"Gang\",\"Practical\":\"Praktisch\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"Ao Nang als uw Krabi-basis\",\"excerpt\":\"Waar te verblijven, hoe u de pier kunt bereiken en hoe u stranden, Railay en dagtochten met elkaar kunt verbinden.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Blijf in de buurt van de strandweg voor gemakkelijke longtail-toegang tot Railay.\",\"2\":\"Boek piertransfers de avond vóór drukke veerbootochtenden.\",\"3\":\"Het avondverkeer tussen Krabi en Ao Nang kan 15 tot 25 minuten duren.\"},\"content\":{\"1\":\"Ao Nang is de meest praktische uitvalsbasis voor nieuwe bezoekers: restaurants, excursiebalies en toegang tot boten liggen dicht bij elkaar.\",\"2\":\"Maak gebruik van privétransfers vanaf Krabi Airport (KBV) als u met bagage of in het donker aankomt; taxi's met een meter en gedeelde busjes variëren in wachttijd.\",\"3\":\"Vanuit Ao Nang kun je Railay in ongeveer 15 minuten bereiken met de longtail, deelnemen aan 4 Islands-tochten of verbinding maken met Phi Phi-speedboten.\",\"4\":\"Als uw hotel bergopwaarts of landinwaarts ligt, voeg dan buffertijd toe aan elk vertrek van de pier.\"}},\"railay-access-tips\":{\"title\":\"Zonder stress naar Railay Beach gaan\",\"excerpt\":\"Bootopties, bagagetips en wanneer u een privé-longtail of gedeelde boten moet boeken.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Grote koffers zijn gemakkelijker voor privé-longtails.\",\"2\":\"Railay East kan bij eb modderig zijn; West is beter voor zonsondergang.\",\"3\":\"Bevestig de retourbootplannen vóór het diner.\"},\"content\":{\"1\":\"Railay heeft geen toegang tot de weg. Bijna iedereen komt per boot vanuit Ao Nang of via langere routes vanuit Krabi-stad.\",\"2\":\"Gedeelde longtails zijn goedkoop en komen overdag vaak voor. Privéboten kosten meer, maar helpen met timing, kinderen en grote tassen.\",\"3\":\"Klimmen, kajakken en Phra Nang Cave Beach zijn te voet te bereiken zodra je aankomt - plan schoenen voor rotsachtige paden.\",\"4\":\"We kunnen uw hotel → Ao Nang Pier overbrengen en een getimede ophaalservice na zonsondergang regelen.\"}},\"phi-phi-arrival-checklist\":{\"title\":\"Phi Phi aankomstchecklist\",\"excerpt\":\"Veerboot versus speedboot, timing van de pier en hoe u hoteltransfers voor en na de overtocht kunt aansluiten.\",\"region\":\"Phi Phi / Krabi\",\"tips\":{\"1\":\"Kom in het hoogseizoen 45-60 minuten eerder aan op de pier.\",\"2\":\"Speedboten zijn sneller; veerboten zijn meestal soepeler en goedkoper.\",\"3\":\"Boek de landtransfer vooraf, zodat u zich niet haast met bagage.\"},\"content\":{\"1\":\"Eilanddagen beginnen op het land. Een betrouwbare transfer van hotel naar pier is net zo belangrijk als het bootticket zelf.\",\"2\":\"Weer- en parkregels kunnen de toegang tot Maya Bay veranderen. Neem de dag ervoor contact op met uw operator.\",\"3\":\"Op terugkomstavonden zijn de pick-ups van de privépier beter dan het wachten op gedeelde busjes, vooral met natte tassen en vermoeide kinderen.\",\"4\":\"Als u de volgende ochtend vanuit Phuket of Krabi vliegt, houd dan rekening met buffertijd voor vertragingen van de veerboot.\"}},\"krabi-phuket-corridor\":{\"title\":\"Krabi-Phuket Corridor: overdrachtstips\",\"excerpt\":\"Wanneer een privéauto de gedeelde busjes verslaat op de drukste interprovinciale route in het zuiden.\",\"region\":\"Krabi · Phuket\",\"tips\":{\"1\":\"Privéauto's van deur tot deur slaan meerdere hotelstops over.\",\"2\":\"Voor luchthaven-luchthaventransfers zijn vluchtvolgsystemen en wachttijden vereist.\",\"3\":\"Tol en parkeren zijn meestal inbegrepen in particuliere offertes.\"},\"content\":{\"1\":\"Krabi ↔ Phuket is de meest gevraagde interprovinciale corridor voor vliegverbindingen en reizen met meerdere verblijven.\",\"2\":\"Gedeelde busjes zijn goedkoper, maar voegen tijd toe met stops. Privé-SUV's of busjes zijn geschikt voor gezinnen en krappe vluchtschema's.\",\"3\":\"Typische trajecten verbinden KBV of Krabi met Phuket Airport, Patong of hotels aan de westkust.\",\"4\":\"Boek een retourvlucht als u naar de ene provincie en vanuit de andere vliegt: één e-voucher dekt beide trajecten.\"}}}},\"Boats\":{\"items\":{\"ao-nang-railay-longtail\":{\"routeLabel\":\"Ao Nang-pier → Railay Beach\",\"operator\":\"Lokale longtail (gedeeld)\",\"notes\":\"Frequent gedeelde longtails; privécharter beschikbaar. Avondboten verdwijnen na zonsondergang.\"},\"railay-ao-nang-longtail\":{\"routeLabel\":\"Railay Beach → Ao Nang-pier\",\"operator\":\"Lokale longtail (gedeeld)\",\"notes\":\"Retourboten vanuit Railay West / Oost, afhankelijk van getij en bagage.\"},\"ao-nang-phi-phi-speedboat\":{\"routeLabel\":\"Ao Nang / Tonsai → Phi Phi\",\"operator\":\"Exploitanten van speedboten (nep)\",\"notes\":\"De exacte pier (Ao Nang versus Tonsai) is afhankelijk van de exploitant. Aankomst 30-45 minuten eerder in het hoogseizoen.\"},\"phi-phi-ao-nang-speedboat\":{\"routeLabel\":\"Phi Phi → Ao Nang / Tonsai\",\"operator\":\"Exploitanten van speedboten (nep)\",\"notes\":\"Boek vooraf het ophalen van de retourpier als je in het donker aankomt.\"},\"ao-nang-phi-phi-ferry\":{\"routeLabel\":\"Ao Nang-gebied → Phi Phi (veerboot)\",\"operator\":\"Veerboot / gecombineerde transfer (nep)\",\"notes\":\"Langzamer en meestal goedkoper dan speedboot. Kan een busje naar een grotere veerbootpier omvatten.\"},\"krabi-lanta-ferry\":{\"routeLabel\":\"Krabi → Ko Lanta\",\"operator\":\"Combinatie veerboot + busje (nep)\",\"notes\":\"Veel pakketten maken gebruik van Krabi of nabijgelegen pieren; bevestig het ontmoetingspunt. Duur omvat weg + zee.\"},\"phi-phi-phuket-ferry\":{\"routeLabel\":\"Phi Phi → Phuket\",\"operator\":\"Veerbootexploitanten (nep)\",\"notes\":\"Maak na aankomst verbinding met een privétransfer op Phuket Airport of Patong.\"},\"railay-hong-island-speedboat\":{\"routeLabel\":\"Ao Nang → Hong-eiland\",\"operator\":\"Speedboot voor een dagtocht (nep)\",\"notes\":\"Meestal verkocht als dagretourpakket in plaats van enkele reis.\"}}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":[\"$L14\",\"$L15\",\"$L16\"]}]\n"])</script><script>self.__next_f.push([1,"17:I[46615,[\"/nx/static/chunks/05-c3ty_6dwfk.js\",\"/nx/static/chunks/14mrh2-p_w84d.js\",\"/nx/static/chunks/21tc7p_83e_60.js\",\"/nx/static/chunks/31ctb4udrm_a8.js\",\"/nx/static/chunks/0zzkc_tjs3n7s.js\",\"/nx/static/chunks/3hgzbzv7ke2vh.js\",\"/nx/static/chunks/1ry2kng4m4i1k.js\",\"/nx/static/chunks/0zmvyptk783y8.js\",\"/nx/static/chunks/1t9su4fr6oisq.js\",\"/nx/static/chunks/0uuo53yvv0kb-.js\"],\"HtmlLang\"]\n18:I[87749,[\"/nx/static/chunks/05-c3ty_6dwfk.js\",\"/nx/static/chunks/14mrh2-p_w84d.js\",\"/nx/static/chunks/21tc7p_83e_60.js\",\"/nx/static/chunks/31ctb4udrm_a8.js\",\"/nx/static/chunks/0zzkc_tjs3n7s.js\",\"/nx/static/chunks/3hgzbzv7ke2vh.js\",\"/nx/static/chunks/1ry2kng4m4i1k.j
