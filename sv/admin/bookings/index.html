are your national ID card or driver’s license.\",\"reqHintFlight\":\"Prepare round-trip flight tickets with the customer’s name.\",\"reqHintPhone\":\"Provide a phone number we can reach you on.\",\"specialRequests\":\"Särskilda önskemål\",\"phName\":\"John Smith\",\"phPhone\":\"+66 ...\",\"phEmail\":\"email@example.com\",\"phFlight\":\"FD1234\",\"phNotes\":\"Barnstol, extra stopp osv.\",\"paymentTitle\":\"Betalning\",\"paymentSubtitle\":\"Välj hur du ska betala – bankuppgifter, QR- och kortfält är skendemodata\",\"paymentSubtitleTransfer\":\"Bank transfer or PromptPay — upload your slip to confirm\",\"paymentSubtitleRental\":\"Choose a payment plan: tiered deposit or pay in full — balance due later\",\"summaryTitle\":\"Bokningssammanfattning\",\"summarySubtitle\":\"Granska innan du bekräftar\",\"total\":\"Totalt\",\"estimatedTotal\":\"Estimated rental total\",\"payToday\":\"Pay today\",\"balanceDue\":\"฿{amount} balance due at contract signing\",\"paymentMethod\":\"Betalningssätt:\",\"bankTransfer\":\"Banköverföring\",\"card\":\"Kort\",\"promptpay\":\"PromptPay\",\"cash\":\"Kontant till föraren\",\"confirmBooking\":\"Bekräfta bokning\",\"confirmBank\":\"Bekräfta bokning (väntar på överföring)\",\"confirmCard\":\"Betala med kort \u0026 bekräfta\",\"confirmPromptPay\":\"Bekräfta PromptPay-betalning\",\"confirmCash\":\"Bekräfta kontantbokning\",\"cancelPolicyNote\":\"Gratis avbokning fram till {hours} timmar före hämtning. Därefter tillkommer en avgift på {percent}%.\",\"noShowPolicyNote\":\"No-show fee is {percent}% of the booking amount.\",\"refundPolicyNote\":\"Refunds are processed within {days} business days after approval.\",\"policyBoxTitle\":\"Booking \u0026 payment notes\",\"policyBoxHint\":\"Tap to view cancellation, deposit, and airport notes\",\"policyBoxTitleTransfer\":\"Cancellation policy\",\"policyBoxHintTransfer\":\"Tap to view transfer cancellation terms\",\"cancelTitle\":\"Cancellation\",\"depositTitle\":\"Car rental deposit\",\"depositSmallLabel\":\"Small car\",\"depositSmallAmount\":\"฿3,000\",\"depositLargeLabel\":\"Large car\",\"depositLargeAmount\":\"฿5,000\",\"depositStepAdvance\":\"After confirmation, pay {amount} advance deposit first.\",\"depositStepContract\":\"Pay rental fee and remaining deposit on contract day.\",\"depositStepRefund\":\"Deposit is refunded after car return and inspection.\",\"airportTitle\":\"Airport transfer\",\"depositNote\":\"Car rental security deposit: small car ฿3,000 · large car ฿5,000. Online booking deposit uses tiers: ≤฿1,000 → ฿200; ฿1,001–฿2,999 → ฿500; ≥฿3,000 → ฿1,000. Remaining balance is paid later. Security deposit refunded after return and inspection.\",\"airportTransferNote\":\"Free Krabi Airport pickup \u0026 drop-off for car rental customers.\",\"processing\":\"Bearbetar...\",\"demoNote\":\"Demobetalning — ingen riktig kostnad · e-voucher utfärdad efter bekräftelse\",\"at\":\"kl\",\"toastCustomer\":\"Fyll i alla kunduppgifter\",\"toastAdvance24h\":\"Please book at least 24 hours in advance\",\"advanceBookingHint\":\"Bookings must be made at least 24 hours before pickup. Night pickups (00:00–08:00) include a ฿200 driver service charge.\",\"nightSurchargeLabel\":\"Night driver service charge (00:00–08:00)\",\"nightSurchargeHint\":\"Special overnight hours — ฿200 added for the driver.\",\"toastPayment\":\"Vänligen välj en betalningsmetod\",\"toastRemoteSyncOk\":\"Booking saved to the cloud — you can reopen the voucher anytime.\",\"toastRemoteSyncFail\":\"Saved on this device only. Cloud sync failed — keep your booking number.\",\"toastFail\":\"Kunde inte bekräfta bokningen. Kontrollera dina uppgifter.\",\"types\":{\"one-way\":{\"label\":\"One Way\",\"desc\":\"Enkel överföring\",\"detail\":\"Enkel överföring från punkt till punkt.\"},\"round-trip\":{\"label\":\"Rundresa\",\"desc\":\"Returresa ingår\",\"detail\":\"Vi skapar automatiskt en retursträcka med omvänd rutt.\"},\"multi-route\":{\"label\":\"Flerväg\",\"desc\":\"Flera destinationer\",\"detail\":\"Lägg till så många sträckor som du behöver för din resa.\"},\"multi-day\":{\"label\":\"Flera dagar\",\"desc\":\"Olika datum\",\"detail\":\"Schemalägg överföringar på olika datum inom en bokning.\"},\"daily-charter\":{\"label\":\"Daglig stadga\",\"desc\":\"8 timmar hel dag\",\"detail\":\"Heldagscharter (8 timmar) — välj ditt fordon och starttid.\"},\"hourly-charter\":{\"label\":\"Timcharter\",\"desc\":\"Minst 3 timmar\",\"detail\":\"Minst 3 timmar — flexibla stopp inom din charterperiod.\"}},\"paymentSubtitlePlans\":\"Choose pay to driver, deposit, or pay in full — then complete payment details\",\"payAtPickup\":\"Pay at pickup\",\"balanceDueDriver\":\"Pay ฿{amount} in cash to the driver at pickup\",\"paymentPlanLabel\":\"Payment plan:\",\"confirmPayDriver\":\"Submit booking (awaiting staff confirmation)\",\"depositStepAdvanceTier\":\"Online deposit tiers: ≤฿1,000 → ฿200 · ฿1,001–฿2,999 → ฿500 · ≥฿3,000 → ฿1,000.\",\"toastPaymentPlan\":\"Please choose a payment plan\",\"routePreviewOfficial\":\"Official tariff\",\"routePreviewOnRequest\":\"On request\"},\"Pages\":{\"fleet\":\"Vår flotta\",\"priceList\":\"Prislista\",\"faq\":\"FAQ\",\"reviews\":\"Kundrecensioner\",\"contact\":\"Kontakta oss\",\"articles\":\"Researtiklar\",\"tours\":\"Turer\",\"boatSchedules\":\"Båtscheman\",\"travelInfo\":\"Reseinformation\",\"fleetSubtitle\":\"8 fordonsklasser med riktiga foton och fullständiga specifikationer\",\"priceListSubtitle\":\"Transparenta priser för överföringar och daglig hyra\",\"reviewsSubtitle\":\"Verklig feedback från resenärer i södra Thailand\",\"contactSubtitle\":\"Har du frågor? Vårt team är redo att hjälpa till med dina södra Thailand resplaner.\",\"articlesSubtitle\":\"Guider för transfer från flygplats, strand, pir och mellan provinser\",\"toursSubtitle\":\"Dagsturer och öupplevelser runt Krabi\",\"boatSchedulesSubtitle\":\"Mock färja och motorbåt avgångstider\",\"travelInfoSubtitle\":\"Praktiska tips för populära resmål i södra Thailand\"},\"Site\":{\"slogan\":\"Ditt betrodda överföringsnätverk för södra Thailand\",\"tagline\":\"Södra Thailands plattform för resor och transport\"},\"Faq\":{\"pageTitle\":\"FAQ \u0026 policyer\",\"pageSubtitle\":\"Allt du behöver veta om bokning, betalningar och våra servicestandarder.\",\"sectionTitle\":\"Vanliga frågor\",\"policiesTitle\":\"Servicepolicyer\",\"items\":{\"1\":{\"q\":\"Hur bokar jag en transfer?\",\"a\":\"Välj dina hämtnings- och avlämningsplatser, välj ditt fordon, datum och tid och fyll sedan i bokningsformuläret. Du kommer att få en e-kupong med QR-kod direkt.\"},\"2\":{\"q\":\"Kan jag boka flera rutter i en bokning?\",\"a\":\"Ja. Vårt bokningssystem stöder enkel-, tur- och retur-, flervägs-, flerdagars- och charterbokningar – allt i en enda bokning.\"},\"3\":{\"q\":\"Vad händer om mitt flyg är försenat?\",\"a\":\"Vi övervakar flygscheman. För hämtning på flygplatsen inkluderar vi 60 minuters gratis väntetid från din faktiska landningstid.\"},\"4\":{\"q\":\"Vilka betalningsmetoder accepterar du?\",\"a\":\"Vi accepterar banköverföring, kredit-/betalkort och PromptPay under onlinebokning (demo använder falska betalningsdata). Du kan också betala föraren kontant (THB) om det är överenskommet i förväg.\"},\"5\":{\"q\":\"Vad är din avbokningsregler?\",\"a\":\"Gratis avbokning upp till 24 timmar före hämtning. Avbokningar inom 24 timmar kan medföra en avgift på 50 %. Uteblivna ankomster är ej återbetalningsbara.\"},\"6\":{\"q\":\"Tillhandahåller ni barnstolar?\",\"a\":\"Ja, barnstolar finns tillgängliga på begäran utan extra kostnad. Vänligen ange barnens ålder/vikt vid bokning.\"},\"7\":{\"q\":\"Är priserna all inclusive?\",\"a\":\"Ja. Angivna priser inkluderar vägtullar, parkering, bränsle och förarservice. Extra avgifter gäller endast för övertidsväntan eller valfria tillägg som du begär.\"},\"8\":{\"q\":\"Hur får jag min e-voucher?\",\"a\":\"Efter att du har bekräftat din bokning visas en e-voucher med QR-kod omedelbart och kan när som helst öppnas igen från din bokningssida. Visa den för föraren vid hämtning.\"},\"9\":{\"q\":\"What documents and deposit are needed for car rental?\",\"a\":\"Please prepare an ID card or driver’s license, round-trip flight tickets in your name, and a reachable phone number. Security deposit is ฿3,000 for small cars and ฿5,000 for large cars. Pay ฿500 in advance when the car is confirmed; pay the rental fee and remaining deposit on contract day. The deposit is refunded after return and inspection. Free Krabi Airport pickup and drop-off is included.\"}},\"policies\":{\"waiting\":{\"title\":\"Väntetid\",\"content\":\"Upphämtning på flygplatsen inkluderar 60 minuters gratis väntetid. Hämtning på hotell/pir inkluderar 15 minuters gratis väntan. Ytterligare väntetid debiteras med 200 THB per 30 minuter.\"},\"flight-delay\":{\"title\":\"Flygförsening\",\"content\":\"Vi spårar ditt flightnummer och justerar upphämtningstiden automatiskt. Ingen extra kostnad för förseningar upp till 2 timmar.\"},\"child-seat\":{\"title\":\"Barnstol\",\"content\":\"Spädbarn, småbarn och bältesstolar tillgängliga gratis. Begär vid bokning.\"},\"pets\":{\"title\":\"Husdjur\",\"content\":\"Små husdjur i bärare är välkomna i kategorierna SUV och skåpbilar. Ytterligare städavgift på 300 THB kan tillkomma.\"},\"ferry\":{\"title\":\"Färjeförbindelser\",\"content\":\"Pirtransfer inkluderar avlämning vid färjeterminalen. Färjebiljetter kan ordnas som en tilläggstjänst.\"},\"toll\":{\"title\":\"Vägtull \u0026 Parkering\",\"content\":\"Alla vägtullar och parkeringsavgifter på flygplatser/bryggor ingår i det angivna priset.\"},\"payment\":{\"title\":\"Betalning\",\"content\":\"Betala online via kort/överföring eller kontant till föraren i THB. Priserna är all inclusive om inget annat anges.\"},\"cancellation\":{\"title\":\"Avbokning\",\"content\":\"Gratis avbokning 24+ timmar före hämtning. Inom 24 timmar: 50 % laddning. No-show: ingen återbetalning.\"},\"refund\":{\"title\":\"Återbetalning\",\"content\":\"Godkända återbetalningar behandlas inom 5–7 arbetsdagar till den ursprungliga betalningsmetoden.\"},\"rental-deposit\":{\"title\":\"Car rental deposit\",\"content\":\"Small cars: ฿3,000 deposit. Large cars: ฿5,000 deposit. After confirmation, pay ฿500 advance deposit first. Pay rental fee and remaining deposit on contract day. Deposit is refunded after car return and inspection. Free Krabi Airport pickup \u0026 drop-off.\"}}},\"Reviews\":{\"pageTitle\":\"Kundrecensioner\",\"pageSubtitle\":\"Verklig feedback från resenärer i södra Thailand.\",\"items\":{\"1\":{\"country\":\"Storbritannien\",\"comment\":\"Smidig transfer från Krabis flygplats till Ao Nang. Föraren väntade med en skylt, bilen var ren och bekväm.\",\"route\":\"KBV flygplats → Ao Nang Beach\"},\"2\":{\"country\":\"Tyskland\",\"comment\":\"Bokade tur och retur till Railay Beach. Utmärkt kommunikation och punktlig service åt båda hållen.\",\"route\":\"KBV flygplats ↔ Railay Beach\"},\"3\":{\"country\":\"Japan\",\"comment\":\"VIP van för vår familj på 6 var perfekt. Barnen älskade de kalla handdukarna och snacks!\",\"route\":\"KBV flygplats → Centara Grand\"},\"4\":{\"country\":\"Italien\",\"comment\":\"Prisvärd transfer mellan provinserna till Phuket. Något försenat på grund av trafik men föraren höll oss informerade.\",\"route\":\"Krabi → Phukets flygplats\"},\"5\":{\"country\":\"Australien\",\"comment\":\"Hotellupphämtning till piren var perfekt. Chauffören hjälpte till med väskor och tajmade allt för vår Phi Phi-färja.\",\"route\":\"Ao Nang Hotel → Ao Nang Pier\"},\"6\":{\"country\":\"Frankrike\",\"comment\":\"Bokade en strandtransfer till Railay via piren. Tydliga uppdateringar på LINE och en ren skåpbil för vårt bagage.\",\"route\":\"Krabi Town → Railay Pier\"},\"7\":{\"country\":\"Thailand\",\"comment\":\"Använde dem för flerdagarsturer runt Krabi. Enkel bokning, rimligt pris och förare alltid i tid.\",\"route\":\"Daglig charter · Krabi\"}}},\"Transfer\":{\"fromEco\":\"Ekonomi Sedan från\",\"book\":\"Boka\",\"bookRoute\":\"Boka denna rutt\",\"popularRoutes\":\"Populära rutter\",\"popularRoutesHint\":\"Exempelpriser för Economy Sedan. Slutpriset beror på fordon och datum.\",\"route\":\"Rutt\",\"distance\":\"Avstånd\",\"duration\":\"Varaktighet\",\"fromPrice\":\"Från (ECO)\",\"recommended\":\"Rekommenderade fordon\",\"recommendedBody\":\"Välj ett fordon som passar din gruppstorlek och ditt bagage.\",\"ctaTitle\":\"Redo att boka {title}?\",\"ctaBody\":\"Få en omedelbar e-kupong med QR-kod efter bokning.\",\"howTitle\":\"Så fungerar bokning\",\"howSubtitle\":\"Tre enkla steg från offert till avhämtning.\",\"step1Title\":\"Välj din rutt\",\"step1Body\":\"Välj hämtning, avlämning, datum och fordon.\",\"step2Title\":\"Bekräfta \u0026 betala\",\"step2Body\":\"Betala säkert och få din e-voucher med QR.\",\"step3Title\":\"Möt din förare\",\"step3Body\":\"Förarens uppgifter anländer före hämtning. Slappna av och rid.\",\"includedTitle\":\"Vad som ingår\",\"otherServices\":\"Andra transfertjänster\",\"viewPrices\":\"Se prislista\",\"startBooking\":\"Börja boka\",\"km\":\"{n} km\",\"approxMin\":\"~{n} min\",\"tipLabel\":\"Bra att veta\",\"categories\":{\"airport\":\"Flygplats\",\"hotel\":\"Hotell\",\"pier\":\"Pier\",\"beach\":\"Strand\",\"city\":\"Stad\",\"attraction\":\"Attraktion\",\"inter-province\":\"Inter provinsen\"},\"faqTitle\":\"FAQ för denna tjänst\",\"faqSubtitle\":\"Snabba svar innan du bokar.\",\"reviewsTitle\":\"Vad resenärer säger\",\"allReviews\":\"Alla recensioner\",\"allFaq\":\"Alla FAQ\",\"includedBadge\":\"Ingår\"},\"TransferPages\":{\"airport-transfer\":{\"title\":\"Flygplatstransfer\",\"subtitle\":\"Privat transfer till och från flygplatserna i Krabi och södra Thailand\",\"intro\":\"Flygtidsanpassade hämtningar med mötes- och hälsningsalternativ, bagageutrymme och direktresor till hotell, stränder och bryggor.\",\"tip\":\"Dela ditt flightnummer när du bokar. Krabi flygplats mötesplatser: inrikes dörr 15, internationell dörr 16 — titta till vänster när du har gått ut.\",\"benefit1\":\"Flygövervakning och flexibel väntetid\",\"benefit2\":\"Möt \u0026 hälsa vid ankomster på begäran\",\"benefit3\":\"Plats för resväskor – sedan till skåpbilsalternativ\",\"faq\":{\"1\":{\"q\":\"Vad händer om mitt flyg är försenat?\",\"a\":\"Vi övervakar flygningar för hämtning på flygplatsen och inkluderar cirka 60 minuters gratis väntetid från din faktiska landningstid.\"},\"2\":{\"q\":\"Erbjuder ni meet \u0026 greet?\",\"a\":\"Ja. Lägg till ditt flightnummer vid bokning. På Krabis flygplats går inrikes ankomster ut genom dörr 15 och internationella ankomster går ut genom dörr 16, titta sedan till vänster — föraren väntar med ditt namn på en skylt.\"},\"3\":{\"q\":\"Hur mycket bagage kan jag ta med?\",\"a\":\"Ekonomisedaner rymmer cirka 3 medelstora väskor. För mer bagage eller en familj, välj SUV, skåpbil eller VIP skåpbil på bokningsformuläret.\"},\"4\":{\"q\":\"Kan du hämta på Phukets flygplats också?\",\"a\":\"Ja. Vi täcker Krabi (KBV) och utvalda flygplatser i södra Thailand, inklusive Phuket, med privata punkt-till-punkt-priser.\"},\"5\":{\"q\":\"Hur betalar jag för flygplatstransfer?\",\"a\":\"Betala online med banköverföring, kort eller PromptPay när du bokar. Kontanter till föraren kan ordnas i förväg vid behov.\"},\"6\":{\"q\":\"När får jag förarinformation?\",\"a\":\"Förarnamn, telefon och bilinformation delas före hämtning - vanligtvis inom 24 timmar efter din överföringstid.\"}}},\"hotel-transfer\":{\"title\":\"Hotellöverföring\",\"subtitle\":\"Åker från dörr till dörr mellan resorter, hotell och viktiga platser i Krabi\",\"intro\":\"Privat bil till din hotellobby eller villaport - inga delade skåpbilar, inga extra stopp.\",\"tip\":\"Lägg till ditt hotellnamn eller nål i bokningsanteckningarna för smidigare avlämning.\",\"benefit1\":\"Hämtning och avlämning från dörr till dörr\",\"benefit2\":\"Perfekt för sen incheckning och tidig avresa\",\"benefit3\":\"Premium- och VIP-alternativ för speciella vistelser\",\"faq\":{\"1\":{\"q\":\"Kommer du att släppa mig i hotellets lobby?\",\"a\":\"Ja. Transfer sker från dörr till dörr till lobbyn eller villaporten. Lägg till hotellnamnet eller kartnålen i dina bokningsanteckningar.\"},\"2\":{\"q\":\"Kan jag boka en hotellhämtning sent på natten?\",\"a\":\"Ja. Privata överföringar körs för tidiga avgångar och sen incheckning - välj datum och tid när du bokar.\"},\"3\":{\"q\":\"Är detta en delad skyttel?\",\"a\":\"Nej. Varje bokning är en privat bil endast för din grupp, utan extra hotellstopp.\"},\"4\":{\"q\":\"Vilket fordon är bäst för en semesterort?\",\"a\":\"Premium sedan eller Signature Class passar par; VIP van är perfekt för familjer och extra bagage.\"},\"5\":{\"q\":\"Kan jag ändra hotellavlämningen efter bokning?\",\"a\":\"Ja, om det nya hotellet ligger i närheten. Meddela oss på LINE med ditt bokningsnummer så tidigt som möjligt.\"},\"6\":{\"q\":\"Väntar du om incheckningen är försenad?\",\"a\":\"Korta väntetider på hotellet är bra. För längre förseningar, berätta för oss på LINE så att föraren kan anpassa sig.\"}}},\"pier-transfer\":{\"title\":\"Pier Transfer\",\"subtitle\":\"Pålitliga förbindelser till färje- och motorbåtsbryggor\",\"intro\":\"Kom i tid till Phi Phi, Railay och öns avgångar med förare som kan pirens scheman.\",\"tip\":\"Boka minst 45–60 minuter innan färjeavgång från Ao Nang eller stad.\",\"benefit1\":\"Tidpunkt för båt- och färjeavgångar\",\"benefit2\":\"Hjälp med väskor till pirentrén\",\"benefit3\":\"Länkar från flygplats, hotell eller strand\",\"faq\":{\"1\":{\"q\":\"Hur tidigt ska jag anlända innan färjan?\",\"a\":\"Planera att nå piren 45–60 minuter före avgång från Ao Nang eller Krabi Town, särskilt under högsäsong.\"},\"2\":{\"q\":\"Kan chauffören hjälpa till med väskor vid bryggan?\",\"a\":\"Ja. Förare hjälper till med bagage till pirens ingång så att du lättare kan checka in till din båt.\"},\"3\":{\"q\":\"Ansluter du till Phi Phi och Railay-båtar?\",\"a\":\"Ja. Populära droppar inkluderar Ao Nang Pier och förbindelser till Phi Phi och Railay båttjänster.\"},\"4\":{\"q\":\"Var kan jag kontrollera båttider?\",\"a\":\"Se vår sida med båtscheman för exempel på tider för färjor och motorbåtar, boka sedan din transfer till bryggan för att matcha.\"},\"5\":{\"q\":\"Vad händer om min båt ställs in?\",\"a\":\"Kontakta oss direkt. Vi kan boka om transfern eller hjälpa till att justera avlämningen när båtförare ändrar tider.\"},\"6\":{\"q\":\"Kan jag boka hotell → pir → hotell samma dag?\",\"a\":\"Ja. Lägg till båda sträckorna i en bokning som flera rutter, eller boka två enkelvägstransfer med matchande tider.\"}}},\"beach-transfer\":{\"title\":\"Strandtransfer\",\"subtitle\":\"Direktturer till Ao Nang, Railay, Patong och kustområden\",\"intro\":\"Hoppa över taxibilar vid trottoarkanten — åk direkt från flygplatsen eller hotellet till stranden med ett fast privatpris.\",\"tip\":\"Railay-access kan innefatta ett kort båthopp från piren; fråga oss när du bokar.\",\"benefit1\":\"Fast privatpris, inga mätare överraskningar\",\"benefit2\":\"Avlämningsställen för stranden och resorten\",\"benefit3\":\"Familje- och gruppfordon tillgängliga\",\"faq\":{\"1\":{\"q\":\"Är priset fast till stranden?\",\"a\":\"Ja. Privat strandtransfer använder ett fast pris för ditt fordon - inga meteröverraskningar vid trottoarkanten.\"},\"2\":{\"q\":\"Hur tar jag mig till Railay Beach?\",\"a\":\"De flesta gäster åker till Railay-pirområdet och tar sedan en kort gemensam longtail. Berätta för oss när du bokar om du behöver hjälp med tidtagning av bryggan.\"},\"3\":{\"q\":\"Kan du släppa på badorter?\",\"a\":\"Ja. Vi släpper till strandhotell och överenskomna strandaccesspunkter över Ao Nang, Railay-länkar och kustområden.\"},\"4\":{\"q\":\"Vad händer om jag har barn och många väskor?\",\"a\":\"Välj SUV eller skåpbil för extra utrymme. Barnstolar kan beställas i förväg via bokningsanteckningar eller LINE.\"},\"5\":{\"q\":\"Åker du till lugnare stränder också?\",\"a\":\"Ja, där vägen tillåter. Lägg till stranden eller resortens namn i anteckningarna så bekräftar vi den bästa avlämningsplatsen.\"},\"6\":{\"q\":\"Är tur och retur till stranden billigare?\",\"a\":\"Bokningar tur och retur inkluderar en liten rabatt jämfört med två separata enkelresor. Använd priskontrollen för att jämföra.\"}}},\"city-transfer\":{\"title\":\"Stadsöverföring\",\"subtitle\":\"Bekväma turer mellan städer i södra Thailand\",\"intro\":\"Krabi Town, Trang, Surat Thani och mer — privata bilar för ärenden, hotell och dagsturer.\",\"tip\":\"För stadslopp med flera stopp, notera varje stopp i bokningskommentarerna.\",\"benefit1\":\"Point-to-point eller multi-stop på begäran\",\"benefit2\":\"Luftkonditionerad komfort för längre stadshopp\",\"benefit3\":\"Sedan till skåpbil för familjer och bagage\",\"faq\":{\"1\":{\"q\":\"Kan jag göra flera stopp i stan?\",\"a\":\"Ja, på begäran. Ange varje stopp i bokningsanteckningarna så att vi kan planera tid och citera rättvist.\"},\"2\":{\"q\":\"Täcker du Trang och Surat Thani?\",\"a\":\"Ja. Stads- och stadstransfer inkluderar Krabi Town plus utvalda städer i söder för privata punkt-till-punkt-resor.\"},\"3\":{\"q\":\"Är bilen luftkonditionerad?\",\"a\":\"Alla transferfordon är luftkonditionerade och lämpar sig för dagsvärme och längre stadshopp.\"},\"4\":{\"q\":\"Kan jag boka samma dag i staden?\",\"a\":\"Ofta ja, i mån av tillgång. Boka online så tidigt du kan, eller skicka ett meddelande till oss på LINE för brådskande resor.\"},\"5\":{\"q\":\"Kan jag ha bilen kvar i stan några timmar?\",\"a\":\"För vänte- eller timanvändning, välj timcharter eller notera väntetid när du bokar så att vi kan offerera korrekt.\"},\"6\":{\"q\":\"Hämtar du från buss- eller tågstationer?\",\"a\":\"Ja, där finns det på våra platser. Välj stationen som hämtning eller avlämning på bokningsformuläret.\"}}},\"attraction-transfer\":{\"title\":\"Attraktionsöverföring\",\"subtitle\":\"Tempel, smaragdpooler, varma källor och utsiktsplatser\",\"intro\":\"Privata överföringar till Krabis främsta sevärdheter med alternativ för att vänta och återvända för dagsutflykter.\",\"tip\":\"Be om att vänta och återvända om du vill ha samma bil för resan tillbaka.\",\"benefit1\":\"Populära park- och tempelrutter\",\"benefit2\":\"Vänta och återvända alternativ för dagsutflykter\",\"benefit3\":\"Vans för små grupper och reseutrustning\",\"faq\":{\"1\":{\"q\":\"Kan chauffören vänta medan vi hälsar på?\",\"a\":\"Ja. Be om att vänta och återvända när du bokar så att samma bil kan ta dig tillbaka efter Emerald Pool, tempel eller varma källor.\"},\"2\":{\"q\":\"Vilka sevärdheter täcker du?\",\"a\":\"Populära droppar inkluderar Emerald Pool, Tiger Cave Temple, varma källor och andra Krabi-parker och utsiktsplatser.\"},\"3\":{\"q\":\"Är en skåpbil bättre för en dag med sightseeing?\",\"a\":\"För 4+ gäster eller våta kläder efter simning är en skåpbil eller VIP-bil bekvämare än en sedan.\"},\"4\":{\"q\":\"Följer entrébiljetter med transfern?\",\"a\":\"Nej. Transferpriser täcker endast transport. Park- och tempelbiljetter betalas på plats om du inte bokar en separat rundtur.\"},\"5\":{\"q\":\"Kan vi besöka mer än en sevärdhet?\",\"a\":\"Ja. Lista ordningen på stopp i bokningsanteckningar, eller boka en charter med flera rutter/dagar för en fullständig sightseeing-slinga.\"},\"6\":{\"q\":\"Vilken tid ska vi åka för morgonsevärdheter?\",\"a\":\"För populära platser som Emerald Pool hjälper en tidig start att undvika värme och trängsel – vi kan föreslå en hämtningstid när du bokar.\"}}},\"inter-province-transfer\":{\"title\":\"Överföring mellan provinser\",\"subtitle\":\"Långdistans privata överföringar över södra Thailand\",\"intro\":\"Krabi–Phuket, Trang, Surat Thani och mer — privat SUV, skåpbil eller buss för bekväm motorvägsresa.\",\"tip\":\"Långa rutter bokas ut på helgerna – reservera tidigt för morgonavgångar.\",\"benefit1\":\"Motorvägsklara SUV-, skåpbils- och bussalternativ\",\"benefit2\":\"Fast pris för resor från provins till provins\",\"benefit3\":\"Perfekt för grupper med bagage och utrustning\",\"faq\":{\"1\":{\"q\":\"Vilket fordon är bäst för långa landsvägsresor?\",\"a\":\"SUV eller skåpbil för komfort; VIP skåpbil eller buss för större grupper och mer bagage på rutter Krabi–Phuket eller Surat.\"},\"2\":{\"q\":\"Är priset fast mellan provinserna?\",\"a\":\"Ja. Transfer mellan provinserna använder ett privat fast pris för ditt valda fordon, överenskommet innan du betalar.\"},\"3\":{\"q\":\"Hur tidigt ska jag boka weekendresor?\",\"a\":\"Helger och helgdagar fylls tidigt - reservera morgonavgångar minst en dag i förväg när du kan.\"},\"4\":{\"q\":\"Ingår vägtullar?\",\"a\":\"Angivna transferpriser inkluderar standardtullar och parkering relaterade till resan om inte annat anges vid bokningen.\"},\"5\":{\"q\":\"Ingår rastplatser på långa sträckor?\",\"a\":\"Förare kan stanna en kort stund för toaletter eller snacks på långa motorvägsresor. Nämn föredragna pauser i dina anteckningar.\"},\"6\":{\"q\":\"Kan du åka från Krabi till Phuket med hotellavlämning?\",\"a\":\"Ja. Välj ditt hotell eller flygplats i Phuket som avlämning - privat punkt till punkt, inte en delad buss.\"}}}},\"Vehicles\":{\"amenities\":{\"ac\":\"Luftkonditionering\",\"water\":\"Vatten på flaska\",\"charger\":\"Telefonladdare\",\"legroom\":\"Extra benutrymme\",\"groupSeating\":\"Gruppsittning\",\"leather\":\"Lädersäten\",\"wifi\":\"Wi-Fi\",\"snacks\":\"Snacks\",\"meetGreet\":\"Möt \u0026 hälsa\",\"luxury\":\"Lyx sedan\",\"premium\":\"Premium bekvämligheter\",\"priority\":\"Prioriterad tjänst\",\"captain\":\"Kaptensplatser\",\"privacy\":\"Sekretessglas\",\"usb\":\"USB-laddning\",\"drinks\":\"Kalla drycker\",\"groupTravel\":\"Gruppresor\",\"tourGuide\":\"Reseledare utrymme\"},\"bags\":\"{n} påsar\",\"largeCargo\":\"Stort lastutrymme\",\"pax\":\"{n} pax\",\"bags3\":\"3 påsar\",\"bags4\":\"4 påsar\",\"bags6\":\"6 påsar\",\"bags8\":\"8 påsar\",\"bags10\":\"10 påsar\",\"ECO\":{\"name\":\"Ekonomitaxi\",\"luggage\":\"3 påsar\"},\"PREM\":{\"name\":\"Lyxtaxi\",\"luggage\":\"4 påsar\"},\"SUV\":{\"name\":\"SUV-taxi\",\"luggage\":\"6 påsar\"},\"VAN\":{\"name\":\"Van Taxi\",\"luggage\":\"6 påsar\"},\"VIP\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 påsar\"},\"SIG\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 påsar\"},\"EXE\":{\"name\":\"VIP Van\",\"luggage\":\"8 påsar\"},\"BUS\":{\"name\":\"Minibuss\",\"luggage\":\"Stort lastutrymme\"}},\"Contact\":{\"title\":\"Kontakta oss\",\"subtitle\":\"Har du frågor? Vårt team är redo att hjälpa till med dina södra Thailand resplaner.\",\"sendTitle\":\"Skicka ett meddelande\",\"sendSubtitle\":\"Vi svarar vanligtvis inom 24 timmar\",\"name\":\"Namn\",\"email\":\"E-post\",\"subject\":\"Ämne\",\"message\":\"Meddelande\",\"phName\":\"Ditt namn\",\"phEmail\":\"email@example.com\",\"phSubject\":\"Hur kan vi hjälpa till?\",\"phMessage\":\"Berätta om dina resplaner...\",\"send\":\"Skicka meddelande\",\"toastOk\":\"Meddelande skickat! Vi återkommer till dig inom 24 timmar.\",\"getInTouch\":\"Hör av dig\",\"phone\":\"Telefon\",\"whatsapp\":\"WhatsApp\",\"address\":\"Adress\",\"lineTitle\":\"LINE officiell\",\"lineSubtitle\":\"Chatta med oss för snabb support\",\"facebookTitle\":\"Facebook\",\"facebookSubtitle\":\"Follow updates and message us on our page\"},\"RentalConditions\":{\"eyebrow\":\"Car rental\",\"title\":\"Booking conditions\",\"subtitle\":\"Please prepare these documents and deposits before confirming your rental.\",\"requirementsTitle\":\"Required for booking\",\"reqId\":\"National ID card or driver’s license\",\"reqFlight\":\"Round-trip flight tickets in the customer’s name\",\"reqPhone\":\"A phone number we can reach you on\",\"depositTitle\":\"Deposit conditions\",\"smallCar\":\"Small car deposit\",\"smallDeposit\":\"฿3,000\",\"largeCar\":\"Large car deposit\",\"largeDeposit\":\"฿5,000\",\"stepConfirm\":\"When the car is confirmed, pay a {amount} advance deposit first.\",\"stepContract\":\"Pay the rental fee and remaining deposit on the contract signing day.\",\"stepRefund\":\"The security deposit is refunded after you return the car a "Planera överföringen härnäst\",\"moreGuides\":\"Fler guider\",\"boatType\":\"Båttyp\",\"allBoats\":\"Alla båtar\",\"ferry\":\"Färja\",\"speedboat\":\"Motorbåt\",\"longtail\":\"Långsvans\",\"route\":\"Rutt\",\"allRoutes\":\"Alla rutter\",\"departures\":\"Avgångar\",\"duration\":\"Varaktighet\",\"transferTo\":\"Överför till {pier}\",\"landTransfer\":\"Marköverföring till piren\",\"emptyBoats\":\"Inga scheman matchar dina filter.\",\"mockBanner\":\"Mock båtscheman för planering - tiderna kan skilja sig åt i verkligheten.\",\"ctaArticlesBody\":\"Kolla priser live och boka en privat bil med omedelbar e-voucher.\",\"bookRouteBody\":\"Få ett omedelbart pris och e-kupong med QR-kod.\",\"relatedBoats\":\"Relaterade båtrutter\",\"landTransferBody\":\"Vi säljer inga färjebiljetter – vi tar dig till avgångsplatsen i tid.\",\"tourCtaTitle\":\"Boka transfer till brygga eller hotell\",\"tourCtaBody\":\"Turbiljetter säljs av lokala operatörer. Vi tar dig till mötesbryggan i tid med en e-voucher.\",\"toursCtaBody\":\"Turpriserna är operatörsuppskattningar (låtsas). Vi hanterar transfer från hotell till brygga med en omedelbar e-voucher.\",\"travelCtaBody\":\"Kontrollera båttiderna och boka sedan en privat transfer till piren eller hotellet.\"},\"Articles\":{\"categories\":{\"Airport\":\"Flygplats\",\"Beach\":\"Strand\",\"Pier\":\"Pier\",\"Inter Province\":\"Interprovinsen\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"Krabi Airport Transfer Guide: Smidig ankomst till KBV\",\"excerpt\":\"Vad du kan förvänta dig efter landning på Krabis internationella flygplats, hur meet \u0026 greet fungerar och hur du bokar en privat transfer med en e-voucher.\",\"p1\":\"Att landa på Krabi International Airport (KBV) är början på din resa till södra Thailand. En privat flygplatstransfer hjälper dig att hoppa över taxiköer och gå direkt till ditt hotell, stranden eller piren.\",\"p2\":\"Med Krabi Links Taxi spårar din chaufför flyget och inkluderar gratis väntetid för hämtning på flygplatsen. Du får en e-voucher med en QR-kod direkt efter bokning — visa den vid mötesplatsen.\",\"p3\":\"Populära rutter från KBV inkluderar Ao Nang Beach, Railay, Centara Grand och Krabi Town. Välj Economy Sedan för par eller en skåpbil om du reser med familj och bagage.\",\"p4\":\"Tips: Dela ditt flightnummer och hotellnamn när du bokar så att föraren kan förbereda en namnskylt och planera den bästa rutten runt kvällstrafiken.\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"Ao Nang \u0026 Railay Beach Transfer Tips\",\"excerpt\":\"Hur man flyttar mellan Ao Nang, Railay och närliggande orter med privata bilar, bryggor och rätt fordon för strandväskor.\",\"p1\":\"Ao Nang är navet för många strandvistelser i Krabi, medan Railay nås via korta bryggförbindelser. Att planera din överföring i förväg gör dagen enkel.\",\"p2\":\"Från flygplatsen eller Krabi Town, boka en privat avresa till Ao Nang Beach eller ditt hotell. För Railay kan vi ta dig till piren och hjälpa dig att tajma din båtförbindelse.\",\"p3\":\"Om du bär snorkelutrustning eller stora väskor ger en SUV eller Standard Van mer utrymme än en sedan. Bokningar tur och retur sparar också tid på kassan.\",\"p4\":\"Kvällsreturer från stranden kan bli upptagna - boka din hämtningstid tidigt, särskilt på helger och allmänna helgdagar.\"},\"pier-transfer-to-phi-phi\":{\"title\":\"Pier Transfer till Phi Phi: Vad resenärer bör veta\",\"excerpt\":\"En praktisk checklista för transfer från hotell till brygga, färjetider och bagagetips innan du beger dig till Phi Phi.\",\"p1\":\"Ödagar börjar på land. En pålitlig pirtransfer från ditt hotell eller flygplatsen innebär att du når Ao Nang Pier eller andra avgångspunkter utan att rusa.\",\"p2\":\"Bygg in bufferttid för incheckning och ombordstigning. Vi rekommenderar att du anländer till bryggan minst 45–60 minuter före färjans avgång under högsäsong.\",\"p3\":\"Privata skåpbilar är idealiska för grupper som delar samma färja. Familjer kan begära barnstolar gratis vid bokning.\",\"p4\":\"Efter din öresa, boka en hämtning på bryggan så att en förare är redo när båten lägger till - särskilt användbart om du anländer efter mörkrets inbrott.\"},\"krabi-to-phuket-inter-province\":{\"title\":\"Transfer från Krabi till Phuket mellan provinserna\",\"excerpt\":\"Jämför komfort och timing för Krabi–Phuket-korridoren, fordonsalternativ och när en privat transfer slår delade skåpbilar.\",\"p1\":\"Rutten Krabi–Phuket är en av de mest efterfrågade överföringarna mellan provinserna i södra Thailand. Privata bilar ger dörr-till-dörr timing utan flera stopp.\",\"p2\":\"Typiska resor förbinder KBV eller Krabi Town med Phukets flygplats eller Patong. Restiden beror på trafiken och om du startar från flygplatsen eller staden.\",\"p3\":\"För längre turer erbjuder VIP-van eller minibussalternativ mer utrymme och komfort. Priserna är allt inklusive vägtullar och parkering om du inte lägger till väntetid.\",\"p4\":\"Boka tur och retur om du flyger till en provins och ut från den andra — en reservation täcker båda sträckorna med ett enda e-voucherflöde.\"}}},\"Admin\":{\"loading\":\"Laddar...\",\"loginTitle\":\"Admin logga in\",\"loginHint\":\"Demo: {user} / {pass}\",\"username\":\"Användarnamn\",\"password\":\"Lösenord\",\"signIn\":\"Logga in\",\"loginError\":\"Ogiltigt användarnamn eller lösenord\",\"logout\":\"Logga ut\",\"backToSite\":\"Tillbaka till hemsidan\",\"panelTitle\":\"Verksamhet\",\"opsLabel\":\"Back office · Demo\",\"nav\":{\"dashboard\":\"Instrumentbräda\",\"bookings\":\"Bokningar\",\"payments\":\"Betalningar\",\"schedule\":\"Schema\",\"drivers\":\"Förare\",\"customers\":\"Kunder\",\"prices\":\"Pristabeller\",\"vehicles\":\"Fordon\",\"settings\":\"Inställningar\"},\"dashboardTitle\":\"Instrumentbräda\",\"dashboardSubtitle\":\"Liveöversikt över överföringar, betalningar och förare.\",\"resetDemo\":\"Återställ demodata\",\"statOpen\":\"Öppna jobb\",\"statPayReview\":\"Betalningsgranskning\",\"statToday\":\"Dagens resor\",\"statAssigned\":\"Assigne Snorkel\":\"Snorkla\",\"Kayak\":\"Kajak\",\"Sightseeing\":\"Sightseeing\",\"Combo\":\"Combo\"},\"items\":{\"phi-phi-islands-day-trip\":{\"title\":\"Phi Phi Islands dagstur\",\"excerpt\":\"Klassisk Andaman-dagstur med utsiktspunkten Maya Bay, snorkelstopp och lunch på stranden.\",\"duration\":\"Hel dag (~8–9 timmar)\",\"fromArea\":\"Ao Nang / Krabi\",\"toArea\":\"Phi Phi-öarna\",\"highlights\":{\"1\":\"Maya Bay viewpoint (under förutsättning av parkregler)\",\"2\":\"Snorkla vid tydliga rev\",\"3\":\"Strandlunch på Phi Phi Don eller närliggande bukt\",\"4\":\"Stöd för hämtning av hotell eller brygga\"},\"includes\":{\"1\":\"Motorbåt eller färja (beroende av operatör)\",\"2\":\"Nationalparksavgifter (där de ingår av operatören)\",\"3\":\"Lunch \u0026 dricksvatten\",\"4\":\"Flytväst och snorkelutrustning\"},\"content\":{\"1\":\"Phi Phi är fortfarande en av de mest efterfrågade dagsturer från Krabi. De flesta paket avgår tidigt från Ao Nang eller närliggande bryggor och kommer tillbaka sent på eftermiddagen.\",\"2\":\"Vi rekommenderar att du bokar en privat bryggtransfer så du kommer med bufferttid innan incheckning. Kvällsretur kan vara upptagna - reservera din hämtningsplats när du bokar turnén.\",\"3\":\"Turpriserna som visas är från typiska lokala operatörer (skenbara guidepriser). Bekräfta inkludering, båttyp och Maya Bay-åtkomstregler för ditt resedatum.\"}},\"four-islands-tour\":{\"title\":\"4 Islands Tour (Kyckling, Tup, Poda \u0026 Railay)\",\"excerpt\":\"Kort öhoppning nära Ao Nang – grunda rev, ikoniska klippor och mjuka sandstränder.\",\"duration\":\"Halv/hel dag\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Kyckling · Tup · Poda · Railay\",\"highlights\":{\"1\":\"Chicken Island utsiktspunkt och snorkel\",\"2\":\"Tup Island sandbank (tidvattenberoende)\",\"3\":\"Poda Beach badstopp\",\"4\":\"Valfritt Railay-släpp eller besök\"},\"includes\":{\"1\":\"Longtail eller motorbåt\",\"2\":\"Snorkelmask \u0026 flytväst\",\"3\":\"Frukt/läsk (operatörsberoende)\",\"4\":\"Guide ombord\"},\"content\":{\"1\":\"Rutten 4 öar är idealisk om du vill ha landskap nära Ao Nang utan en lång överfart till Phi Phi.\",\"2\":\"Tidvattnet påverkar sandfångarnas sikt på Tup Island — morgonavgångar ger vanligtvis de bästa förutsättningarna.\",\"3\":\"Para ihop denna turné med en transfer från hotell till brygga så att du inte litar på sista minuten songthaews under högsäsong.\"}},\"hong-island-lagoon\":{\"title\":\"Hong Island Lagoon Trip\",\"excerpt\":\"Lugna laguner, kajakpaddlingsmöjligheter och pudersandstränder i nationalparken Than Bok Khorani.\",\"duration\":\"Hel dag\",\"fromArea\":\"Ao Nang / Nopparat Thara\",\"toArea\":\"Hong Island\",\"highlights\":{\"1\":\"Utsikt över smaragdlagunen\",\"2\":\"Kajak genom kalkstenskanaler\",\"3\":\"Lugn strandtid\",\"4\":\"Nationalparks landskap\"},\"includes\":{\"1\":\"Båttransfer till Hong Island\",\"2\":\"Kajak (delad eller privat – operatörsberoende)\",\"3\":\"Nationalparksavgift (ofta ingår)\",\"4\":\"Lunch på några paket\"},\"content\":{\"1\":\"Hong Island är populärt bland resenärer som föredrar laguner och kajakpaddling framför långväga motorbåtsdagar.\",\"2\":\"Avgångar är ofta från Nopparat Thara / Ao Nang sida. Tillåt extra tid om ditt hotell ligger i inlandet eller i Krabi.\",\"3\":\"Fråga din operatör om regler för parköppning och om kajaker ingår eller hyrs på plats.\"}},\"james-bond-island-phang-nga\":{\"title\":\"James Bond Island · Phang Nga Bay\",\"excerpt\":\"Ikoniska kalkstenskarst, kanotpaddling i grottor och den berömda klippnålen Koh Tapu.\",\"duration\":\"Hel dag\",\"fromArea\":\"Krabi / Phuket sida\",\"toArea\":\"Phang Nga Bay\",\"highlights\":{\"1\":\"Koh Tapu (James Bond Island)\",\"2\":\"Paddla genom mangrovegrottor\",\"3\":\"Muslimsk fiskebystopp (operatörsberoende)\",\"4\":\"Naturskön buktkryssning\"},\"includes\":{\"1\":\"Båt- och kanotsegment\",\"2\":\"Guide\",\"3\":\"Lunch\",\"4\":\"Nationalparksavgifter (paketberoende)\"},\"content\":{\"1\":\"James Bond Island-turer kan starta från Krabi eller Phuket. Restiden på land kan vara längre än själva båtsegmentet.\",\"2\":\"En privat transfer mellan ditt hotell och mötesbryggan håller dagen enligt schemat - speciellt för tidiga hotellhämtningar.\",\"3\":\"Priserna varierar kraftigt beroende på kanotkvalitet och gruppstorlek; använd vårt från-pris endast som en planeringsguide.\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"Emerald Pool \u0026 Hot Spring Combo\",\"excerpt\":\"Landbaserad naturdag — smaragddjungelpooler och varma mineralkällor nära Krabi Town.\",\"duration\":\"Halv dag\",\"fromArea\":\"Krabi Town / Ao Nang\",\"toArea\":\"Emerald Pool · Varm källa\",\"highlights\":{\"1\":\"Simma vid Emerald Pool\",\"2\":\"Koppla av vid naturliga varma källor\",\"3\":\"Blue Pool utsiktspunkt alternativ\",\"4\":\"Lätt halvdag för familjer\"},\"includes\":{\"1\":\"Inträdesavgifter (paketberoende)\",\"2\":\"Guide på vissa paket\",\"3\":\"Dricksvatten\"},\"content\":{\"1\":\"Den här kombinationen är perfekt när havet är grovt eller om du vill ha en landdag mellan öresorna.\",\"2\":\"Boka en attraktionstransfer för timing från dörr till dörr utan delade skåpbilsförseningar.\",\"3\":\"Ta med vattenskor — stigar kan vara hala efter regn.\"}},\"railay-sunset-longtail\":{\"title\":\"Railay Sunset av Longtail\",\"excerpt\":\"Kort brygghopp till Railay för utsiktspunkter, klättring av klippor och gyllene timmars foton.\",\"duration\":\"3–5 timmar/kväll\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Railay Beach\",\"highlights\":{\"1\":\"Longtail till Railay West / East\",\"2\":\"Phra Nang Cave Beach promenad\",\"3\":\"Solnedgång på Railay West\",\"4\":\"Valfri middag på stranden\"},\"includes\":{\"1\":\"Longtail tur och retur (delad eller privat)\",\"2\":\"Flytväst\"},\"content\":{\"1\":\"Railay ligger bara en kort båttur från Ao Nang men känns som en annan destination.\",\"2\":\"Kontrollera tiderna för returbåtar om du stannar för solnedgången – privata longtails är flexibla när allmänna båtar saktar ner.\",\"3\":\"Vi kan släppa dig vid Ao Nang Pier och vänta på din återhämtning på begäran.\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"Destination\",\"Island\":\"Ö\",\"Corridor\":\"Korridor\",\"Practical\":\"Praktiskt\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"Ao Nang som din Krabi-bas\",\"excerpt\":\"Var man ska bo, hur man når piren och hur man länkar stränder, Railay och dagsutflykter.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Bo nära strandvägen för enkel longtail-tillgång till Railay.\",\"2\":\"Boka transfer till bryggan kvällen innan hektiska färjemorgnar.\",\"3\":\"Kvällstrafiken mellan Krabi stad och Ao Nang kan lägga till 15–25 minuter.\"},\"content\":{\"1\":\"Ao Nang är den mest praktiska basen för förstagångsbesökare: restauranger, resediskar och tillgång till båt ligger nära varandra.\",\"2\":\"Använd privata överföringar från Krabis flygplats (KBV) om du anländer med bagage eller efter mörkrets inbrott - taxerade taxibilar och delade skåpbilar varierar i väntetid.\",\"3\":\"Från Ao Nang kan du nå Railay på cirka 15 minuter med longtail, gå med på 4 Islands-resor eller ansluta till Phi Phi motorbåtar.\",\"4\":\"Om ditt hotell ligger uppför eller inåt land, lägg till bufferttid för varje piravgång.\"}},\"railay-access-tips\":{\"title\":\"Att ta sig till Railay Beach utan stress\",\"excerpt\":\"Båtalternativ, bagagetips och när man ska boka en privat longtail kontra delade båtar.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Stora resväskor är lättare på privata longtails.\",\"2\":\"Railay East kan vara lerigt vid lågvatten — väster är bättre för solnedgången.\",\"3\":\"Bekräfta båtplaner för tur och retur före middagen.\"},\"content\":{\"1\":\"Railay har ingen vägtillfart. Nästan alla anländer med båt från Ao Nang eller med längre rutter från Krabi Town.\",\"2\":\"Delade longtails är billiga och vanliga på dagen. Privata båtar kostar mer men hjälper till med tidtagning, barn och skrymmande väskor.\",\"3\":\"Klättring, kajakpaddling och Phra Nang Cave Beach är gångbara när du anländer - planera skor för steniga stigar.\",\"4\":\"Vi kan överföra ditt hotell → Ao Nang Pier och ordna en tidsinställd returhämtning efter solnedgången.\"}},\"phi-phi-arrival-checklist\":{\"title\":\"Phi Phi ankomstchecklista\",\"excerpt\":\"Färja vs motorbåt, tidpunkt för piren och hur man ansluter hotelltransfer före och efter överfarten.\",\"region\":\"Phi Phi / Krabi\",\"tips\":{\"1\":\"Anlända till piren 45–60 minuter tidigt under högsäsong.\",\"2\":\"Motorbåtar är snabbare; färjor är oftast smidigare och billigare.\",\"3\":\"Förboka landöverföringen så att du inte rusar med bagage.\"},\"content\":{\"1\":\"Ödagar börjar på land. En pålitlig transfer från hotell till brygga är lika viktig som själva båtbiljetten.\",\"2\":\"Väder- och parkregler kan ändra tillträdet till Maya Bay – kolla med din operatör dagen innan.\",\"3\":\"På återkomstkvällar slår privata pirhämtningar i väntan på delade skåpbilar, särskilt med blöta väskor och trötta barn.\",\"4\":\"Om du flyger från Phuket eller Krabi nästa morgon, lämna bufferttid för färjeförseningar.\"}},\"krabi-phuket-corridor\":{\"title\":\"Krabi–Phuket-korridoren: Transfertips\",\"excerpt\":\"När en privat bil slår delade skåpbilar på den mest trafikerade vägen mellan provinserna i söder.\",\"region\":\"Krabi · Phuket\",\"tips\":{\"1\":\"Privatbilar från dörr till dörr hoppar över flera hotellstopp.\",\"2\":\"Flygplats-flygtransfer kräver flygspårning och väntetid.\",\"3\":\"Vägtull och parkering ingår vanligtvis i privata offerter.\"},\"content\":{\"1\":\"Krabi ↔ Phuket är den mest efterfrågade korridoren mellan provinserna för flygförbindelser och resor med flera vistelser.\",\"2\":\"Delade skåpbilar är billigare men lägger till tid med stopp. Privata stadsjeepar eller skåpbilar passar familjer och snäva flygtider.\",\"3\":\"Typiska ben förbinder KBV eller Krabi med Phukets flygplats, Patong eller hotell på västkusten.\",\"4\":\"Boka tur och retur om du flyger till en provins och ut från den andra — en e-voucher täcker båda benen.\"}}}},\"Boats\":{\"items\":{\"ao-nang-railay-longtail\":{\"routeLabel\":\"Ao Nang Pier → Railay Beach\",\"operator\":\"Lokal longtail (delad)\",\"notes\":\"Frekvent delade longtails; privat charter tillgänglig. Kvällsbåtar tunnas ut efter solnedgången.\"},\"railay-ao-nang-longtail\":{\"routeLabel\":\"Railay Beach → Ao Nang Pier\",\"operator\":\"Lokal longtail (delad)\",\"notes\":\"Returbåtar från Railay West / East beroende på tidvatten och bagage.\"},\"ao-nang-phi-phi-speedboat\":{\"routeLabel\":\"Ao Nang / Tonsai → Phi Phi\",\"operator\":\"Motorbåtsoperatörer (mock)\",\"notes\":\"Exakt pir (Ao Nang vs Tonsai) beror på operatören. Anlända 30–45 minuter tidigt under högsäsong.\"},\"phi-phi-ao-nang-speedboat\":{\"routeLabel\":\"Phi Phi → Ao Nang / Tonsai\",\"operator\":\"Motorbåtsoperatörer (mock)\",\"notes\":\"Boka hämtning på bryggan i förväg om du anländer efter mörkrets inbrott.\"},\"ao-nang-phi-phi-ferry\":{\"routeLabel\":\"Ao Nang-området → Phi Phi (färja)\",\"operator\":\"Färja / kombinerad transfer (mock)\",\"notes\":\"Långsammare och oftast billigare än motorbåt. Kan inkludera skåpbil till en större färjebrygga.\"},\"krabi-lanta-ferry\":{\"routeLabel\":\"Krabi → Koh Lanta\",\"operator\":\"Kombination av färja + skåpbil (mock)\",\"notes\":\"Många paket använder Krabi Town eller närliggande bryggor; bekräfta mötesplatsen. Varaktighet inkluderar väg + hav.\"},\"phi-phi-phuket-ferry\":{\"routeLabel\":\"Phi Phi → Phuket\",\"operator\":\"Färjeoperatörer (håna)\",\"notes\":\"Anslut till Phukets flygplats eller Patong privat transfer efter ankomst.\"},\"railay-hong-island-speedboat\":{\"routeLabel\":\"Ao Nang → Hong Island\",\"operator\":\"Motorbåt för en dagstur (mock)\",\"notes\":\"Säljs vanligtvis som ett tur- och returpaket istället för enkelbiljett.\"}}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":[\"$L14\",\"$L15\",\"$L16\"]}]\n"])</script><script>self.__next_f.push([1,"17:I[46615,[\"/nx/static/chunk
