stPaymentPlan\":\"Please choose a payment plan\",\"routePreviewOfficial\":\"Official tariff\",\"routePreviewOnRequest\":\"On request\"},\"Pages\":{\"fleet\":\"A mi flottánk\",\"priceList\":\"Árlista\",\"faq\":\"GYIK\",\"reviews\":\"Vásárlói vélemények\",\"contact\":\"Lépjen kapcsolatba velünk\",\"articles\":\"Utazási cikkek\",\"tours\":\"Túrák\",\"boatSchedules\":\"Hajó menetrendek\",\"travelInfo\":\"Utazási információk\",\"fleetSubtitle\":\"8 járműosztály valódi fotókkal és teljes specifikációkkal\",\"priceListSubtitle\":\"Átlátható árak a transzfereknél és a napi bérleteknél\",\"reviewsSubtitle\":\"Valódi visszajelzések az utazóktól Dél-Thaiföldön\",\"contactSubtitle\":\"Kérdései vannak? Csapatunk készen áll, hogy segítsen a dél-thaiföldi utazási terveiben.\",\"articlesSubtitle\":\"Útmutatók repülőtéri, tengerparti, kikötői és tartományok közötti transzferekhez\",\"toursSubtitle\":\"Napos kirándulások és szigeti élmények Krabi környékén\",\"boatSchedulesSubtitle\":\"A kompok és motorcsónakok indulási időpontjainak álca\",\"travelInfoSubtitle\":\"Gyakorlati tippek a népszerű dél-thaiföldi úti célokhoz\"},\"Site\":{\"slogan\":\"Az Ön megbízható dél-thaiföldi transzferhálózata\",\"tagline\":\"Dél-Thaiföld Utazási és Közlekedési Platform\"},\"Faq\":{\"pageTitle\":\"GYIK és irányelvek\",\"pageSubtitle\":\"Minden, amit tudnia kell a foglalásról, fizetésről és szolgáltatási szabványainkról.\",\"sectionTitle\":\"Gyakran Ismételt Kérdések\",\"policiesTitle\":\"Szolgáltatási szabályzatok\",\"items\":{\"1\":{\"q\":\"Hogyan foglalhatok transzfert?\",\"a\":\"Válassza ki az átvételi és leadási helyeket, válassza ki járművét, dátumát és időpontját, majd töltse ki a foglalási űrlapot. Azonnal kap egy e-utalványt QR kóddal.\"},\"2\":{\"q\":\"Foglalhatok több útvonalat egy foglalás során?\",\"a\":\"Igen. Foglalási rendszerünk támogatja az egyirányú, oda-vissza, többútvonalas, többnapos és charter foglalásokat – mindezt egyetlen foglalásban.\"},\"3\":{\"q\":\"Mi van, ha késik a járatom?\",\"a\":\"Figyeljük a járatok menetrendjét. A repülőtéri átvételhez 60 perc ingyenes várakozási időt adunk a tényleges leszállási időhöz képest.\"},\"4\":{\"q\":\"Milyen fizetési módokat fogad el?\",\"a\":\"Az online foglalás során elfogadunk banki átutalást, hitel-/betéti kártyákat és PromptPay-t (a demó hamis fizetési adatokat használ). Előzetes egyeztetés esetén készpénzben (THB) is fizethet a sofőrnek.\"},\"5\":{\"q\":\"Mi a lemondási szabályzata?\",\"a\":\"Ingyenes lemondás az átvétel előtt 24 órával. A 24 órán belüli lemondás 50%-os felárat vonhat maga után. A meg nem jelenés vissza nem térítendő.\"},\"6\":{\"q\":\"Biztosítasz gyereküléseket?\",\"a\":\"Igen, kérésre és felár nélkül gyerekülések is rendelkezésre állnak. Kérjük, foglaláskor adja meg a gyermekek életkorát/súlyát.\"},\"7\":{\"q\":\"Az árak mindent tartalmaznak?\",\"a\":\"Igen. A feltüntetett árak tartalmazzák az útdíjat, a parkolást, az üzemanyagot és a sofőrszolgálatot. Extra költségek csak a túlórákra vagy az Ön által kért opcionális kiegészítőkre vonatkoznak.\"},\"8\":{\"q\":\"Hogyan kaphatom meg az e-utalványomat?\",\"a\":\"Foglalásod megerősítése után azonnal megjelenik egy QR-kóddal ellátott e-utalvány, amely bármikor újranyitható a foglalási oldalon. Átvételkor mutasd meg a sofőrnek.\"},\"9\":{\"q\":\"What documents and deposit are needed for car rental?\",\"a\":\"Please prepare an ID card or driver’s license, round-trip flight tickets in your name, and a reachable phone number. Security deposit is ฿3,000 for small cars and ฿5,000 for large cars. Pay ฿500 in advance when the car is confirmed; pay the rental fee and remaining deposit on contract day. The deposit is refunded after return and inspection. Free Krabi Airport pickup and drop-off is included.\"}},\"policies\":{\"waiting\":{\"title\":\"Várakozási idő\",\"content\":\"A reptéri transzfer 60 perc ingyenes várakozást tartalmaz. A hotel/móló átvétele 15 perc ingyenes várakozást tartalmaz. A további várakozásért 30 percenként 200 THB díjat kell fizetni.\"},\"flight-delay\":{\"title\":\"Repülési késés\",\"content\":\"Nyomon követjük járatszámát, és automatikusan beállítjuk az átvétel idejét. 2 órás késés esetén nincs külön díj.\"},\"child-seat\":{\"title\":\"Gyermekülés\",\"content\":\"Csecsemő-, kisgyermek- és ülésmagasító ingyenesen elérhető. Érdeklődni a foglalás során.\"},\"pets\":{\"title\":\"Háziállatok\",\"content\":\"SUV és kisteherautó kategóriában fogadják a kisállatokat a hordozókban. További 300 THB takarítási díj kerülhet felszámításra.\"},\"ferry\":{\"title\":\"Kompkapcsolatok\",\"content\":\"A mólón közlekedő transzferek magukban foglalják a kompkikötőnél történő leszállást. Kiegészítő szolgáltatásként kompjegyek is igényelhetők.\"},\"toll\":{\"title\":\"Útdíj és parkolás\",\"content\":\"A feltüntetett ár minden útdíjat és parkolási díjat tartalmaz a repülőtereken/mólókon.\"},\"payment\":{\"title\":\"Fizetés\",\"content\":\"Fizessen online kártyával/átutalással vagy készpénzzel a sofőrnek THB-ban. Az árak mindent tartalmaznak, hacsak nincs másképp jelezve.\"},\"cancellation\":{\"title\":\"Lemondás\",\"content\":\"Ingyenes lemondás 24+ órával az átvétel előtt. 24 órán belül: 50%-os töltés. Meg nem jelenés: nincs visszatérítés.\"},\"refund\":{\"title\":\"Visszatérítés\",\"content\":\"A jóváhagyott visszatérítések feldolgozása 5–7 munkanapon belül megtörténik az eredeti fizetési mód szerint.\"},\"rental-deposit\":{\"title\":\"Car rental deposit\",\"content\":\"Small cars: ฿3,000 deposit. Large cars: ฿5,000 deposit. After confirmation, pay ฿500 advance deposit first. Pay rental fee and remaining deposit on contract day. Deposit is refunded after car return and inspection. Free Krabi Airport pickup \u0026 drop-off.\"}}},\"Reviews\":{\"pageTitle\":\"Vásárlói vélemények\",\"pageSubtitle\":\"Valódi visszajelzések az utazóktól Dél-Thaiföldön.\",\"items\":{\"1\":{\"country\":\"Egyesült Királyság\",\"comment\":\"Sima transzfer a Krabi repülőtérről Ao Nangba. A sofőr táblával várta, az autó tiszta és kényelmes volt.\",\"route\":\"KBV repülőtér → Ao Nang Beach\"},\"2\":{\"country\":\"Németország\",\"comment\":\"Lefoglalt oda-vissza útra a Railay Beachre. Kiváló kommunikáció és pontos kiszolgálás mindkét irányban.\",\"route\":\"KBV repülőtér ↔ Railay Beach\"},\"3\":{\"country\":\"Japán\",\"comment\":\"A 6 tagú családunk VIP furgonja tökéletes volt. A gyerekek imádták a hideg törölközőket és a rágcsálnivalókat!\",\"route\":\"KBV Repülőtér → Centara Grand\"},\"4\":{\"country\":\"Olaszország\",\"comment\":\"Jó ár-érték arányú tartományok közötti transzfer Phuketbe. Kissé késésben volt a forgalom, de a sofőr tájékoztatott minket.\",\"route\":\"Krabi → Phuket repülőtér\"},\"5\":{\"country\":\"Ausztrália\",\"comment\":\"A szállodai átvétel a mólóhoz a helyszínen zajlott. A sofőr segített a táskákkal és mindent időzített a Phi Phi kompunkhoz.\",\"route\":\"Ao Nang Hotel → Ao Nang móló\"},\"6\":{\"country\":\"Franciaország\",\"comment\":\"Lefoglalt egy tengerparti transzfert Railaybe a mólón keresztül. Világos frissítések a LINE-ról és tiszta kisteherautó csomagjaink számára.\",\"route\":\"Krabi város → Railay móló\"},\"7\":{\"country\":\"Thaiföld\",\"comment\":\"Több napos Krabi körüli kirándulásokhoz használta őket. Egyszerű foglalás, korrekt ár és a sofőrök mindig időben.\",\"route\":\"Napi charta · Krabi\"}}},\"Transfer\":{\"fromEco\":\"Economy Sedan tól\",\"book\":\"Könyv\",\"bookRoute\":\"Foglalja le ezt az útvonalat\",\"popularRoutes\":\"Népszerű útvonalak\",\"popularRoutesHint\":\"Minta viteldíjak az Economy Sedan számára. A végső ár a járműtől és a dátumtól függ.\",\"route\":\"Útvonal\",\"distance\":\"Távolság\",\"duration\":\"Időtartam\",\"fromPrice\":\"(ECO)\",\"recommended\":\"Ajánlott járművek\",\"recommendedBody\":\"Válasszon egy járművet, amely megfelel a csoport méretének és csomagjainak.\",\"ctaTitle\":\"Készen áll a foglalásra {title}?\",\"ctaBody\":\"Foglalás után azonnali e-utalványt kaphat QR-kóddal.\",\"howTitle\":\"Hogyan működik a foglalás\",\"howSubtitle\":\"Három egyszerű lépés az árajánlattól az átvételig.\",\"step1Title\":\"Válassza ki az útvonalat\",\"step1Body\":\"Válassza ki az átvételt, a leadást, a dátumot és a járművet.\",\"step2Title\":\"Megerősítés és fizetés\",\"step2Body\":\"Fizessen biztonságosan, és kapja meg QR-kóddal ellátott e-utalványát.\",\"step3Title\":\"Találkozzon a sofőrrel\",\"step3Body\":\"A sofőr adatai az átvétel előtt megérkeznek. Pihenjen és lovagoljon.\",\"includedTitle\":\"ami benne van\",\"otherServices\":\"Egyéb transzferszolgáltatások\",\"viewPrices\":\"Árlista megtekintése\",\"startBooking\":\"Kezdje el a foglalást\",\"km\":\"{n} km\",\"approxMin\":\"~{n} min\",\"tipLabel\":\"Jó tudni\",\"categories\":{\"airport\":\"Repülőtér\",\"hotel\":\"Szálloda\",\"pier\":\"Pier\",\"beach\":\"Beach\",\"city\":\"Város\",\"attraction\":\"Attrakció\",\"inter-province\":\"Inter tartomány\"},\"faqTitle\":\"GYIK ehhez a szolgáltatáshoz\",\"faqSubtitle\":\"Gyors válaszok foglalás előtt.\",\"reviewsTitle\":\"Amit az utazók mondanak\",\"allReviews\":\"Minden értékelés\",\"allFaq\":\"Összes GYIK\",\"includedBadge\":\"Beleértve\"},\"TransferPages\":{\"airport-transfer\":{\"title\":\"Reptéri transzfer\",\"subtitle\":\"Privát transzferek Krabi és Dél-Thaiföld repülőtereire és vissza\",\"intro\":\"Repülési időzített pickupok találkozási és üdvözlési lehetőségekkel, csomagtérrel és közvetlen járatokkal szállodákhoz, strandokhoz és mólókhoz.\",\"tip\":\"Foglaláskor ossza meg járatszámát. Krabi repülőtér találkozási pontjai: belföldi 15-ös, nemzetközi 16-os ajtó – kilépés után nézzen balra.\",\"benefit1\":\"Repülésfigyelés és rugalmas várakozási idő\",\"benefit2\":\"Kérésre találkozás és köszöntés érkezéskor\",\"benefit3\":\"Hely a bőröndök számára – szedántól furgonig\",\"faq\":{\"1\":{\"q\":\"Mi van, ha késik a járatom?\",\"a\":\"Figyeljük a járatok reptéri felvételeit, és körülbelül 60 perc ingyenes várakozási időt biztosítunk a tényleges leszállási időtől számítva.\"},\"2\":{\"q\":\"Kínálsz találkozást és üdvözlést?\",\"a\":\"Igen. Foglaláskor adja meg járatszámát. A Krabi repülőtéren a belföldi érkezők kilépnek a 15-ös ajtón, a nemzetköziek pedig a 16-os ajtón, majd balra néznek – a sofőr az Ön nevével egy táblán vár.\"},\"3\":{\"q\":\"Mennyi poggyászt vihetek?\",\"a\":\"A gazdaságos szedánokba körülbelül 3 közepes táska fér el. Ha több poggyászt vagy egy családot szeretne, válassza ki a SUV-t, furgont vagy VIP furgont a foglalási űrlapon.\"},\"4\":{\"q\":\"A phuketi reptéren is fel lehet venni?\",\"a\":\"Igen. Krabi (KBV) és egyes dél-thaiföldi repülőterekre, köztük Phuketre is kiterjedünk, privát pont-pont viteldíjakkal.\"},\"5\":{\"q\":\"Hogyan fizethetek a reptéri transzferért?\",\"a\":\"Fizessen online banki átutalással, kártyával vagy PromptPay-vel foglaláskor. Szükség esetén készpénzben a sofőrnek előre egyeztethető.\"},\"6\":{\"q\":\"Mikor kapom meg a sofőr adatait?\",\"a\":\"A sofőr nevét, telefonszámát és autóadatait az átvétel előtt osztják meg – általában az átszállási időtől számított 24 órán belül.\"}}},\"hotel-transfer\":{\"title\":\"Szállodai transzfer\",\"subtitle\":\"Háztól-házig utak az üdülőhelyek, szállodák és Krabi legfontosabb helyei között\",\"intro\":\"Személygépkocsi a szálloda halljához vagy a villa kapujához – nincs közös furgon, nincs extra megálló.\",\"tip\":\"Adja hozzá szállodája nevét vagy PIN-kódját a foglalási megjegyzésekben a gördülékenyebb leszállás érdekében.\",\"benefit1\":\"Háztól házig átvétel és kiszállítás\",\"benefit2\":\"Ideális késői bejelentkezéshez és korai távozáshoz\",\"benefit3\":\"Prémium és VIP lehetőségek különleges tartózkodásokhoz\",\"faq\":{\"1\":{\"q\":\"Bedobnál a szálloda halljába?\",\"a\":\"Igen. A transzferek háztól házig közlekednek a hallba vagy a villa kapujába. Adja hozzá a szálloda nevét vagy a térképtűt a foglalási megjegyzésekhez.\"},\"2\":{\"q\":\"Foglalhatok késő esti szállodai átvételt?\",\"a\":\"Igen. Korai indulás és késői bejelentkezés esetén privát transzferek állnak rendelkezésre – foglaláskor válassza ki a dátumot és az időt.\"},\"3\":{\"q\":\"Ez egy közös transzfer?\",\"a\":\"Nem. Minden foglalás magánautó csak az Ön csoportja számára, további szállodai megállók nélkül.\"},\"4\":{\"q\":\"Melyik jármű a legjobb üdülőhelyen való tartózkodáshoz?\",\"a\":\"Prémium szedán vagy Signature Class pároknak megfelelő; A VIP furgon ideális családok és extra poggyászok számára.\"},\"5\":{\"q\":\"Módosíthatom a szállodai leszállást a foglalás után?\",\"a\":\"Igen, ha az új szálloda a közelben van. A lehető leghamarabb küldjön nekünk üzenetet a LINE-on foglalási számával.\"},\"6\":{\"q\":\"Vár, ha késik a bejelentkezés?\",\"a\":\"A rövid várakozás a szállodában rendben van. Hosszabb késések esetén szóljon nekünk a LINE-on, hogy a sofőr alkalmazkodhasson.\"}}},\"pier-transfer\":{\"title\":\"Móló transzfer\",\"subtitle\":\"Megbízható kapcsolat a komp- és motorcsónak mólókkal\",\"intro\":\"Érkezz időben a Phi Phi, a Railay és a szigeti induláshoz olyan sofőrökkel, akik ismerik a kikötői menetrendeket.\",\"tip\":\"Foglaljon legalább 45-60 perccel a komp indulása előtt Ao Nangból vagy városból.\",\"benefit1\":\"Hajók és kompok indulására időzítve\",\"benefit2\":\"Segíts csomagokkal a móló bejáratához\",\"benefit3\":\"Linkek a repülőtérről, szállodáról vagy strandról\",\"faq\":{\"1\":{\"q\":\"Milyen korán kell érkeznem a komp előtt?\",\"a\":\"Tervezze meg, hogy Ao Nangból vagy Krabi városából indulás előtt 45–60 perccel éri el a mólót, különösen a főszezonban.\"},\"2\":{\"q\":\"A sofőr segíthet a táskákkal a mólón?\",\"a\":\"Igen. A sofőrök segítenek a poggyászokkal eljutni a móló bejáratához, így könnyebben bejelentkezhet a hajóba.\"},\"3\":{\"q\":\"Csatlakozik a Phi Phi és a Railay hajókhoz?\",\"a\":\"Igen. A népszerű látnivalók közé tartozik az Ao Nang móló, valamint a Phi Phi és a Railay hajójáratok felé közlekedő kapcsolatok.\"},\"4\":{\"q\":\"Hol tudom megnézni a hajóidőt?\",\"a\":\"Tekintse meg Hajómenetrend oldalunkat a komp- és motorcsónakok mintaidőpontjaiért, majd foglalja le a megfelelő mólótranszfert.\"},\"5\":{\"q\":\"Mi van, ha a hajómat törölték?\",\"a\":\"Lépjen kapcsolatba velünk azonnal. A hajó üzemeltetőinek időpontváltoztatása esetén átütemezhetjük az átszállást, vagy segítünk a leszállás beállításában.\"},\"6\":{\"q\":\"Foglalhatok szállodát → móló → szállodát még aznap?\",\"a\":\"Igen. Adja hozzá mindkét szakaszt egy foglaláshoz többútvonalként, vagy foglaljon két egyirányú transzfert egyező időpontokkal.\"}}},\"beach-transfer\":{\"title\":\"Strand transzfer\",\"subtitle\":\"Közvetlen járatok Ao Nangba, Railay-be, Patongba és a tengerparti területekre\",\"intro\":\"Hagyja ki a taxit a járdaszegélynél – menjen egyenesen a repülőtérről vagy a szállodából a strandra fix privát viteldíjjal.\",\"tip\":\"A vasúti hozzáférés tartalmazhat egy rövid hajóugrást a mólótól; kérdezzen tőlünk, amikor foglal.\",\"benefit1\":\"Fix privát viteldíj, méteres meglepetések nélkül\",\"benefit2\":\"Tengerparti és üdülőhelyi leszállási pontok\",\"benefit3\":\"Családi és csoportos járművek állnak rendelkezésre\",\"faq\":{\"1\":{\"q\":\"A viteldíj fix a strandra?\",\"a\":\"Igen. A privát tengerparti transzferek fix viteldíjat vesznek igénybe járművéhez – nem éri meglepetés a járdaszegélyt.\"},\"2\":{\"q\":\"Hogyan juthatok el Railay Beach területére?\",\"a\":\"A legtöbb vendég ellovagol a Railay móló területére, majd rövid, közös longtail-t választ. Foglaláskor jelezze, ha segítségre van szüksége a mólóidőzítéshez.\"},\"3\":{\"q\":\"Be lehet szállni a tengerparti üdülőhelyekre?\",\"a\":\"Igen. Beszállunk a tengerparti szállodákba és a megállapodott strand-hozzáférési pontokba Ao Nang, Railay összeköttetések és tengerparti területeken.\"},\"4\":{\"q\":\"Mi van, ha gyerekeim vannak és sok táskám?\",\"a\":\"Válasszon SUV-t vagy furgont, ha több helyet szeretne. Gyermekülés előzetesen igényelhető a foglalási jegyzeteken vagy a LINE-on.\"},\"5\":{\"q\":\"Nyugodtabb strandokra is jársz?\",\"a\":\"Igen, ahol a közúti megközelítés lehetővé teszi. Adja hozzá a strand vagy az üdülőhely nevét a megjegyzésekhez, és megerősítjük a legjobb leszállási pontot.\"},\"6\":{\"q\":\"Olcsóbb oda-vissza út a tengerpartra?\",\"a\":\"Az oda-vissza foglalások kis kedvezményt tartalmaznak két külön egyirányú utazáshoz képest. Az összehasonlításhoz használja az árellenőrzőt.\"}}},\"city-transfer\":{\"title\":\"Városi transzfer\",\"subtitle\":\"Kényelmes utazások a városok között Dél-Thaiföldön\",\"intro\":\"Krabi Town, Trang, Surat Thani és még sok más – magángépkocsik ügyintézéshez, szállodákhoz és napi költözésekhez.\",\"tip\":\"Több megállóból álló városi futások esetén minden megállót jegyezzen fel a foglalási megjegyzésekben.\",\"benefit1\":\"Pont-pont vagy több megálló igény szerint\",\"benefit2\":\"Légkondicionált kényelem a hosszabb városi ugráshoz\",\"benefit3\":\"Szedántól furgonig családok és csomagok számára\",\"faq\":{\"1\":{\"q\":\"Többször megállhatok a városban?\",\"a\":\"Igen, kérésre. A foglalási jegyzetekbe sorolja fel az egyes megállókat, hogy időt tervezhessünk és tisztességesen árajánlatot tudjunk készíteni.\"},\"2\":{\"q\":\"Leírod Trangot és Surat Thanit?\",\"a\":\"Igen. A városi és városi transzferek magukban foglalják Krabi városát, valamint egyes déli városokat a pont-pont privát utakra.\"},\"3\":{\"q\":\"Klímás az autó?\",\"a\":\"Minden transzferjármű légkondicionált és alkalmas nappali hőségre és hosszabb városi komlózásra.\"},\"4\":{\"q\":\"Foglalhatok még aznap a városban?\",\"a\":\"Gyakran igen, a rendelkezésre állás függvényében. Foglaljon online, amilyen hamar csak tud, vagy sürgős utazás esetén írjon nekünk a LINE-on.\"},\"5\":{\"q\":\"Tarthatom az autót néhány óráig a városban?\",\"a\":\"Várakozáshoz vagy óránkénti használathoz válassza az órabérletet vagy jegyezze fel a várakozási időt foglaláskor, hogy helyesen tudjunk árajánlatot adni.\"},\"6\":{\"q\":\"Busz- vagy vasútállomásról vesz fel?\",\"a\":\"Igen, ahol szerepel a telephelyeinken. A foglalási űrlapon válassza ki az állomást átvételként vagy leszállásként.\"}}},\"attraction-transfer\":{\"title\":\"Attraction Transzfer\",\"subtitle\":\"Templomok, smaragd medencék, meleg források és kilátópályák\",\"intro\":\"Privát transzfer Krabi legnépszerűbb látnivalóihoz, egynapos kirándulásokhoz várakozó-visszautazási lehetőségekkel.\",\"tip\":\"Kérjen kivárás-visszautazást, ha ugyanazt az autót szeretné visszaútra is.\",\"benefit1\":\"Népszerű park- és templomutak\",\"benefit2\":\"Várakozás és visszatérés egynapos kirándulási lehetőségek\",\"benefit3\":\"Kisteherautók kis csoportok számára és túrafelszerelés\",\"faq\":{\"1\":{\"q\":\"Várhat a sofőr, amíg meglátogatunk?\",\"a\":\"Igen. Foglaláskor kérjen visszaküldést, hogy ugyanaz az autó elvigye Önt az Emerald Pool, a templomok vagy a meleg források után.\"},\"2\":{\"q\":\"Milyen látnivalókkal foglalkozol?\",\"a\":\"A népszerű látnivalók közé tartozik az Emerald Pool, a Tiger Cave Temple, a meleg források és más Krabi parkok és kilátók.\"},\"3\":{\"q\":\"Egy kisteherautó jobb egy városnézéshez?\",\"a\":\"4+ vendég vagy úszás után vizes ruhák számára kényelmesebb egy furgon vagy VIP furgon, mint egy szedán.\"},\"4\":{\"q\":\"Belépőjegyek járnak az átszállással?\",\"a\":\"Nem. A transzferdíjak csak a szállítást tartalmazzák. A park- és templomjegyek a helyszínen fizetendők, hacsak nem foglal külön túrát.\"},\"5\":{\"q\":\"Meglátogathatunk több látnivalót is?\",\"a\":\"Igen. Sorolja fel a megállók sorrendjét a foglalási megjegyzésekben, vagy foglaljon többútvonalas/napos chartert a teljes városnézéshez.\"},\"6\":{\"q\":\"Mikor induljunk el a reggeli látnivalókhoz?\",\"a\":\"Az olyan népszerű helyeken, mint az Emerald Pool, a korai kezdés segít elkerülni a hőséget és a tömeget – foglaláskor javasolhatunk átvételi időpontot.\"}}},\"inter-province-transfer\":{\"title\":\"Tartományok közötti transzfer\",\"subtitle\":\"Távolsági magántranszfer Dél-Thaiföldön\",\"intro\":\"Krabi–Phuket, Trang, Surat Thani és azon túl – privát terepjáró, kisteherautó vagy busz a kényelmes autópályás utazáshoz.\",\"tip\":\"Hétvégén foglaljon le hosszú útvonalakat – foglaljon kora reggeli indulásra.\",\"benefit1\":\"Autópálya-kész SUV, furgon és busz opciók\",\"benefit2\":\"Fix viteldíj a tartományok közötti utazásokhoz\",\"benefit3\":\"Ideális csomagokkal és felszereléssel rendelkező csoportok számára\",\"faq\":{\"1\":{\"q\":\"Melyik jármű a legjobb hosszú országúti utakra?\",\"a\":\"SUV vagy furgon a kényelem érdekében; VIP furgon vagy busz nagyobb csoportok és több poggyász számára Krabi–Phuket vagy Surat útvonalakon.\"},\"2\":{\"q\":\"Rögzített az ár tartományok között?\",\"a\":\"Igen. A tartományok közötti transzferek az Ön által választott járműre meghatározott, privát viteldíjat alkalmaznak, amelyet a fizetés előtt egyeztetnek.\"},\"3\":{\"q\":\"Milyen korán érdemes lefoglalni a hétvégi kirándulásokat?\",\"a\":\"A hétvégék és az ünnepnapok korán megtelnek – ha teheti, legalább egy nappal előbb foglaljon reggeli indulást.\"},\"4\":{\"q\":\"Az autópályadíjak benne vannak?\",\"a\":\"A feltüntetett transzferárak tartalmazzák a normál útdíjat és az utazáshoz kapcsolódó parkolást, hacsak a foglalásnál másként nem jelezték.\"},\"5\":{\"q\":\"A hosszú útvonalakon a pihenőhelyek is benne vannak?\",\"a\":\"A sofőrök rövid időre megállhatnak vécéért vagy harapnivalóért hosszú autópályán. Említse meg a kívánt szüneteket a jegyzeteiben.\"},\"6\":{\"q\":\"El lehet jutni Krabiból Phuketbe a szállodába való átszállással?\",\"a\":\"Igen. Válassza ki Phuket szállodáját vagy repülőterét, mint leszállást – privát, ponttól pontig, nem pedig közös buszt.\"}}}},\"Vehicles\":{\"amenities\":{\"ac\":\"Légkondicionáló\",\"water\":\"Palackozott víz\",\"charger\":\"Telefon töltő\",\"legroom\":\"Extra lábtér\",\"groupSeating\":\"Csoportos ülések\",\"leather\":\"Bőr ülések\",\"wifi\":\"Wi-Fi\",\"snacks\":\"Snackek\",\"meetGreet\":\"Találkozz és üdvözölj\",\"luxury\":\"Luxus szedán\",\"premium\":\"Prémium felszereltség\",\"priority\":\"Elsőbbsé ils\":\"Részletek\",\"from\":\"-tól\",\"emptyArticles\":\"Egyetlen cikk sem felel meg a keresésnek.\",\"emptyTours\":\"Egyetlen köruta sem felel meg a szűrőknek.\",\"emptyTravel\":\"Egyetlen útmutató sem felel meg a keresésnek.\",\"ctaArticles\":\"Átvitelre van szüksége olvasás után?\",\"ctaTours\":\"Ki kell menni a mólóhoz?\",\"pierTransfer\":\"Móló transzfer\",\"inquireTour\":\"Érdeklődni a túráról\",\"allArticles\":\"Minden cikk\",\"allTours\":\"Minden túra\",\"allTravel\":\"Minden utazási információ\",\"relatedArticles\":\"Kapcsolódó cikkek\",\"relatedTours\":\"Kapcsolódó túrák\",\"bookRoute\":\"Készen állsz ennek az útvonalnak a lefoglalására?\",\"startBooking\":\"Kezdje el a foglalást\",\"highlights\":\"Kiemelések\",\"includes\":\"Jellemzően tartalmazza\",\"bookTransfer\":\"Könyvátadás\",\"inquire\":\"Érdeklődni\",\"quickTips\":\"Gyors tippek\",\"planTransfer\":\"Tervezze meg a következő átvitelt\",\"moreGuides\":\"További útmutatók\",\"boatType\":\"Csónak típusa\",\"allBoats\":\"Minden csónak\",\"ferry\":\"Komp\",\"speedboat\":\"Motorcsónak\",\"longtail\":\"Longtail\",\"route\":\"Útvonal\",\"allRoutes\":\"Minden útvonal\",\"departures\":\"Indulások\",\"duration\":\"Időtartam\",\"transferTo\":\"Átvitel ide: {pier}\",\"landTransfer\":\"Föld átadása a mólóhoz\",\"emptyBoats\":\"Egyetlen ütemezés sem felel meg a szűrőknek.\",\"mockBanner\":\"Hamis hajó menetrendek a tervezéshez – az időpontok a valóságban eltérhetnek.\",\"ctaArticlesBody\":\"Ellenőrizze az élő árakat, és foglaljon magánautót az azonnali e-voucher segítségével.\",\"bookRouteBody\":\"Szerezzen azonnali árat és QR-kóddal ellátott e-utalványt.\",\"relatedBoats\":\"Kapcsolódó hajóútvonalak\",\"landTransferBody\":\"Nem árusítunk kompjegyeket – időben eljuttatjuk Önt az indulási pontra.\",\"tourCtaTitle\":\"Foglaljon mólón vagy szállodai transzfert\",\"tourCtaBody\":\"A túrajegyeket a helyi szolgáltatók értékesítik. E-utalvány segítségével időben eljuttatjuk a találkozó mólójához.\",\"toursCtaBody\":\"Az utazási árak az üzemeltető becslései (ál). A szálloda és móló közötti transzfereket azonnali e-voucherrel bonyolítjuk le.\",\"travelCtaBody\":\"Ellenőrizze a hajóidőt, majd foglaljon privát transzfert a mólóhoz vagy a szállodához.\"},\"Articles\":{\"categories\":{\"Airport\":\"Repülőtér\",\"Beach\":\"Beach\",\"Pier\":\"Pier\",\"Inter Province\":\"Tartományközi\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"Krabi repülőtéri transzfer útmutató: zökkenőmentes érkezés a KBV-hez\",\"excerpt\":\"Mire számíthat a Krabi Nemzetközi Repülőtéren való leszállás után, hogyan működik a meet \u0026 greet, és hogyan foglalhat privát transzfert e-voucherrel.\",\"p1\":\"A Krabi Nemzetközi Repülőtéren (KBV) való leszállás a dél-thaiföldi utazás kezdete. A privát reptéri transzfer segít kihagyni a taxisorokat, és egyenesen szállodájába, strandjára vagy mólójába juthat.\",\"p2\":\"A Krabi Links Taxi segítségével sofőrje nyomon követi a járatot, és ingyenes várakozási időt biztosít a repülőtéri transzferhez. Foglalás után azonnal kap egy QR-kóddal ellátott e-utalványt – mutassa meg a találkozási ponton.\",\"p3\":\"A KBV népszerű útvonalai közé tartozik az Ao Nang Beach, a Railay, a Centara Grand és a Krabi Town. Válassza az Economy Sedant pároknak vagy egy furgont, ha családjával és csomagjaival utazik.\",\"p4\":\"Tipp: Foglaláskor oszd meg járatszámát és szállodanevét, hogy a sofőr elkészíthesse a névtáblát, és megtervezhesse a legjobb útvonalat az esti forgalom körül.\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"Ao Nang és Railay Beach transzfer tippek\",\"excerpt\":\"Hogyan közlekedhetsz Ao Nang, Railay és a közeli üdülőhelyek között személygépkocsikkal, mólókkal és a strandtáskákhoz megfelelő járművel.\",\"p1\":\"Ao Nang számos Krabi tengerparti üdülés központja, Railay pedig rövid mólójáratokon érhető el. Az átutalás előzetes megtervezése egyszerűvé teszi a napot.\",\"p2\":\"A repülőtérről vagy Krabi városából foglaljon privát transzfert Ao Nang Beachre vagy szállodájába. Railay esetében el tudjuk vinni a mólóhoz, és segítünk a hajócsatlakozás időpontjában.\",\"p3\":\"Ha snorkel felszerelést vagy nagy táskákat visz magával, egy SUV vagy Standard Van több helyet biztosít, mint egy szedán. Az oda-vissza foglalások a kijelentkezés napján is időt takarítanak meg.\",\"p4\":\"Az esti visszatérés a strandról zsúfolt lehet – foglalja le korán az átvételi időt, különösen hétvégén és ünnepnapokon.\"},\"pier-transfer-to-phi-phi\":{\"title\":\"Transzfer a mólón Phi Phibe: Amit az utazóknak tudniuk kell\",\"excerpt\":\"Gyakorlati ellenőrző lista a szállodáktól a mólóig történő transzferekhez, a kompok időzítéséhez és a csomagokkal kapcsolatos tippekhez, mielőtt elindulna Phi Phi-be.\",\"p1\":\"A szigetnapok a szárazföldön kezdődnek. A megbízható mólótranszfer a szállodából vagy a repülőtérről azt jelenti, hogy rohanás nélkül elérheti Ao Nang mólóját vagy más indulási pontokat.\",\"p2\":\"Buffer idő beépítése a bejelentkezéshez és a beszálláshoz. Javasoljuk, hogy csúcsszezonban legalább 45-60 perccel a komp indulása előtt érkezzen meg a mólóhoz.\",\"p3\":\"A privát furgonok ideálisak ugyanazon a kompon közlekedő csoportok számára. A családok foglaláskor ingyenesen igényelhetnek gyermekülést.\",\"p4\":\"A szigeti utazás után foglaljon vissza a mólón, hogy a sofőr készen álljon, amikor a hajó kiköt – különösen hasznos, ha sötétedés után érkezik.\"},\"krabi-to-phuket-inter-province\":{\"title\":\"Krabi-Phuket tartományok közötti transzfer\",\"excerpt\":\"Hasonlítsa össze a Krabi–Phuket folyosó kényelmét és időzítését, a járműlehetőségeket, és azt, hogy a magántranszfer felülmúlja a közös furgonokat.\",\"p1\":\"A Krabi–Phuket útvonal az egyik legkeresettebb tartományok közötti transzfer Dél-Thaiföldön. A magánautók háztól-házig időzítést biztosítanak többszöri megállás nélkül.\",\"p2\":\"A tipikus utazások összekötik a KBV-t vagy Krabi városát Phuket repülőterével vagy Patonggal. Az utazási idő a forgalomtól és attól függ, hogy a repülőtérről vagy a városról indul-e.\",\"p3\":\"Hosszabb utazásokhoz a VIP Van vagy Mini Bus opciók több helyet és kényelmet kínálnak. Az árak az útdíjat és a parkolást is tartalmazzák, hacsak nem ad hozzá várakozási időt.\",\"p4\":\"Foglaljon oda-vissza utat, ha az egyik tartományba repül, a másikba pedig ki – az egyik foglalás mindkét szakaszt lefedi egyetlen e-utalvány áramlásával.\"}}},\"Admin\":{\"loading\":\"Betöltés…\",\"loginTitle\":\"Adminisztrátor bejelentkezés\",\"loginHint\":\"Demo: {user} / {pass}\",\"username\":\"Felhasználónév\",\"password\":\"Jelszó\",\"signIn\":\"Jelentkezzen be\",\"loginError\":\"Érvénytelen felhasználónév vagy jelszó\",\"logout\":\"Jelentkezzen ki\",\"backToSite\":\"Vissza a weboldalra\",\"panelTitle\":\"Műveletek\",\"opsLabel\":\"Back office · Demo\",\"nav\":{\"dashboard\":\"Irányítópult\",\"bookings\":\"Foglalások\",\"payments\":\"Kifizetések\",\"schedule\":\"Ütemezés\",\"drivers\":\"Drivers\",\"customers\":\"Ügyfelek\",\"prices\":\"Ártáblázatok\",\"vehicles\":\"Járművek\",\"settings\":\"Beállítások elemre\"},\"dashboardTitle\":\"Irányítópult\",\"dashboardSubtitle\":\"Élő áttekintés az átutalásokról, fizetésekről és járművezetőkről.\",\"resetDemo\":\"Demó adatok visszaállítása\",\"statOpen\":\"Nyitott állások\",\"statPayReview\":\"Fizetés ellenőrzése\",\"statToday\":\"A mai kirándulások\",\"statAssigned\":\"Assigned / on trip\",\"statDrivers\":\"Illesztőprogramok online\",\"statRevenue\":\"Kifizetett bevétel\",\"recentBookings\":\"Legutóbbi foglalások\",\"recentBookingsHint\":\"Showing the 10 newest bookings. Open Bookings for the full list.\",\"recentEmpty\":\"No bookings match these filters.\",\"filterDate\":\"Pickup / created date\",\"pickupAt\":\"Pickup\",\"viewAll\":\"Az összes megtekintése\",\"viewAllBookings\":\"All bookings\",\"bookingsTitle\":\"Foglalások\",\"bookingsSubtitle\":\"Keresés, állapotfrissítés és illesztőprogramok hozzárendelése.\",\"searchBookings\":\"Foglalás keresése, név, telefon…\",\"filterAll\":\"Minden állapot\ yRate\":\"Óradíj (THB)\",\"settingsMinHours\":\"Minimális óraszám\",\"settingsFreeHours\":\"Ingyenes lemondás (órákkal az átvétel előtt)\",\"settingsLatePercent\":\"Kései lemondás díja (%)\",\"settingsNoShowPercent\":\"Meg nem jelenési díj (%)\",\"settingsRefundDays\":\"Visszatérítés belül (munkanapon belül)\",\"settingsNoStaff\":\"Még nincs extra személyzet.\",\"settingsStaffName\":\"Név\",\"settingsStaffRole\":\"Szerep\",\"settingsAddStaff\":\"Adjon hozzá személyzetet\",\"settingsStaffAdded\":\"Személyzeti fiók hozzáadva\",\"settingsStaffRemoved\":\"A személyzeti fiók eltávolítva\",\"settingsStaffDup\":\"Ez a felhasználónév már használatban van\",\"settingsRemove\":\"Távolítsa el\",\"settingsCancel\":\"Mégsem\",\"settingsMethod\":{\"bank-transfer\":\"Banki átutalás\",\"card\":\"kártya\",\"promptpay\":\"PromptPay\",\"cash\":\"Készpénz a sofőrnek\"},\"settingsRole\":{\"admin\":\"Admin\",\"ops\":\"Műveletek\",\"finance\":\"Pénzügy\",\"driver\":\"Driver\"},\"driversAdd\":\"Illesztőprogram hozzáadása\",\"driversEdit\":\"Illesztőprogram szerkesztése\",\"driversLine\":\"VONALazonosító\",\"driversPlate\":\"Rendszámtábla\",\"driversRemoved\":\"Driver eltávolítva\",\"catalogIssue\":{\"empty\":\"a fájl üres\",\"missingModel\":\"hiányzó modell\",\"badCategory\":\"érvénytelen kategória\",\"badLocation\":\"ismeretlen honnan/hova\",\"sameLocation\":\"tól és hova ugyanazok\",\"missingPrice\":\"hiányzó jármű ára\"},\"confirmOrder\":\"Confirm order\",\"orderConfirmDue\":\"Order total\",\"toastOrderOk\":\"Order confirmed — voucher can be issued\",\"planPayDriver\":\"Pay driver\",\"planDeposit\":\"Deposit\",\"planFull\":\"Full payment\",\"settingsAdvanceDepositTiers\":\"Online deposit is automatic by booking total: \u003c=1000 -\u003e 200 / 1001-2999 -\u003e 500 / \u003e=3000 -\u003e 1000 (not editable).\"},\"Tours\":{\"categories\":{\"Island\":\"Sziget\",\"Snorkel\":\"Sznorkel\",\"Kayak\":\"Kajak\",\"Sightseeing\":\"Városnézés\",\"Combo\":\"Combo\"},\"items\":{\"phi-phi-islands-day-trip\":{\"title\":\"Napi kirándulás a Phi Phi-szigetekre\",\"excerpt\":\"Klasszikus andamán kirándulás a Maya-öböl kilátójával, sznorkelmegállókkal és ebéddel a tengerparton.\",\"duration\":\"Egész nap (~8-9 óra)\",\"fromArea\":\"Ao Nang / Krabi\",\"toArea\":\"Phi Phi-szigetek\",\"highlights\":{\"1\":\"Maya Bay kilátó (a park szabályai szerint)\",\"2\":\"Sznorkel a tiszta zátonyokon\",\"3\":\"Tengerparti ebéd a Phi Phi Donban vagy a közeli öbölben\",\"4\":\"Szállodai vagy mólói felvételi időzítés támogatása\"},\"includes\":{\"1\":\"Motorcsónak- vagy kompülés (üzemeltetőfüggő)\",\"2\":\"Nemzeti park díjai (ahol az üzemeltető tartalmazza)\",\"3\":\"Ebéd és ivóvíz\",\"4\":\"Mentőmellény és snorkel felszerelés\"},\"content\":{\"1\":\"A Phi Phi továbbra is az egyik legkeresettebb egynapos kirándulás Krabiból. A legtöbb csomag korán indul Ao Nangból vagy a közeli kikötőkből, és késő délután tér vissza.\",\"2\":\"Javasoljuk, hogy foglaljon privát mólói transzfert, hogy pufferidővel érkezzen a bejelentkezés előtt. Az esti visszautazás zsúfolt lehet – foglaljon időpontot az átvételhez, amikor lefoglalja a túrát.\",\"3\":\"A feltüntetett túraárak a tipikus helyi szolgáltatóktól származnak (álkalauz árak). Erősítse meg a zárványokat, a hajó típusát és a Maya Bay hozzáférési szabályait az utazás dátumához.\"}},\"four-islands-tour\":{\"title\":\"4 sziget túra (csirke, Tup, Poda és Railay)\",\"excerpt\":\"Rövid sziget ugrálása Ao Nang közelében – sekély zátonyok, ikonikus sziklák és puha homokos strandok.\",\"duration\":\"Fél/teljes nap\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Csirke · Tup · Poda · Railay\",\"highlights\":{\"1\":\"Chicken Island kilátó és sznorkelezés\",\"2\":\"Tup Island homokpad (dagályfüggő)\",\"3\":\"Poda Beach úszómegálló\",\"4\":\"Választható Railay ugrás vagy látogatás\"},\"includes\":{\"1\":\"Longtail vagy motorcsónak\",\"2\":\"Snorkel maszk és mentőmellény\",\"3\":\"Gyümölcs/üdítő (kezelőtől függő)\",\"4\":\"Útmutató a fedélzeten\"},\"content\":{\"1\":\"A 4 Islands útvonal ideális, ha Ao Nang közelében szeretne tájat nézni anélkül, hogy hosszú átkelne a Phi Phi felé.\",\"2\":\"Az árapály befolyásolja a homokpad láthatóságát Tup-szigeten – általában a reggeli indulások biztosítják a legjobb feltételeket.\",\"3\":\"Párosítsa ezt a túrát egy szálloda és móló közötti transzferrel, így a főszezonban nem kell az utolsó pillanatban megszólaltatnia.\"}},\"hong-island-lagoon\":{\"title\":\"Hong-szigeti lagúna kirándulás\",\"excerpt\":\"Nyugodt lagúnák, kajakozási lehetőségek és homokos strandok a Than Bok Khorani Nemzeti Parkban.\",\"duration\":\"Egész nap\",\"fromArea\":\"Ao Nang / Nopparat Thara\",\"toArea\":\"Hong-sziget\",\"highlights\":{\"1\":\"Smaragd lagúna kilátással\",\"2\":\"Kajak mészkőcsatornákon keresztül\",\"3\":\"Csendes tengerparti idő\",\"4\":\"Nemzeti park táj\"},\"includes\":{\"1\":\"Hajós transzfer Hong-szigetre\",\"2\":\"Kajak (megosztott vagy privát – üzemeltetőfüggő)\",\"3\":\"Nemzeti park díja (gyakran benne van)\",\"4\":\"Ebéd néhány csomagon\"},\"content\":{\"1\":\"Hong-sziget népszerű azon utazók körében, akik inkább a lagúnákat és a kajakozást részesítik előnyben, mint a hosszú távú motorcsónakos napokat.\",\"2\":\"Az indulások gyakran Nopparat Thara / Ao Nang oldaláról indulnak. Hagyjon több időt, ha szállodája a szárazföldön vagy Krabi városában található.\",\"3\":\"Kérdezze meg az üzemeltetőjét a park nyitási szabályairól, és arról, hogy a kajakok az árban benne vannak-e vagy bérelhetők-e a helyszínen.\"}},\"james-bond-island-phang-nga\":{\"title\":\"James Bond-sziget · Phang Nga-öböl\",\"excerpt\":\"Ikonikus mészkőkarsztok, kenuzás a barlangokban és a híres Koh Tapu sziklatű.\",\"duration\":\"Egész nap\",\"fromArea\":\"Krabi / Phuket oldalon\",\"toArea\":\"Phang Nga-öböl\",\"highlights\":{\"1\":\"Koh Tapu (James Bond-sziget)\",\"2\":\"Kenu a mangrove barlangokon\",\"3\":\"Muszlim halászfalu megállója (üzemeltetőtől függő)\",\"4\":\"Festői öböli körutazás\"},\"includes\":{\"1\":\"Csónak és kenu szegmens\",\"2\":\"Útmutató\",\"3\":\"Ebéd\",\"4\":\"Nemzeti park díjai (csomagfüggő)\"},\"content\":{\"1\":\"A James Bond-szigeti túrák Krabiból vagy Phuketből indulhatnak. A szárazföldi utazási idő hosszabb lehet, mint maga a hajószakasz.\",\"2\":\"A szálloda és a találkozó mólója közötti privát transzfer a menetrend szerint tartja a napot – különösen a korai hotelfelvételek esetén.\",\"3\":\"Az árak a kenu minőségétől és a csoport méretétől függően igen eltérőek; árunkat csak tervezési útmutatóként használja.\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"Emerald Pool \u0026 Hot Spring kombó\",\"excerpt\":\"Szárazföldi természeti nap – smaragdzsungel medencék és ásványi termálforrások Krabi város közelében.\",\"duration\":\"Fél nap\",\"fromArea\":\"Krabi város / Ao Nang\",\"toArea\":\"Smaragd medence · Hot Spring\",\"highlights\":{\"1\":\"Ússzon az Emerald Poolban\",\"2\":\"Pihenjen a természetes meleg forrásnál\",\"3\":\"Kék medence nézőpont opció\",\"4\":\"Könnyű fél nap családoknak\"},\"includes\":{\"1\":\"Belépődíjak (csomagfüggő)\",\"2\":\"Útmutató néhány csomaghoz\",\"3\":\"Ivóvíz\"},\"content\":{\"1\":\"Ez a kombó tökéletes, ha viharos a tenger, vagy ha szárazföldi napot szeretne a szigeti kirándulások között.\",\"2\":\"Foglaljon attrakció transzfert háztól házig történő utazáshoz közös furgonok késése nélkül.\",\"3\":\"Vigyél magaddal vízcipőt – eső után az utak csúszósak lehetnek.\"}},\"railay-sunset-longtail\":{\"title\":\"Railay Sunset, Longtail\",\"excerpt\":\"Rövid mólóugrás Railay-be, ahol kilátóhelyeket, sziklákat mászva és aranyórás fotókat láthat.\",\"duration\":\"3-5 óra / este\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Railay Beach\",\"highlights\":{\"1\":\"Longtail Railay West / East felé\",\"2\":\"Phra Nang Cave Beach séta\",\"3\":\"Naplemente a Railay Westen\",\"4\":\"Fakultatív vacsora a tengerparton\"},\"includes\":{\"1\":\"oda-vissza longtail (megosztott vagy privát)\",\"2\":\"Mentőmellény\"},\"content\":{\"1\":\"Railay csak egy rövid hajóútra található Ao Nangtól, de úgy érzi, mintha egy másik úti cél lenne.\",\"2\":\"Ellenőrizze a visszautazási időpontokat, ha naplementére marad – a privát longtailek rugalmasak, ha a nyilvános hajók lelassulnak.\",\"3\":\"Kérésre el tudjuk vinni Önt Ao Nang kikötőjébe, és megvárjuk a visszaszállítást.\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"Úticél\",\"Island\":\"Sziget\",\"Corridor\":\"Folyosó\",\"Practical\":\"Praktikus\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"Ao Nang, mint a Krabi bázisod\",\"excerpt\":\"Hol érdemes megszállni, hogyan lehet elérni a mólót, és hogyan lehet összekapcsolni a strandokat, a Railay-t és az egynapos kirándulásokat.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Maradjon a tengerparti út közelében, hogy könnyen elérje Railay városát.\",\"2\":\"Foglaljon mólón transzfert a forgalmas komp reggelek előtti éjszakán.\",\"3\":\"Az esti forgalom Krabi városa és Ao Nang között 15–25 percet növelhet.\"},\"content\":{\"1\":\"Ao Nang a legpraktikusabb kiindulópont az első alkalommal látogatók számára: éttermek, utazásszervezői pultok és hajókikötők egymás mellett helyezkednek el.\",\"2\":\"Használjon privát transzfert a Krabi repülőtérről (KBV), ha csomagokkal vagy sötétedés után érkezik – a mérőórás taxik és a közös kisteherautók várakozási ideje eltérő.\",\"3\":\"Ao Nangból körülbelül 15 perc alatt elérheti Railay-t longtail-el, csatlakozhat 4 szigeti kiránduláshoz, vagy csatlakozhat Phi Phi motorcsónakokhoz.\",\"4\":\"Ha szállodája felfelé vagy szárazföldön van, adjon hozzá pufferidőt minden móló induláshoz.\"}},\"railay-access-tips\":{\"title\":\"A Railay Beach elérése stressz nélkül\",\"excerpt\":\"Hajózási lehetőségek, poggyásztippek, valamint a privát longtail és a közös hajók lefoglalásának ideje.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"A nagy bőröndök könnyebbek a privát longtaileken.\",\"2\":\"A Railay East sáros lehet apálykor – a nyugat jobb naplementére.\",\"3\":\"Vacsora előtt erősítse meg a visszaútra vonatkozó terveket.\"},\"content\":{\"1\":\"Railay-nek nincs közúti megközelítése. Szinte mindenki hajóval érkezik Ao Nangból vagy hosszabb utakon Krabi városából.\",\"2\":\"A megosztott longtail olcsó és mindennapos. A magánhajók drágábbak, de segítenek az időzítésben, a gyerekekben és a terjedelmes táskákban.\",\"3\":\"A hegymászás, a kajakozás és a Phra Nang barlangi strand sétálható, ha megérkezik – tervezzen lábbelit a sziklás ösvényekre.\",\"4\":\"Átvihetjük a szállodát → Ao Nang mólót, és megszervezzük az időzített visszaszállítást naplemente után.\"}},\"phi-phi-arrival-checklist\":{\"title\":\"Phi Phi érkezési ellenőrzőlista\",\"excerpt\":\"Komp vs motorcsónak, mólóidőzítés és a szállodai transzferek összekapcsolása az átkelés előtt és után.\",\"region\":\"Phi Phi / Krabi\",\"tips\":{\"1\":\"Főszezonban 45-60 perccel korábban érkezzen a mólóhoz.\",\"2\":\"A motorcsónakok gyorsabbak; a kompok általában gördülékenyebbek és olcsóbbak.\",\"3\":\"Foglalja le előre a földtranszfert, hogy ne rohanjon a csomagokkal.\"},\"content\":{\"1\":\"A szigetnapok a szárazföldön kezdődnek. A megbízható transzfer a szállodától a mólóig ugyanolyan fontos, mint maga a hajójegy.\",\"2\":\"Az időjárási és a parkokra vonatkozó szabályok megváltoztathatják a Maya-öböl hozzáférését – egyeztessen kezelőjével előző nap.\",\"3\":\"Visszatérő estéken a privát mólón közlekedő pickupok meghaladják a közös furgonokra való várakozást, különösen vizes táskákkal és fáradt gyerekekkel.\",\"4\":\"Ha másnap reggel repül ki Phuketből vagy Krabiból, hagyjon pufferidőt a kompok késése miatt.\"}},\"krabi-phuket-corridor\":{\"title\":\"Krabi–Phuket folyosó: Transzfer tippek\",\"excerpt\":\"Amikor egy magánautó legyőzi a közös furgonokat a legforgalmasabb déli tartományok közötti útvonalon.\",\"region\":\"Krabi · Phuket\",\"tips\":{\"1\":\"A háztól házig közlekedő személyautók több szállodai megállót kihagynak.\",\"2\":\"A repülőtér-repülőtér transzferekhez járatok követése és várakozási idő szükséges.\",\"3\":\"Az autópályadíj és a parkolás általában benne van a privát árajánlatokban.\"},\"content\":{\"1\":\"Krabi ↔ Phuket a legkeresettebb tartományok közötti folyosó a repülési kapcsolatok és a többutas utazások számára.\",\"2\":\"A közös kisteherautók olcsóbbak, de megállással növelik az időt. A magánterepjárók vagy kisteherautók megfelelnek a családoknak és a szűkös menetrendnek.\",\"3\":\"Tipikus szakaszok kötik össze a KBV-t vagy Krabi várost a Phuket repülőtérrel, Patonggal vagy a nyugati parti szállodákkal.\",\"4\":\"Foglaljon oda-vissza utat, ha az egyik tartományba repül, a másikba pedig elrepül – egy e-utalvány mindkét szakaszra vonatkozik.\"}}}},\"Boats\":{\"items\":{\"ao-nang-railay-longtail\":{\"routeLabel\":\"Ao Nang móló → Railay Beach\",\"operator\":\"Helyi longtail (megosztott)\",\"notes\":\"gyakori megosztott longtails; magánbérlet elérhető. Az esti hajók napnyugta után elvékonyodnak.\"},\"railay-ao-nang-longtail\":{\"routeLabel\":\"Railay Beach → Ao Nang móló\",\"operator\":\"Helyi longtail (megosztott)\",\"notes\":\"Visszatérő hajók Railay West / East felől az árapálytól és a poggyásztól függően.\"},\"ao-nang-phi-phi-speedboat\":{\"routeLabel\":\"Ao Nang / Tonsai → Phi Phi\",\"operator\":\"Motorcsónak-kezelők (ál)\",\"notes\":\"A pontos móló (Ao Nang vs Tonsai) a kezelőtől függ. Érkezés 30-45 perccel korábban a főszezonban.\"},\"phi-phi-ao-nang-speedboat\":{\"routeLabel\":\"Phi Phi → Ao Nang / Tonsai\",\"operator\":\"Motorcsónak-kezelők (ál)\",\"notes\":\"Foglalja le előre a visszavételt a mólón, ha sötétedés után érkezik.\"},\"ao-nang-phi-phi-ferry\":{\"routeLabel\":\"Ao Nang terület → Phi Phi (komp)\",\"operator\":\"Komp / kombinált transzfer (ál)\",\"notes\":\"Lassabb és általában olcsóbb, mint a motorcsónak. Tartalmazhat egy kisteherautót egy nagyobb kompkikötőhöz.\"},\"krabi-lanta-ferry\":{\"routeLabel\":\"Krabi → Koh Lanta\",\"operator\":\"Komp + furgon kombináció (ál)\",\"notes\":\"Sok csomag Krabi városát vagy a közeli mólókat használja; erősítse meg a találkozási pontot. Az időtartam tartalmazza az utat + tengert.\"},\"phi-phi-phuket-ferry\":{\"routeLabel\":\"Phi Phi → Phuket\",\"operator\":\"Kompüzemeltetők (ál)\",\"notes\":\"Érkezés után csatlakozzon egy phuketi repülőtéri vagy patong-i privát transzferhez.\"},\"railay-hong-island-speedboat\":{\"routeLabel\":\"Ao Nang → Hong-sziget\",\"operator\":\"Egynapos motorcsónak (ál)\",\"notes\":\"Általában oda-vissza napi csomagként árusítják, nem pedig egyirányú jegyként.\"}}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":[\"$L11\",\"$L12\",\"$L13\"]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[46615,[\"/nx/static/chunks/05-c3ty_6dwfk.js\",\"/nx/static/chunks/14mrh2-p_w84d.js\",\"/nx/static/chunks/21tc7p_83e_60.js\",\"/nx/static/chunks/31ctb4udrm_a8.js\",\"/nx/static/chunks/0zzkc_tjs3n7s.js\",\"/nx/static/chunks/3hgzbzv7ke2vh.js\",\"/nx/static/chunks/1ry2kng4m4i1k.js\",\"/nx/static/chunks/0zmvyptk783y8.js\",\"/nx/static/chunks/1t9su4fr6oisq.js\",\"/nx/static/chunks/0uuo53yvv0kb-.js\"],\"HtmlLang\"]\n15:I[87749,[\"/nx/static/chunks/05-c3ty_6dwfk.js\",\"/nx/static/chunks/14mrh2-p_w84d.js\",\"/nx/static/chunks/21tc7p_83e_60.js\",\"/nx/static/chunks/31ctb4udrm_a8.js\",\"/nx/static/chunks/0zzkc_tjs3n7s.js\",\"/nx/static/chunks/3hgzbzv7ke2vh.js\",\"/nx/static/chunks/1ry2kng4m4i1k.js\",\"/nx/static/chunks/0zmvyptk783y8.js\",\"/nx/static/chunks/1t9su4fr6oisq.js\",\"/nx/static/chunks/0uuo53yvv0kb-.js\"],\"SiteShell\"]\n16:I[13354,[\"/nx/static/chunks/05-c3ty_6dwfk.js\",\"/nx/static/chunks/14mrh2-p_w84d.js\",\"/nx/static/chunks/21tc7p_83e_60.js\",\"/nx/static/chunks/31ctb4udrm_a8.js\",\"/nx/static/chunks/0zzkc_tjs3n7s.js\",\"/nx/static/chunks/3hgzbzv7ke2vh.js\",\"/nx/static/chunks/1ry2kng4m4i1k.js\",\"/nx/static/chunks/0zmvyptk783y8.js\",\"/nx/static/chunks/1t9
