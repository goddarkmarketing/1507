"card\":\"Kad\",\"promptpay\":\"PromptPay\",\"cash\":\"Tunai kepada pemandu\",\"confirmBooking\":\"Sahkan tempahan\",\"confirmBank\":\"Sahkan tempahan (menunggu pemindahan)\",\"confirmCard\":\"Bayar dengan kad \u0026 sahkan\",\"confirmPromptPay\":\"Sahkan pembayaran PromptPay\",\"confirmCash\":\"Sahkan tempahan tunai\",\"cancelPolicyNote\":\"Pembatalan percuma sehingga {hours} jam sebelum pengambilan. Selepas itu bayaran {percent}% dikenakan.\",\"noShowPolicyNote\":\"No-show fee is {percent}% of the booking amount.\",\"refundPolicyNote\":\"Refunds are processed within {days} business days after approval.\",\"policyBoxTitle\":\"Booking \u0026 payment notes\",\"policyBoxHint\":\"Tap to view cancellation, deposit, and airport notes\",\"policyBoxTitleTransfer\":\"Cancellation policy\",\"policyBoxHintTransfer\":\"Tap to view transfer cancellation terms\",\"cancelTitle\":\"Cancellation\",\"depositTitle\":\"Car rental deposit\",\"depositSmallLabel\":\"Small car\",\"depositSmallAmount\":\"฿3,000\",\"depositLargeLabel\":\"Large car\",\"depositLargeAmount\":\"฿5,000\",\"depositStepAdvance\":\"After confirmation, pay {amount} advance deposit first.\",\"depositStepContract\":\"Pay rental fee and remaining deposit on contract day.\",\"depositStepRefund\":\"Deposit is refunded after car return and inspection.\",\"airportTitle\":\"Airport transfer\",\"depositNote\":\"Car rental security deposit: small car ฿3,000 · large car ฿5,000. Online booking deposit uses tiers: ≤฿1,000 → ฿200; ฿1,001–฿2,999 → ฿500; ≥฿3,000 → ฿1,000. Remaining balance is paid later. Security deposit refunded after return and inspection.\",\"airportTransferNote\":\"Free Krabi Airport pickup \u0026 drop-off for car rental customers.\",\"processing\":\"Memproses...\",\"demoNote\":\"Pembayaran demo — tiada caj sebenar · e-Baucar dikeluarkan selepas pengesahan\",\"at\":\"di\",\"toastCustomer\":\"Sila lengkapkan semua butiran pelanggan\",\"toastAdvance24h\":\"Please book at least 24 hours in advance\",\"advanceBookingHint\":\"Bookings must be made at least 24 hours before pickup. Night pickups (00:00–08:00) include a ฿200 driver service charge.\",\"nightSurchargeLabel\":\"Night driver service charge (00:00–08:00)\",\"nightSurchargeHint\":\"Special overnight hours — ฿200 added for the driver.\",\"toastPayment\":\"Sila pilih kaedah pembayaran\",\"toastRemoteSyncOk\":\"Booking saved to the cloud — you can reopen the voucher anytime.\",\"toastRemoteSyncFail\":\"Saved on this device only. Cloud sync failed — keep your booking number.\",\"toastFail\":\"Tidak dapat mengesahkan tempahan. Sila semak butiran anda.\",\"types\":{\"one-way\":{\"label\":\"Sehala\",\"desc\":\"Pemindahan tunggal\",\"detail\":\"Pemindahan satu titik ke titik.\"},\"round-trip\":{\"label\":\"Pergi Balik\",\"desc\":\"Termasuk perjalanan pergi balik\",\"detail\":\"Kami secara automatik akan membuat kaki kembali dengan laluan terbalik.\"},\"multi-route\":{\"label\":\"Berbilang Laluan\",\"desc\":\"Pelbagai destinasi\",\"detail\":\"Tambah seberapa banyak kaki laluan yang anda perlukan untuk perjalanan anda.\"},\"multi-day\":{\"label\":\"Pelbagai Hari\",\"desc\":\"Tarikh yang berbeza\",\"detail\":\"Jadualkan pemindahan pada tarikh yang berbeza dalam satu tempahan.\"},\"daily-charter\":{\"label\":\"Piagam Harian\",\"desc\":\"8 jam sehari penuh\",\"detail\":\"Charter sehari penuh (8 jam) — pilih kenderaan anda dan masa mula.\"},\"hourly-charter\":{\"label\":\"Piagam Setiap Jam\",\"desc\":\"Min 3 jam\",\"detail\":\"Minimum 3 jam — perhentian fleksibel dalam tempoh piagam anda.\"}},\"paymentSubtitlePlans\":\"Choose pay to driver, deposit, or pay in full — then complete payment details\",\"payAtPickup\":\"Pay at pickup\",\"balanceDueDriver\":\"Pay ฿{amount} in cash to the driver at pickup\",\"paymentPlanLabel\":\"Payment plan:\",\"confirmPayDriver\":\"Submit booking (awaiting staff confirmation)\",\"depositStepAdvanceTier\":\"Online deposit tiers: ≤฿1,000 → ฿200 · ฿1,001–฿2,999 → ฿500 · ≥฿3,000 → ฿1,000.\",\"toastPaymentPlan\":\"Please choose a payment plan\",\"routePreviewOfficial\":\"Official tariff\",\"routePreviewOnRequest\":\"On request\"},\"Pages\":{\"fleet\":\"Armada kami\",\"priceList\":\"Senarai Harga\",\"faq\":\"Soalan Lazim\",\"reviews\":\"Ulasan Pelanggan\",\"contact\":\"Hubungi Kami\",\"articles\":\"Artikel Perjalanan\",\"tours\":\"Lawatan\",\"boatSchedules\":\"Jadual Bot\",\"travelInfo\":\"Maklumat Perjalanan\",\"fleetSubtitle\":\"8 kelas kenderaan dengan gambar sebenar dan spesifikasi penuh\",\"priceListSubtitle\":\"Kadar telus untuk pemindahan dan sewa harian\",\"reviewsSubtitle\":\"Maklum balas sebenar daripada pelancong di seluruh Selatan Thailand\",\"contactSubtitle\":\"Ada soalan? Pasukan kami sedia membantu dengan rancangan perjalanan Thailand Selatan anda.\",\"articlesSubtitle\":\"Panduan untuk pemindahan lapangan terbang, pantai, jeti dan antara wilayah\",\"toursSubtitle\":\"Lawatan sehari dan pengalaman pulau di sekitar Krabi\",\"boatSchedulesSubtitle\":\"Masa berlepas feri dan bot laju olok-olok\",\"travelInfoSubtitle\":\"Petua praktikal untuk destinasi Selatan Thailand yang popular\"},\"Site\":{\"slogan\":\"Rangkaian Pemindahan Thailand Selatan Dipercayai Anda\",\"tagline\":\"Platform Pelancongan \u0026 Pengangkutan Selatan Thailand\"},\"Faq\":{\"pageTitle\":\"Soalan Lazim \u0026 Polisi\",\"pageSubtitle\":\"Semua yang anda perlu tahu tentang tempahan, pembayaran dan standard perkhidmatan kami.\",\"sectionTitle\":\"Soalan Lazim\",\"policiesTitle\":\"Dasar Perkhidmatan\",\"items\":{\"1\":{\"q\":\"Bagaimanakah cara saya menempah pemindahan?\",\"a\":\"Pilih lokasi pengambilan dan penghantaran anda, pilih kenderaan anda, tarikh dan masa, kemudian lengkapkan borang tempahan. Anda akan menerima e-Baucar dengan kod QR serta-merta.\"},\"2\":{\"q\":\"Bolehkah saya menempah beberapa laluan dalam satu tempahan?\",\"a\":\"ya. Sistem tempahan kami menyokong tempahan sehala, pergi balik, berbilang laluan, berbilang hari dan sewaan — semuanya dalam satu tempahan.\"},\"3\":{\"q\":\"Bagaimana jika penerbangan saya tertunda?\",\"a\":\"Kami memantau jadual penerbangan. Untuk pengambilan di lapangan terbang, kami menyertakan 60 minit masa menunggu percuma dari masa pendaratan sebenar anda.\"},\"4\":{\"q\":\"Apakah kaedah pembayaran yang anda terima?\",\"a\":\"Kami menerima pindahan bank, kad kredit/debit dan PromptPay semasa tempahan dalam talian (demo menggunakan data pembayaran palsu). Anda juga boleh membayar pemandu secara tunai (THB) jika diatur lebih awal.\"},\"5\":{\"q\":\"Apakah dasar pembatalan anda?\",\"a\":\"Pembatalan percuma sehingga 24 jam sebelum pengambilan. Pembatalan dalam masa 24 jam mungkin dikenakan caj 50%. Tidak hadir tidak boleh dikembalikan.\"},\"6\":{\"q\":\"Adakah anda menyediakan tempat duduk kanak-kanak?\",\"a\":\"Ya, tempat duduk kanak-kanak disediakan atas permintaan tanpa bayaran tambahan. Sila nyatakan umur/berat kanak-kanak semasa membuat tempahan.\"},\"7\":{\"q\":\"Adakah harga semua termasuk?\",\"a\":\"ya. Harga yang disebut termasuk tol, tempat letak kereta, minyak dan perkhidmatan pemandu. Caj tambahan hanya dikenakan untuk menunggu lebih masa atau alat tambah pilihan yang anda minta.\"},\"8\":{\"q\":\"Bagaimanakah saya boleh menerima e-Baucar saya?\",\"a\":\"Selepas mengesahkan tempahan anda, e-Baucar dengan kod QR ditunjukkan serta-merta dan boleh dibuka semula pada bila-bila masa dari halaman tempahan anda. Tunjukkan kepada pemandu semasa pengambilan.\"},\"9\":{\"q\":\"What documents and deposit are needed for car rental?\",\"a\":\"Please prepare an ID card or driver’s license, round-trip flight tickets in your name, and a reachable phone number. Security deposit is ฿3,000 for small cars and ฿5,000 for large cars. Pay ฿500 in advance when the car is confirmed; pay the rental fee and remaining deposit on contract day. The deposit is refunded after return and inspection. Free Krabi Airport pickup and drop-off is included.\"}},\"policies\":{\"waiting\":{\"title\":\"Masa Menunggu\",\"content\":\"Pengambilan lapangan terbang termasuk 60 minit menunggu percuma. Pengambilan hotel/pier termasuk 15 minit menunggu percuma. Penantian tambahan dikenakan bayaran sebanyak 200 THB setiap 30 minit.\"},\"flight-delay\":{\"title\":\"Kelewatan Penerbangan\",\"content\":\"Kami menjejaki nombor penerbangan anda dan melaraskan masa pengambilan secara automatik. Tiada caj tambahan untuk kelewatan sehingga 2 jam.\"},\"child-seat\":{\"title\":\"Kerusi Kanak-kanak\",\"content\":\"Tempat duduk bayi, kanak-kanak dan booster tersedia secara percuma. Minta semasa membuat tempahan.\"},\"pets\":{\"title\":\"Haiwan peliharaan\",\"content\":\"Haiwan peliharaan kecil dalam pembawa dialu-alukan dalam kategori SUV dan Van. Bayaran pembersihan tambahan sebanyak 300 THB mungkin dikenakan.\"},\"ferry\":{\"title\":\"Sambungan Feri\",\"content\":\"Pemindahan jeti termasuk penghantaran di terminal feri. Tiket feri boleh diaturkan sebagai perkhidmatan tambahan.\"},\"toll\":{\"title\":\"Tol \u0026 Tempat Letak Kereta\",\"content\":\"Semua bayaran tol dan caj tempat letak kereta di lapangan terbang/dermaga adalah termasuk dalam harga yang disebut.\"},\"payment\":{\"title\":\"Bayaran\",\"content\":\"Bayar dalam talian melalui kad/pindahan atau tunai kepada pemandu dalam THB. Harga adalah termasuk semua melainkan dinyatakan sebaliknya.\"},\"cancellation\":{\"title\":\"Pembatalan\",\"content\":\"Pembatalan percuma 24+ jam sebelum pengambilan. Dalam masa 24 jam: 50% caj. Tidak hadir: tiada bayaran balik.\"},\"refund\":{\"title\":\"Bayaran balik\",\"content\":\"Bayaran balik yang diluluskan diproses dalam masa 5–7 hari perniagaan ke kaedah pembayaran asal.\"},\"rental-deposit\":{\"title\":\"Car rental deposit\",\"content\":\"Small cars: ฿3,000 deposit. Large cars: ฿5,000 deposit. After confirmation, pay ฿500 advance deposit first. Pay rental fee and remaining deposit on contract day. Deposit is refunded after car return and inspection. Free Krabi Airport pickup \u0026 drop-off.\"}}},\"Reviews\":{\"pageTitle\":\"Ulasan Pelanggan\",\"pageSubtitle\":\"Maklum balas sebenar daripada pelancong di seluruh Selatan Thailand.\",\"items\":{\"1\":{\"country\":\"United Kingdom\",\"comment\":\"Pemindahan lancar dari Lapangan Terbang Krabi ke Ao Nang. Pemandu sedang menunggu dengan tanda, kereta bersih dan selesa.\",\"route\":\"Lapangan Terbang KBV → Pantai Ao Nang\"},\"2\":{\"country\":\"Jerman\",\"comment\":\"Tempah perjalanan pergi balik ke Pantai Railay. Komunikasi yang sangat baik dan perkhidmatan menepati masa kedua-dua cara.\",\"route\":\"Lapangan Terbang KBV ↔ Pantai Railay\"},\"3\":{\"country\":\"Jepun\",\"comment\":\"Van VIP untuk keluarga kami seramai 6 orang adalah sempurna. Kanak-kanak menyukai tuala sejuk dan makanan ringan!\",\"route\":\"Lapangan Terbang KBV → Centara Grand\"},\"4\":{\"country\":\"Itali\",\"comment\":\"Perpindahan antara wilayah yang bernilai baik ke Phuket. Sedikit terlewat kerana lalu lintas tetapi pemandu memaklumkan kami.\",\"route\":\"Krabi → Lapangan Terbang Phuket\"},\"5\":{\"country\":\"Australia\",\"comment\":\"Jemputan hotel ke jeti tepat. Pemandu membantu dengan beg dan menetapkan masa semuanya untuk feri Phi Phi kami.\",\"route\":\"Hotel Ao Nang → Jeti Ao Nang\"},\"6\":{\"country\":\"Perancis\",\"comment\":\"Tempah pemindahan pantai ke Railay melalui jeti. Kemas kini yang jelas pada LINE dan van bersih untuk bagasi kami.\",\"route\":\"Bandar Krabi → Jeti Railay\"},\"7\":{\"country\":\"Thailand\",\"comment\":\"Digunakan untuk perjalanan berbilang hari di sekitar Krabi. Tempahan mudah, harga berpatutan dan pemandu sentiasa menepati masa.\",\"route\":\"Piagam Harian · Krabi\"}}},\"Transfer\":{\"fromEco\":\"Sedan Ekonomi dari\",\"book\":\"Buku\",\"bookRoute\":\"Tempah laluan ini\",\"popularRoutes\":\"Laluan popular\",\"popularRoutesHint\":\"Contoh tambang untuk Sedan Ekonomi. Harga akhir bergantung pada kenderaan dan tarikh.\",\"route\":\"Laluan\",\"distance\":\"Jarak\",\"duration\":\"Tempoh\",\"fromPrice\":\"Daripada (ECO)\",\"recommended\":\"Kenderaan yang disyorkan\",\"recommendedBody\":\"Pilih kenderaan yang sesuai dengan saiz kumpulan dan bagasi anda.\",\"ctaTitle\":\"Sedia untuk menempah {title}?\",\"ctaBody\":\"Dapatkan e-Baucar segera dengan kod QR selepas membuat tempahan.\",\"howTitle\":\"Cara tempahan berfungsi\",\"howSubtitle\":\"Tiga langkah mudah dari sebut harga hingga pengambilan.\",\"step1Title\":\"Pilih laluan anda\",\"step1Body\":\"Pilih pengambilan, hantar, tarikh dan kenderaan.\",\"step2Title\":\"Sahkan \u0026 bayar\",\"step2Body\":\"Bayar dengan selamat dan terima e-Baucar anda dengan QR.\",\"step3Title\":\"Temui pemandu anda\",\"step3Body\":\"Butiran pemandu tiba sebelum pengambilan. Bersantai dan menunggang.\",\"includedTitle\":\"Apa yang disertakan\",\"otherServices\":\"Perkhidmatan pemindahan lain\",\"viewPrices\":\"Lihat senarai harga\",\"startBooking\":\"Mulakan tempahan\",\"km\":\"{n} km\",\"approxMin\":\"~{n} min\",\"tipLabel\":\"Senang tahu\",\"categories\":{\"airport\":\"Lapangan terbang\",\"hotel\":\"Hotel\",\"pier\":\"Jeti\",\"beach\":\"Pantai\",\"city\":\"Bandar\",\"attraction\":\"Tarikan\",\"inter-province\":\"Antara wilayah\"},\"faqTitle\":\"Soalan Lazim untuk perkhidmatan ini\",\"faqSubtitle\":\"Jawapan pantas sebelum anda menempah.\",\"reviewsTitle\":\"Apa yang dikatakan pengembara\",\"allReviews\":\"Semua ulasan\",\"allFaq\":\"Semua Soalan Lazim\",\"includedBadge\":\"Termasuk\"},\"TransferPages\":{\"airport-transfer\":{\"title\":\"Pemindahan Lapangan Terbang\",\"subtitle\":\"Pemindahan peribadi ke dan dari lapangan terbang Krabi dan Selatan Thailand\",\"intro\":\"Pengambilan mengikut masa penerbangan dengan pilihan bertemu \u0026 sapa, ruang bagasi dan perjalanan terus ke hotel, pantai dan jeti.\",\"tip\":\"Kongsi nombor penerbangan anda semasa membuat tempahan. Titik pertemuan Lapangan Terbang Krabi: Door 15 domestik, Door 16 antarabangsa — lihat ke kiri selepas anda keluar.\",\"benefit1\":\"Pemantauan penerbangan dan masa menunggu yang fleksibel\",\"benefit2\":\"Bertemu \u0026 bertanya khabar semasa ketibaan atas permintaan\",\"benefit3\":\"Ruang untuk beg pakaian — pilihan sedan ke van\",\"faq\":{\"1\":{\"q\":\"Bagaimana jika penerbangan saya tertunda?\",\"a\":\"Kami memantau penerbangan untuk pengambilan lapangan terbang dan termasuk kira-kira 60 minit menunggu percuma dari masa pendaratan sebenar anda.\"},\"2\":{\"q\":\"Adakah anda menawarkan jumpa \u0026 salam?\",\"a\":\"ya. Tambahkan nombor penerbangan anda semasa membuat tempahan. Di Lapangan Terbang Krabi, ketibaan domestik keluar dari Pintu 15 dan ketibaan antarabangsa keluar dari Pintu 16, kemudian lihat ke kiri — pemandu menunggu dengan nama anda pada papan tanda.\"},\"3\":{\"q\":\"Berapa banyak bagasi yang boleh saya bawa?\",\"a\":\"Sedan ekonomi muat kira-kira 3 beg sederhana. Untuk lebih banyak bagasi atau keluarga, pilih SUV, van atau van VIP pada borang tempahan.\"},\"4\":{\"q\":\"Bolehkah anda menjemput di Lapangan Terbang Phuket juga?\",\"a\":\"ya. Kami meliputi Krabi (KBV) dan lapangan terbang Selatan Thailand terpilih termasuk Phuket, dengan tambang peribadi dari titik ke titik.\"},\"5\":{\"q\":\"Bagaimanakah cara saya membayar untuk pemindahan lapangan terbang?\",\"a\":\"Bayar dalam talian melalui pindahan wang melalui bank, kad atau PromptPay apabila anda menempah. Wang tunai kepada pemandu boleh diaturkan terlebih dahulu jika perlu.\"},\"6\":{\"q\":\"Bilakah saya boleh mendapatkan butiran pemandu?\",\"a\":\"Nama pemandu, telefon dan butiran kereta dikongsi sebelum pengambilan — biasanya dalam masa 24 jam dari masa pemindahan anda.\"}}},\"hotel-transfer\":{\"title\":\"Pemindahan Hotel\",\"subtitle\":\"Perjalanan dari pintu ke pintu antara pusat peranginan, hotel dan tempat-tempat penting di Krabi\",\"intro\":\"Kereta persendirian ke lobi hotel atau pintu pagar vila anda — tiada van kongsi, tiada perhentian tambahan.\",\"tip\":\"Tambahkan nama atau pin hotel anda dalam nota tempahan untuk penghantaran yang lebih lancar.\",\"benefit1\":\"Mengambil dan menghantar dari pintu ke pintu\",\"benefit2\":\"Sesuai untuk daftar masuk lewat dan keluar awal\",\"benefit3\":\"Pilihan premium dan VIP untuk penginapan istimewa\",\"faq\":{\"1\":{\"q\":\"Adakah anda akan menurunkan saya di lobi hotel?\",\"a\":\"ya. Pemindahan adalah dari pintu ke pintu ke lobi atau pintu pagar vila. Tambahkan nama hotel atau pin peta dalam nota tempahan anda.\"},\"2\":{\"q\":\"Bolehkah saya menempah pengambilan hotel lewat malam?\",\"a\":\"ya. Pemindahan peribadi dijalankan untuk keluar awal dan daftar masuk lewat — pilih tarikh dan masa anda apabila anda menempah.\"},\"3\":{\"q\":\"Adakah ini pengangkutan ulang-alik?\",\"a\":\"Tidak. Setiap tempahan adalah kereta persendirian untuk kumpulan anda sahaja, tanpa perhentian hotel tambahan.\"},\"4\":{\"q\":\"Kenderaan manakah yang terbaik untuk penginapan di resort?\",\"a\":\"Sedan premium atau Sut Kelas Tandatangan pasangan; Van VIP sesuai untuk keluarga dan bagasi tambahan.\"},\"5\":{\"q\":\"Bolehkah saya menukar penghantaran hotel selepas membuat tempahan?\",\"a\":\"Ya, jika hotel baru berdekatan. Mesej kami di LINE dengan nombor tempahan anda seawal mungkin.\"},\"6\":{\"q\":\"Adakah anda menunggu jika daftar masuk ditangguhkan?\",\"a\":\"Menunggu sebentar di hotel tidak mengapa. Untuk kelewatan yang lebih lama, beritahu kami di LINE supaya pemandu boleh menyesuaikan diri.\"}}},\"pier-transfer\":{\"title\":\"Pemindahan Jeti\",\"subtitle\":\"Sambungan yang boleh dipercayai ke jeti feri dan bot laju\",\"intro\":\"Tiba tepat pada masanya untuk berlepas Phi Phi, Railay dan pulau dengan pemandu yang mengetahui jadual jeti.\",\"tip\":\"Tempah sekurang-kurangnya 45–60 minit sebelum feri berlepas dari Ao Nang atau bandar.\",\"benefit1\":\"Ditetapkan masa untuk berlepas dengan bot dan feri\",\"benefit2\":\"Bantu dengan beg ke pintu masuk jeti\",\"benefit3\":\"Pautan dari lapangan terbang, hotel atau pantai\",\"faq\":{\"1\":{\"q\":\"Berapa awal saya harus tiba sebelum feri?\",\"a\":\"Rancang untuk sampai ke jeti 45–60 minit sebelum berlepas dari Ao Nang atau Bandar Krabi, terutamanya pada musim puncak.\"},\"2\":{\"q\":\"Bolehkah pemandu membantu dengan beg di jeti?\",\"a\":\"ya. Pemandu membantu dengan bagasi ke pintu masuk jeti supaya anda boleh mendaftar masuk untuk bot anda dengan lebih mudah.\"},\"3\":{\"q\":\"Adakah anda menyambung ke bot Phi Phi dan Railay?\",\"a\":\"ya. Titik popular termasuk Jeti Ao Nang dan sambungan ke arah perkhidmatan bot Phi Phi dan Railay.\"},\"4\":{\"q\":\"Di manakah saya boleh menyemak masa bot?\",\"a\":\"Lihat halaman Jadual Bot kami untuk contoh masa feri dan bot laju, kemudian tempah pemindahan jeti anda untuk dipadankan.\"},\"5\":{\"q\":\"Bagaimana jika bot saya dibatalkan?\",\"a\":\"Hubungi kami segera. Kami boleh menjadualkan semula pemindahan atau membantu melaraskan penghantaran apabila pengendali bot menukar masa.\"},\"6\":{\"q\":\"Bolehkah saya menempah hotel → jeti → hotel pada hari yang sama?\",\"a\":\"ya. Tambahkan kedua-dua kaki dalam satu tempahan sebagai berbilang laluan, atau tempah dua pemindahan sehala dengan masa yang sepadan.\"}}},\"beach-transfer\":{\"title\":\"Pemindahan Pantai\",\"subtitle\":\"Perjalanan terus ke Ao Nang, Railay, Patong dan kawasan pantai\",\"intro\":\"Langkau teksi di tepi jalan — pergi terus dari lapangan terbang atau hotel ke pantai dengan tambang peribadi tetap.\",\"tip\":\"Akses Railay mungkin termasuk lompat bot singkat dari jeti; tanya kami bila anda menempah.\",\"benefit1\":\"Tambang peribadi tetap, tiada kejutan meter\",\"benefit2\":\"Tempat menghantar pantai dan resort\",\"benefit3\":\"Kenderaan keluarga dan kumpulan disediakan\",\"faq\":{\"1\":{\"q\":\"Adakah tambang tetap ke pantai?\",\"a\":\"ya. Pemindahan pantai persendirian menggunakan tambang tetap untuk kenderaan anda — tiada kejutan meter di tepi jalan.\"},\"2\":{\"q\":\"Bagaimanakah cara untuk saya ke Pantai Railay?\",\"a\":\"Kebanyakan tetamu pergi ke kawasan jeti Railay, kemudian mengambil ekor panjang yang dikongsi pendek. Beritahu kami apabila anda menempah jika anda memerlukan bantuan masa dermaga.\"},\"3\":{\"q\":\"Bolehkah anda singgah di resort pantai?\",\"a\":\"ya. Kami singgah di hotel tepi pantai dan titik akses pantai yang dipersetujui merentasi Ao Nang, sambungan Railay dan kawasan pantai.\"},\"4\":{\"q\":\"Bagaimana jika saya mempunyai anak dan banyak beg?\",\"a\":\"Pilih SUV atau van untuk ruang tambahan. Tempat duduk kanak-kanak boleh diminta terlebih dahulu melalui nota tempahan atau LINE.\"},\"5\":{\"q\":\"Adakah anda pergi ke pantai yang lebih tenang juga?\",\"a\":\"Ya, di mana akses jalan membenarkan. Tambahkan nama pantai atau tempat peranginan dalam nota dan kami akan mengesahkan tempat turun terbaik.\"},\"6\":{\"q\":\"Adakah perjalanan pergi balik ke pantai lebih murah?\",\"a\":\"Tempahan pergi balik termasuk diskaun kecil berbanding dua sehala yang berasingan. Gunakan penyemak harga untuk membandingkan.\"}}},\"city-transfer\":{\"title\":\"Pemindahan Bandar\",\"subtitle\":\"Perjalanan yang selesa antara bandar di seluruh Selatan Thailand\",\"intro\":\"Pekan Krabi, Trang, Surat Thani dan banyak lagi — kereta persendirian untuk urusan, hotel dan perpindahan hari.\",\"tip\":\"Untuk larian bandar berbilang henti, catatkan setiap perhentian dalam ulasan tempahan.\",\"benefit1\":\"Titik ke titik atau berbilang hentian atas permintaan\",\"benefit2\":\"Keselesaan berhawa dingin untuk lompat bandar yang lebih lama\",\"benefit3\":\"Sedan ke van untuk keluarga dan bagasi\",\"faq\":{\"1\":{\"q\":\"Bolehkah saya membuat beberapa perhentian di bandar?\",\"a\":\"Ya, atas permintaan. Senaraikan setiap perhentian dalam nota tempahan supaya kami boleh merancang masa dan memetik secara adil.\"},\"2\":{\"q\":\"Adakah anda meliputi Trang dan Surat Thani?\",\"a\":\"ya. Pemindahan bandar dan bandar termasuk Pekan Krabi serta bandar-bandar Selatan terpilih untuk perjalanan peribadi dari titik ke titik.\"},\"3\":{\"q\":\"Adakah kereta itu berhawa dingin?\",\"a\":\"Semua kenderaan pemindahan adalah berhawa dingin dan sesuai untuk panas siang hari dan lompat bandar yang lebih lama.\"},\"4\":{\"q\":\"Bolehkah saya menempah hari yang sama di bandar?\",\"a\":\"Selalunya ya, tertakluk pada ketersediaan. Tempah dalam talian seawal yang anda boleh, atau mesej kami di LINE untuk perjalanan segera.\"},\"5\":{\"q\":\"Bolehkah saya menyimpan kereta selama beberapa jam di bandar?\",\"a\":\"Untuk penggunaan menunggu atau setiap jam, pilih piagam setiap jam atau catatkan masa menunggu apabila anda menempah supaya kami boleh sebut harga dengan betul.\"},\"6\":{\"q\":\"Adakah anda mengambil dari stesen bas atau kereta api?\",\"a\":\"Ya, di mana disenaraikan di lokasi kami. Pilih stesen sebagai pengambilan atau hantar pada borang tempahan.\"}}},\"attraction-transfer\":{\"title\":\"Pemindahan Tarikan\",\"subtitle\":\"Kuil, kolam zamrud, mata air panas dan larian sudut pandang\",\"intro\":\"Pemindahan peribadi ke tempat-tempat menarik di Krabi dengan pilihan tunggu dan pulang untuk lawatan sehari.\",\"tip\":\"Minta tunggu dan balik jika anda mahukan kereta yang sama untuk perjalanan balik.\",\"benefit1\":\"Laluan taman dan kuil yang popular\",\"benefit2\":\"Pilihan perjalanan sehari tunggu dan balik\",\"benefit3\":\"Van untuk kumpulan kecil dan peralatan pelancongan\",\"faq\":{\"1\":{\"q\":\"Bolehkah pemandu menunggu semasa kami melawat?\",\"a\":\"ya. Minta tunggu dan pulang apabila anda menempah supaya kereta yang sama boleh membawa anda pulang selepas Emerald Pool, kuil atau mata air panas.\"},\"2\":{\"q\":\"Pemandangan mana yang anda tutupi?\",\"a\":\"Titisan popular termasuk Kolam Zamrud, Kuil Gua Harimau, mata air panas dan taman dan sudut pandangan Krabi yang lain.\"},\"3\":{\"q\":\"Adakah van lebih baik untuk bersiar-siar sehari?\",\"a\":\"Untuk 4+ tetamu atau pakaian basah selepas berenang, van atau van VIP lebih selesa daripada sedan.\"},\"4\":{\"q\":\"Adakah tiket masuk disertakan dengan pemindahan?\",\"a\":\"Tidak. Tambang pemindahan meliputi pengangkutan sahaja. Tiket taman dan kuil dibayar di tapak melainkan anda menempah lawatan berasingan.\"},\"5\":{\"q\":\"Bolehkah kita melawat lebih daripada satu tarikan?\",\"a\":\"ya. Senaraikan susunan perhentian dalam nota tempahan, atau tempah piagam berbilang laluan / hari untuk gelung persiaran penuh.\"},\"6\":{\"q\":\"Pukul berapa kita harus bertolak untuk pemandangan pagi?\",\"a\":\"Untuk tempat popular seperti Emerald Pool, permulaan awal membantu mengelakkan panas dan kesesakan — kami boleh mencadangkan masa pengambilan apabila anda menempah.\"}}},\"inter-province-transfer\":{\"title\":\"Pemindahan Antara Wilayah\",\"subtitle\":\"Pemindahan peribadi jarak jauh merentasi Selatan Thailand\",\"intro\":\"Krabi–Phuket, Trang, Surat Thani dan seterusnya — SUV peribadi, van atau bas untuk perjalanan lebuh raya yang selesa.\",\"tip\":\"Laluan panjang tempah pada hujung minggu — tempah awal untuk berlepas pagi.\",\"benefit1\":\"Pilihan SUV, van dan bas siap lebuh raya\",\"benefit2\":\"Tambang tetap untuk perjalanan wilayah ke wilayah\",\"benefit3\":\"Sesuai untuk kumpulan dengan bagasi dan peralatan\",\"faq\":{\"1\":{\"q\":\"Kenderaan manakah yang terbaik untuk perjalanan lebuh raya yang jauh?\",\"a\":\"SUV atau van untuk keselesaan; Van atau bas VIP untuk kumpulan yang lebih besar dan lebih banyak bagasi di laluan Krabi–Phuket atau Surat.\"},\"2\":{\"q\":\"Adakah harga tetap antara wilayah?\",\"a\":\"ya. Pemindahan antara wilayah menggunakan tambang tetap peribadi untuk kenderaan pilihan anda, yang dipersetujui sebelum anda membayar.\"},\"3\":{\"q\":\"Berapa awal saya perlu menempah perjalanan hujung minggu?\",\"a\":\"Hujung minggu dan cuti penuh awal — tempah pelepasan pagi sekurang-kurangnya sehari lebih awal apabila anda boleh.\"},\"4\":{\"q\":\"Adakah tol lebuh raya termasuk?\",\"a\":\"Harga pemindahan yang disebut termasuk tol standard dan tempat letak kereta yang berkaitan dengan perjalanan melainkan dinyatakan sebaliknya pada tempahan.\"},\"5\":{\"q\":\"Adakah hentian rehat termasuk dalam laluan yang panjang?\",\"a\":\"Pemandu boleh berhenti sebentar untuk tandas atau makanan ringan dalam perjalanan lebuh raya yang jauh. Sebutkan rehat pilihan dalam nota anda.\"},\"6\":{\"q\":\"Bolehkah anda melakukan Krabi ke Phuket dengan menghantar ke hotel?\",\"a\":\"ya. Pilih hotel atau lapangan terbang Phuket anda sebagai penghantaran — titik-ke-titik persendirian, bukan bas kongsi.\"}}}},\"Vehicles\":{\"amenities\":{\"ac\":\"Penyaman udara\",\"water\":\"Air botol\",\"charger\":\"Pengecas telefon\",\"legroom\":\"Ruang kaki tambahan\",\"groupSeating\":\"Tempat duduk berkumpulan\",\"leather\":\"Tempat duduk kulit\",\"wifi\":\"Wi-Fi\",\"snacks\":\"Makanan ringan\",\"meetGreet\":\"Jumpa \u0026 salam\",\"luxury\":\"kereta sedan mewah\",\"premium\":\"Kemudahan premium\",\"priority\":\"Perkhidmatan keutamaan\",\"captain\":\"Kerusi kapten\",\"privacy\":\"Kaca privasi\",\"usb\":\"Pengecasan USB\",\"drinks\":\"Minuman sejuk\",\"groupTravel\":\"Perjalanan berkumpulan\",\"tourGuide\":\"Ruang pemandu pelancong\"},\"bags\":\"{n} beg\",\"largeCargo\":\"Kawasan kargo yang besar\",\"pax\":\"{n} pax\",\"bags3\":\"3 beg\",\"bags4\":\"4 beg\",\"bags6\":\"6 beg\",\"bags8\":\"8 beg\",\"bags10\":\"10 beg\",\"ECO\":{\"name\":\"Teksi Ekonomi\",\"luggage\":\"3 beg\"},\"PREM\":{\"name\":\"Teksi Mewah\",\"luggage\":\"4 beg\"},\"SUV\":{\"name\":\"Teksi SUV\",\"luggage\":\"6 beg\"},\"VAN\":{\"name\":\"Teksi Van\",\"luggage\":\"6 beg\"},\"VIP\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 beg\"},\"SIG\":{\"name\":\"Alphard VIP\",\"luggage\":\"4 beg\"},\"EXE\":{\"name\":\"Van VIP\",\"luggage\":\"8 beg\"},\"BUS\":{\"name\":\"Bas Mini\",\"luggage\":\"Kawasan kargo yang besar\"}},\"Contact\":{\"title\":\"Hubungi Kami\",\"subtitle\":\"Ada soalan? Pasukan kami sedia membantu dengan rancangan perjalanan Thailand Selatan anda.\",\"sendTitle\":\"Hantar Mesej\",\"sendSubtitle\":\"Kami biasanya membalas dalam masa 24 jam\",\"name\":\"Nama\",\"email\":\"E-mel\",\"subject\":\"Subjek\",\"message\" iting staff confirmation\",\"statusPaymentReview\":\"Payment under review\",\"statusPaymentPending\":\"Payment verification pending\",\"holdHint\":\"Voucher unlocks after staff confirmation. Keep your booking number.\",\"toastNotFound\":\"No booking found. Check the number and phone.\",\"toastPhone\":\"Please enter the phone number used for this booking.\",\"toastLocalOnly\":\"Not found on this device. Cloud lookup is not configured yet.\",\"localModeHint\":\"Cloud sync is off — lookup works for bookings made on this browser only.\"},\"Listing\":{\"searchArticles\":\"Cari artikel…\",\"searchTours\":\"Cari lawatan, pulau, kawasan…\",\"searchTravel\":\"Cari destinasi, petua…\",\"all\":\"Semua\",\"min\":\"min\",\"minRead\":\"min baca\",\"read\":\"Baca\",\"readGuide\":\"Baca panduan\",\"details\":\"Butiran\",\"from\":\"daripada\",\"emptyArticles\":\"Tiada artikel yang sepadan dengan carian anda.\",\"emptyTours\":\"Tiada lawatan yang sepadan dengan penapis anda.\",\"emptyTravel\":\"Tiada panduan yang sepadan dengan carian anda.\",\"ctaArticles\":\"Perlukan pemindahan selepas membaca?\",\"ctaTours\":\"Perlukan perjalanan ke jeti?\",\"pierTransfer\":\"Pemindahan Jeti\",\"inquireTour\":\"Tanya tentang lawatan\",\"allArticles\":\"Semua artikel\",\"allTours\":\"Semua lawatan\",\"allTravel\":\"Semua maklumat perjalanan\",\"relatedArticles\":\"Artikel berkaitan\",\"relatedTours\":\"Lawatan berkaitan\",\"bookRoute\":\"Bersedia untuk menempah laluan ini?\",\"startBooking\":\"Mulakan Tempahan\",\"highlights\":\"Sorotan\",\"includes\":\"Biasanya termasuk\",\"bookTransfer\":\"Pemindahan Buku\",\"inquire\":\"Tanya\",\"quickTips\":\"Petua cepat\",\"planTransfer\":\"Rancang pemindahan seterusnya\",\"moreGuides\":\"Lebih banyak panduan\",\"boatType\":\"Jenis bot\",\"allBoats\":\"Semua bot\",\"ferry\":\"Feri\",\"speedboat\":\"Bot laju\",\"longtail\":\"Ekor panjang\",\"route\":\"Laluan\",\"allRoutes\":\"Semua laluan\",\"departures\":\"Berlepas\",\"duration\":\"Tempoh\",\"transferTo\":\"Pindahkan ke {pier}\",\"landTransfer\":\"Pemindahan tanah ke jeti\",\"emptyBoats\":\"Tiada jadual yang sepadan dengan penapis anda.\",\"mockBanner\":\"Jadual bot tiruan untuk perancangan — masa mungkin berbeza dalam realiti.\",\"ctaArticlesBody\":\"Semak harga langsung dan tempah kereta persendirian dengan e-Baucar segera.\",\"bookRouteBody\":\"Dapatkan harga segera dan e-Baucar dengan kod QR.\",\"relatedBoats\":\"Laluan bot yang berkaitan\",\"landTransferBody\":\"Kami tidak menjual tiket feri — kami membawa anda ke tempat berlepas tepat pada masanya.\",\"tourCtaTitle\":\"Tempah jeti atau pemindahan hotel\",\"tourCtaBody\":\"Tiket pelancongan dijual oleh pengendali tempatan. Kami membawa anda ke jeti mesyuarat tepat pada masanya dengan e-Baucar.\",\"toursCtaBody\":\"Harga pelancongan adalah anggaran operator (olok-olok). Kami mengendalikan pemindahan dermaga hotel dengan e-Baucar segera.\",\"travelCtaBody\":\"Semak masa bot, kemudian tempah pemindahan peribadi ke jeti atau hotel.\"},\"Articles\":{\"categories\":{\"Airport\":\"Lapangan terbang\",\"Beach\":\"Pantai\",\"Pier\":\"Jeti\",\"Inter Province\":\"Antara Wilayah\"},\"items\":{\"krabi-airport-transfer-guide\":{\"title\":\"Panduan Pemindahan Lapangan Terbang Krabi: Ketibaan Lancar di KBV\",\"excerpt\":\"Perkara yang diharapkan selepas mendarat di Lapangan Terbang Antarabangsa Krabi, cara bertemu \u0026 sapa berfungsi, dan cara menempah pemindahan peribadi dengan e-Baucar.\",\"p1\":\"Mendarat di Lapangan Terbang Antarabangsa Krabi (KBV) adalah permulaan perjalanan Selatan Thailand anda. Pemindahan lapangan terbang peribadi membantu anda melangkau baris gilir teksi dan pergi terus ke hotel, pantai atau jeti anda.\",\"p2\":\"Dengan Teksi Pautan Krabi, pemandu anda menjejaki penerbangan dan termasuk masa menunggu percuma untuk pengambilan lapangan terbang. Anda menerima e-Baucar dengan kod QR sejurus selepas membuat tempahan — tunjukkan di tempat pertemuan.\",\"p3\":\"Laluan popular dari KBV termasuk Pantai Ao Nang, Railay, Centara Grand dan Pekan Krabi. Pilih Sedan Ekonomi untuk pasangan atau Van jika anda melancong bersama keluarga dan bagasi.\",\"p4\":\"Petua: Kongsi nombor penerbangan dan nama hotel anda semasa membuat tempahan supaya pemandu boleh menyediakan tanda nama dan merancang laluan terbaik sekitar trafik malam.\"},\"ao-nang-railay-beach-transfer\":{\"title\":\"Petua Pemindahan Ao Nang \u0026 Pantai Railay\",\"excerpt\":\"Cara untuk bergerak antara Ao Nang, Railay dan resort berdekatan dengan kereta persendirian, jeti dan kenderaan yang sesuai untuk beg pantai.\",\"p1\":\"Ao Nang ialah hab untuk banyak penginapan pantai Krabi, manakala Railay dicapai melalui sambungan jeti yang singkat. Merancang pemindahan anda lebih awal menjadikan hari anda mudah.\",\"p2\":\"Dari lapangan terbang atau Bandar Krabi, tempah penghantaran peribadi ke Pantai Ao Nang atau hotel anda. Untuk Railay, kami boleh membawa anda ke jeti dan membantu masa sambungan bot anda.\",\"p3\":\"Jika anda membawa peralatan snorkel atau beg besar, SUV atau Van Standard memberikan lebih banyak ruang daripada sedan. Tempahan pergi balik juga menjimatkan masa pada hari daftar keluar.\",\"p4\":\"Waktu pulang dari pantai boleh menjadi sibuk — tempah masa pengambilan anda lebih awal, terutamanya pada hujung minggu dan cuti umum.\"},\"pier-transfer-to-phi-phi\":{\"title\":\"Pemindahan Jeti ke Phi Phi: Perkara Yang Pengembara Perlu Tahu\",\"excerpt\":\"Senarai semak praktikal untuk pemindahan hotel ke jeti, masa feri dan petua bagasi sebelum menuju ke Phi Phi.\",\"p1\":\"Hari pulau bermula di darat. Pemindahan jeti yang boleh dipercayai dari hotel atau lapangan terbang anda bermakna anda sampai ke Jeti Ao Nang atau tempat berlepas lain tanpa tergesa-gesa.\",\"p2\":\"Bina dalam masa penimbal untuk daftar masuk dan menaiki pesawat. Kami mengesyorkan anda tiba di jeti sekurang-kurangnya 45–60 minit sebelum feri berlepas semasa musim puncak.\",\"p3\":\"Van persendirian sesuai untuk kumpulan yang berkongsi feri yang sama. Keluarga boleh meminta tempat duduk kanak-kanak secara percuma semasa membuat tempahan.\",\"p4\":\"Selepas perjalanan pulau anda, tempah pengambilan jeti pergi balik supaya pemandu bersedia apabila bot berlabuh — amat berguna jika anda tiba selepas gelap.\"},\"krabi-to-phuket-inter-province\":{\"title\":\"Pemindahan Krabi ke Phuket Antara Wilayah\",\"excerpt\":\"Bandingkan keselesaan dan masa untuk koridor Krabi–Phuket, pilihan kenderaan dan apabila pemindahan peribadi mengatasi van kongsi.\",\"p1\":\"Laluan Krabi–Phuket adalah salah satu pemindahan antara wilayah yang paling diminta di Selatan Thailand. Kereta persendirian memberikan masa dari pintu ke pintu tanpa hentian berganda.\",\"p2\":\"Perjalanan biasa menghubungkan KBV atau Pekan Krabi dengan Lapangan Terbang Phuket atau Patong. Masa perjalanan bergantung pada lalu lintas dan sama ada anda bermula dari lapangan terbang atau bandar.\",\"p3\":\"Untuk perjalanan yang lebih lama, pilihan Van VIP atau Bas Mini menawarkan lebih banyak ruang dan keselesaan. Harga adalah termasuk semua tol dan tempat letak kereta melainkan anda menambah masa menunggu.\",\"p4\":\"Tempah perjalanan pergi balik jika anda terbang ke satu wilayah dan keluar dari wilayah yang lain — satu tempahan meliputi kedua-dua kaki dengan satu aliran e-Baucar.\"}}},\"Admin\":{\"loading\":\"Memuatkan…\",\"loginTitle\":\"Admin daftar masuk\",\"loginHint\":\"Demo: {user} / {pass}\",\"username\":\"Nama pengguna\",\"password\":\"Kata laluan\",\"signIn\":\"Log masuk\",\"loginError\":\"Nama pengguna atau kata laluan tidak sah\",\"logout\":\"Log keluar\",\"backToSite\":\"Kembali ke laman web\",\"panelTitle\":\"operasi\",\"opsLabel\":\"Pejabat belakang · Demo\",\"nav\":{\"dashboard\":\"Papan pemuka\",\"bookings\":\"Tempahan\",\"payments\":\"Pembayaran\",\"schedule\":\"Jadual\",\"drivers\":\"Pemandu\",\"customers\":\"Pelanggan\",\"prices\":\"Jadual harga\",\"vehicles\":\"Kenderaan\",\"settings\":\"tetapan\"},\"dashboardTitle\":\"Papan pemuka\",\"dashboar t dalam Excel, kemudian import. Harga yang diimport dikenakan pada penyemak imbas ini serta-merta (demo). Untuk tapak langsung, kami kemudian boleh menyimpannya ke dalam projek dan menggunakan.\",\"catalogRentalTitle\":\"Pakej kereta sewa\",\"catalogRentalHelp\":\"Lajur: id, kategori, model, enjin, tempat duduk, Beg besar, pintu, days1to3, days4to6, days7to20, days21to30. Kategori mestilah Kereta Mini, Ekonomi, Kompak atau Saiz Penuh. Biarkan kadar kosong untuk atas permintaan.\",\"catalogTransferTitle\":\"Memindahkan laluan\",\"catalogTransferHelp\":\"Lajur: dariId, hinggaId, jarakKm, tempohMin, kategori, ECO, PREM, SUV, VAN, EXE, VIP, SIG, BAS. fromId/toId boleh menjadi ID atau nama lokasi (cth. kbv-lapangan terbang, Ao Nang). Harga yang sama kedua-dua arah.\",\"catalogImport\":\"Import CSV\",\"catalogTemplate\":\"Muat turun templat\",\"catalogReset\":\"Gunakan jadual terbina dalam\",\"catalogUsingBuiltin\":\"Menggunakan jadual terbina dalam · {n} baris\",\"catalogUsingImported\":\"Menggunakan jadual yang diimport · {n} baris · {when}\",\"catalogRentalOk\":\"Pakej sewa {n} yang diimport\",\"catalogTransferOk\":\"Laluan pemindahan {n} yang diimport\",\"catalogResetOk\":\"Meja terbina dalam dipulihkan\",\"catalogEmpty\":\"Tiada baris yang sah ditemui dalam fail itu.\",\"catalogSkipped\":\"Dilangkau {n} baris: {detail}\",\"catalogRowIssue\":\"baris {row} ({reason})\",\"catalogXlsxHint\":\"Sila simpan Excel sebagai CSV (UTF-8) dan import fail tersebut.\",\"catalogVehiclesTitle\":\"Memindahkan kenderaan\",\"catalogVehiclesSubtitle\":\"Import CSV untuk mengemas kini kelas kumpulan yang ditunjukkan pada harga, tempahan dan halaman /fleet (demo: storan penyemak imbas).\",\"catalogTransferVehiclesTitle\":\"Kelas kenderaan (ECO/PREM/SUV/VAN/VIP/SIG/EXE/BUS)\",\"catalogVehiclesHelp\":\"Lajur CSV: kod, penumpang, AmenityKeys (koma atau | dipisahkan), priceMultiplier, imej. Kod ditetapkan.\",\"catalogUsingBuiltinVehicles\":\"Menggunakan meja kenderaan terbina dalam\",\"catalogUsingImportedVehicles\":\"Menggunakan jadual kenderaan import · {when}\",\"catalogVehiclesOk\":\"{n} baris kenderaan yang diimport\",\"catalogVehiclesPreview\":\"Pratonton terbina dalam\",\"catalogVehiclesPreviewHint\":\"Edit medan ini dalam templat CSV, kemudian import.\",\"settingsTitle\":\"tetapan\",\"settingsSubtitle\":\"Edit butiran hubungan, akaun pembayaran, kadar piagam, peraturan pembatalan dan log masuk kakitangan. Disimpan dalam penyemak imbas ini untuk demo.\",\"settingsContactTitle\":\"Butiran hubungan\",\"settingsContactHelp\":\"Nilai ini muncul dalam pengepala, pengaki, halaman kenalan dan baucar.\",\"settingsPaymentTitle\":\"Pembayaran\",\"settingsPaymentHelp\":\"Hidupkan atau matikan kaedah dan edit butiran bank / PromptPay yang ditunjukkan semasa pembayaran.\",\"settingsCharterTitle\":\"Kadar piagam\",\"settingsCharterHelp\":\"Kadar asas THB untuk piagam harian dan setiap jam. Pengganda kenderaan masih digunakan.\",\"settingsRentalDepositTitle\":\"Car rental deposits\",\"settingsRentalDepositHelp\":\"Advance deposit paid online, plus security deposits collected on contract day.\",\"settingsRentalDepositInvalid\":\"Deposit amounts must be at least 1\",\"settingsAdvanceDeposit\":\"Advance deposit (THB)\",\"settingsSmallCarDeposit\":\"Small car security deposit (THB)\",\"settingsLargeCarDeposit\":\"Large car security deposit (THB)\",\"settingsPolicyTitle\":\"Dasar pembatalan\",\"settingsPolicyHelp\":\"Ditunjukkan pada borang tempahan. Tapak langsung boleh menggunakan nombor ini kemudiannya untuk mengira bayaran balik.\",\"settingsStaffTitle\":\"Log masuk kakitangan\",\"settingsStaffHelp\":\"Akaun tambahan selain pentadbir demo. Peranan menyembunyikan beberapa item menu. Kata laluan disimpan dalam penyemak imbas ini sahaja.\",\"settingsSave\":\"Jimat\",\"settingsReset\":\"Pulihkan lalai\",\"settingsResetOk\":\"Tetapan lalai dipulihkan\",\"settingsSaved\":\"Tetapan disimpan\",\"settingsRequired\":\"Sila isi ruangan yang diperlukan\",\"settingsNeedMethod\":\"Hidupkan sekurang-kurangnya satu kaedah pembayaran\",\"settingsNeedBank\":\"Dayakan sekurang-kurangnya satu akaun bank untuk pemindahan\",\"settingsNeedPromptPay\":\"Masukkan ID PromptPay\",\"settingsPhone\":\"telefon\",\"settingsEmail\":\"E-mel\",\"settingsLine\":\"ID TALIAN\",\"settingsWhatsapp\":\"WhatsApp\",\"settingsFacebook\":\"Facebook\",\"settingsAddress\":\"Alamat\",\"settingsEnabled\":\"Didayakan\",\"settingsBankName\":\"nama bank\",\"settingsAccountName\":\"Nama akaun\",\"settingsAccountNumber\":\"Nombor akaun\",\"settingsBranch\":\"Cawangan\",\"settingsPromptPayId\":\"ID PromptPay\",\"settingsPromptPayName\":\"Nama akaun PromptPay\",\"settingsDailyRate\":\"Piagam harian (THB)\",\"settingsHourlyRate\":\"Kadar setiap jam (THB)\",\"settingsMinHours\":\"Jam minimum\",\"settingsFreeHours\":\"Pembatalan percuma (jam sebelum pengambilan)\",\"settingsLatePercent\":\"Yuran pembatalan lewat (%)\",\"settingsNoShowPercent\":\"Yuran tidak hadir (%)\",\"settingsRefundDays\":\"Bayaran balik dalam masa (hari perniagaan)\",\"settingsNoStaff\":\"Tiada kakitangan tambahan lagi.\",\"settingsStaffName\":\"Nama\",\"settingsStaffRole\":\"Peranan\",\"settingsAddStaff\":\"Tambah kakitangan\",\"settingsStaffAdded\":\"Akaun kakitangan ditambah\",\"settingsStaffRemoved\":\"Akaun kakitangan dialih keluar\",\"settingsStaffDup\":\"Nama pengguna itu sudah digunakan\",\"settingsRemove\":\"Alih keluar\",\"settingsCancel\":\"Batal\",\"settingsMethod\":{\"bank-transfer\":\"Pindahan bank\",\"card\":\"Kad\",\"promptpay\":\"PromptPay\",\"cash\":\"Wang tunai kepada pemandu\"},\"settingsRole\":{\"admin\":\"Admin\",\"ops\":\"operasi\",\"finance\":\"Kewangan\",\"driver\":\"Pemandu\"},\"driversAdd\":\"Tambah pemandu\",\"driversEdit\":\"Edit pemandu\",\"driversLine\":\"ID TALIAN\",\"driversPlate\":\"Plat lesen\",\"driversRemoved\":\"Pemandu dikeluarkan\",\"catalogIssue\":{\"empty\":\"fail kosong\",\"missingModel\":\"model hilang\",\"badCategory\":\"kategori tidak sah\",\"badLocation\":\"tidak diketahui dari/ke lokasi\",\"sameLocation\":\"dari dan ke adalah sama\",\"missingPrice\":\"harga kenderaan hilang\"},\"confirmOrder\":\"Confirm order\",\"orderConfirmDue\":\"Order total\",\"toastOrderOk\":\"Order confirmed — voucher can be issued\",\"planPayDriver\":\"Pay driver\",\"planDeposit\":\"Deposit\",\"planFull\":\"Full payment\",\"settingsAdvanceDepositTiers\":\"Online deposit is automatic by booking total: \u003c=1000 -\u003e 200 / 1001-2999 -\u003e 500 / \u003e=3000 -\u003e 1000 (not editable).\"},\"Tours\":{\"categories\":{\"Island\":\"Pulau\",\"Snorkel\":\"Snorkel\",\"Kayak\":\"Kayak\",\"Sightseeing\":\"bersiar-siar\",\"Combo\":\"Kombo\"},\"items\":{\"phi-phi-islands-day-trip\":{\"title\":\"Lawatan Sehari Kepulauan Phi Phi\",\"excerpt\":\"Perjalanan sehari Andaman klasik dengan sudut pandangan Maya Bay, perhentian snorkel dan makan tengah hari di pantai.\",\"duration\":\"Sehari penuh (~8–9 jam)\",\"fromArea\":\"Ao Nang / Krabi\",\"toArea\":\"Kepulauan Phi Phi\",\"highlights\":{\"1\":\"Sudut pandangan Teluk Maya (tertakluk kepada peraturan taman)\",\"2\":\"Snorkeling di terumbu jernih\",\"3\":\"Makan tengah hari pantai di Phi Phi Don atau teluk berdekatan\",\"4\":\"Sokongan masa pengambilan hotel atau jeti\"},\"includes\":{\"1\":\"Bot laju atau tempat duduk feri (bergantung kepada pengendali)\",\"2\":\"Yuran taman negara (jika disertakan oleh pengendali)\",\"3\":\"Makan tengahari \u0026 minum air\",\"4\":\"Jaket keselamatan \u0026 peralatan snorkel\"},\"content\":{\"1\":\"Phi Phi kekal sebagai salah satu lawatan sehari yang paling diminta dari Krabi. Kebanyakan pakej bertolak awal dari Ao Nang atau jeti berdekatan dan kembali pada lewat petang.\",\"2\":\"Kami mengesyorkan menempah pemindahan jeti peribadi supaya anda tiba dengan masa penampan sebelum daftar masuk. Pemulangan petang mungkin sibuk — tempah slot pengambilan anda apabila anda menempah lawatan.\",\"3\":\"Harga pelancongan yang ditunjukkan adalah daripada operator tempatan biasa (harga panduan olok-olok). Sahkan kemasukan, jenis bot dan peraturan akses Teluk Maya untuk tarikh perjalanan anda.\"}},\"four-islands-tour\":{\"title\":\"Lawatan 4 Pulau (Ayam, Tup, Poda \u0026 Railay)\",\"excerpt\":\"Lompat pulau pendek berhampiran Ao Nang — terumbu cetek, batu ikonik dan pantai pasir lembut.\",\"duration\":\"Setengah / hari penuh\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Ayam · Tup · Poda · Railay\",\"highlights\":{\"1\":\"Pemandangan Pulau Ayam \u0026 snorkel\",\"2\":\"Belah pasir Pulau Tup (bergantung kepada air pasang)\",\"3\":\"Perhentian berenang Pantai Poda\",\"4\":\"Drop atau lawati Railay pilihan\"},\"includes\":{\"1\":\"Ekor panjang atau bot laju\",\"2\":\"Topeng snorkel \u0026 jaket keselamatan\",\"3\":\"Buah-buahan / minuman ringan (bergantung kepada pengendali)\",\"4\":\"Panduan di atas kapal\"},\"content\":{\"1\":\"Laluan 4 Islands sesuai jika anda mahukan pemandangan berhampiran Ao Nang tanpa perlu lintasan panjang ke Phi Phi.\",\"2\":\"Air pasang menjejaskan penglihatan belang pasir di Pulau Tup — berlepas pagi biasanya memberikan keadaan terbaik.\",\"3\":\"Gandingkan lawatan ini dengan pemindahan dermaga hotel supaya anda tidak bergantung pada songthaew saat akhir semasa musim puncak.\"}},\"hong-island-lagoon\":{\"title\":\"Perjalanan Lagun Pulau Hong\",\"excerpt\":\"Lagun yang tenang, pilihan berkayak dan pantai pasir serbuk di Taman Negara Than Bok Khorani.\",\"duration\":\"Hari penuh\",\"fromArea\":\"Ao Nang / Nopparat Thara\",\"toArea\":\"Pulau Hong\",\"highlights\":{\"1\":\"Pemandangan lagun Zamrud\",\"2\":\"Berkayak melalui saluran batu kapur\",\"3\":\"Waktu pantai yang tenang\",\"4\":\"Pemandangan taman negara\"},\"includes\":{\"1\":\"Pemindahan bot ke Pulau Hong\",\"2\":\"Kayak (berkongsi atau persendirian — bergantung kepada operator)\",\"3\":\"Yuran taman negara (sering termasuk)\",\"4\":\"Makan tengah hari dengan beberapa pakej\"},\"content\":{\"1\":\"Pulau Hong popular dengan pengembara yang lebih suka lagun dan berkayak sepanjang hari bot laju jarak jauh.\",\"2\":\"Berlepas selalunya dari Nopparat Thara / sebelah Ao Nang. Berikan masa tambahan jika hotel anda berada di pedalaman atau di Bandar Krabi.\",\"3\":\"Tanya operator anda tentang peraturan pembukaan taman dan sama ada kayak disertakan atau disewa di tapak.\"}},\"james-bond-island-phang-nga\":{\"title\":\"Pulau James Bond · Teluk Phang Nga\",\"excerpt\":\"Karst batu kapur ikonik, berkanu di dalam gua, dan jarum batu Koh Tapu yang terkenal.\",\"duration\":\"Hari penuh\",\"fromArea\":\"Sebelah Krabi / Phuket\",\"toArea\":\"Teluk Phang Nga\",\"highlights\":{\"1\":\"Koh Tapu (Pulau James Bond)\",\"2\":\"Berkanu melalui gua bakau\",\"3\":\"Perhentian perkampungan nelayan Islam (bergantung kepada operator)\",\"4\":\"Pelayaran teluk yang indah\"},\"includes\":{\"1\":\"Segmen bot \u0026 kanu\",\"2\":\"Panduan\",\"3\":\"Makan tengahari\",\"4\":\"Yuran taman negara (bergantung pada pakej)\"},\"content\":{\"1\":\"Lawatan ke Pulau James Bond boleh bermula dari Krabi atau Phuket. Masa perjalanan di darat mungkin lebih lama daripada segmen bot itu sendiri.\",\"2\":\"Pemindahan peribadi antara hotel anda dan jeti mesyuarat memastikan hari itu mengikut jadual — terutamanya untuk pengambilan hotel awal.\",\"3\":\"Harga berbeza secara meluas mengikut kualiti kanu dan saiz kumpulan; gunakan harga dari kami sebagai panduan perancangan sahaja.\"}},\"emerald-pool-hot-spring-combo\":{\"title\":\"Kombo Emerald Pool \u0026 Hot Spring\",\"excerpt\":\"Hari alam semula jadi berasaskan darat — kolam hutan zamrud dan mata air panas mineral berhampiran Bandar Krabi.\",\"duration\":\"Separuh hari\",\"fromArea\":\"Pekan Krabi / Ao Nang\",\"toArea\":\"Kolam Zamrud · Mata Air Panas\",\"highlights\":{\"1\":\"Berenang di Emerald Pool\",\"2\":\"Bersantai di mata air panas semula jadi\",\"3\":\"Pilihan sudut pandangan Kolam Biru\",\"4\":\"Separuh hari yang mudah untuk keluarga\"},\"includes\":{\"1\":\"Yuran masuk (bergantung kepada pakej)\",\"2\":\"Panduan tentang beberapa pakej\",\"3\":\"Air minuman\"},\"content\":{\"1\":\"Kombo ini sesuai apabila laut bergelora atau anda mahukan hari darat antara perjalanan pulau.\",\"2\":\"Tempah pemindahan tarikan untuk masa dari pintu ke pintu tanpa lengah van berkongsi.\",\"3\":\"Bawa kasut air — laluan boleh menjadi licin selepas hujan.\"}},\"railay-sunset-longtail\":{\"title\":\"Railay Sunset oleh Longtail\",\"excerpt\":\"Lompatan dermaga singkat ke Railay untuk melihat pemandangan, mendaki tebing dan foto jam emas.\",\"duration\":\"3–5 jam / petang\",\"fromArea\":\"Ao Nang\",\"toArea\":\"Pantai Railay\",\"highlights\":{\"1\":\"Ekor panjang ke Railay Barat / Timur\",\"2\":\"Berjalan kaki di Pantai Gua Phra Nang\",\"3\":\"Matahari terbenam di Railay Barat\",\"4\":\"Makan malam pilihan di pantai\"},\"includes\":{\"1\":\"Ekor panjang pergi balik (berkongsi atau persendirian)\",\"2\":\"Jaket keselamatan\"},\"content\":{\"1\":\"Railay hanyalah perjalanan bot singkat dari Ao Nang tetapi terasa seperti destinasi yang berbeza.\",\"2\":\"Semak masa bot pulang jika anda menginap untuk matahari terbenam — ekor panjang peribadi adalah fleksibel apabila bot awam perlahan.\",\"3\":\"Kami boleh menghantar anda di Jeti Ao Nang dan menunggu pengambilan balik anda atas permintaan.\"}}}},\"TravelGuides\":{\"categories\":{\"Destination\":\"Destinasi\",\"Island\":\"Pulau\",\"Corridor\":\"Koridor\",\"Practical\":\"Praktikal\"},\"items\":{\"ao-nang-base-guide\":{\"title\":\"Ao Nang sebagai Pangkalan Krabi Anda\",\"excerpt\":\"Tempat tinggal, cara untuk sampai ke jeti, dan cara menghubungkan pantai, Railay dan lawatan sehari.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Tinggal berhampiran jalan pantai untuk akses longtail yang mudah ke Railay.\",\"2\":\"Pemindahan jeti buku pada malam sebelum pagi feri yang sibuk.\",\"3\":\"Trafik petang antara Bandar Krabi dan Ao Nang boleh menambah 15–25 minit.\"},\"content\":{\"1\":\"Ao Nang ialah pangkalan yang paling praktikal untuk pelawat kali pertama: restoran, meja tempahan lawatan dan akses bot terletak berdekatan.\",\"2\":\"Gunakan pemindahan peribadi dari Lapangan Terbang Krabi (KBV) jika anda tiba dengan bagasi atau selepas gelap — teksi bermeter dan van kongsi berbeza dalam masa menunggu.\",\"3\":\"Dari Ao Nang, anda boleh sampai ke Railay dalam masa kira-kira 15 minit dengan ekor panjang, menyertai perjalanan 4 Pulau, atau menyambung ke bot laju Phi Phi.\",\"4\":\"Jika hotel anda mendaki bukit atau pedalaman, tambahkan masa penampan pada setiap perlepasan jeti.\"}},\"railay-access-tips\":{\"title\":\"Pergi ke Pantai Railay Tanpa Tekanan\",\"excerpt\":\"Pilihan bot, petua bagasi dan masa untuk menempah ekor panjang peribadi vs bot kongsi.\",\"region\":\"Krabi\",\"tips\":{\"1\":\"Beg pakaian besar lebih mudah pada ekor panjang peribadi.\",\"2\":\"Railay East boleh berlumpur semasa air surut — Barat adalah lebih baik untuk matahari terbenam.\",\"3\":\"Sahkan rancangan bot pulang sebelum makan malam.\"},\"content\":{\"1\":\"Railay tidak mempunyai akses jalan raya. Hampir semua orang tiba dengan bot dari Ao Nang atau melalui laluan yang lebih jauh dari Pekan Krabi.\",\"2\":\"Ekor panjang yang dikongsi adalah murah dan kerap pada hari. Bot persendirian lebih mahal tetapi membantu dengan masa, kanak-kanak dan beg besar.\",\"3\":\"Mendaki, berkayak dan Pantai Gua Phra Nang boleh berjalan kaki sebaik sahaja anda tiba — rancang kasut untuk laluan berbatu.\",\"4\":\"Kami boleh memindahkan hotel anda → Jeti Ao Nang dan mengaturkan pengambilan balik mengikut masa selepas matahari terbenam.\"}},\"phi-phi-arrival-checklist\":{\"title\":\"Senarai Semak Ketibaan Phi Phi\",\"excerpt\":\"Feri lwn bot laju, masa jeti dan cara menyambungkan pemindahan hotel sebelum dan selepas persimpangan.\",\"region\":\"Phi Phi / Krabi\",\"tips\":{\"1\":\"Tiba di jeti 45–60 minit awal pada musim keramaian.\",\"2\":\"Bot laju lebih laju; feri biasanya lebih lancar dan lebih murah.\",\"3\":\"Pra-tempah pemindahan tanah supaya anda tidak tergesa-gesa dengan bagasi.\"},\"content\":{\"1\":\"Hari pulau bermula di darat. Pemindahan hotel ke jeti yang boleh dipercayai adalah sama pentingnya dengan tiket bot itu sendiri.\",\"2\":\"Peraturan cuaca dan taman boleh mengubah akses Maya Bay — semak dengan operator anda sehari sebelumnya.\",\"3\":\"Pada malam pulang, pikap jeti persendirian berdepan menunggu van kongsi, terutamanya dengan beg basah dan kanak-kanak yang letih.\",\"4\":\"Jika anda terbang keluar dari Phuket atau Krabi pada keesokan harinya, tinggalkan masa penampan untuk kelewatan feri.\"}},\"krabi-phuket-corridor\":{\"title\":\"Koridor Krabi–Phuket: Petua Pemindahan\",\"excerpt\":\"Apabila kereta persendirian mengalahkan van kongsi di laluan antara wilayah paling sibuk di selatan.\",\"region\":\"Krabi · Phuket\",\"tips\":{\"1\":\"Kereta persendirian dari pintu ke pintu melangkau beberapa perhentian hotel.\",\"2\":\"Pemindahan lapangan terbang-lapangan terbang memerlukan pengesanan penerbangan dan masa menunggu.\",\"3\":\"Tol dan tempat letak kereta biasanya disertakan dalam sebut harga peribadi.\"},\"content\":{\"1\":\"Krabi ↔ Phuket ialah koridor antara wilayah yang paling banyak diminta untuk sambungan penerbangan dan perjalanan berbilang penginapan.\",\"2\":\"Van kongsi lebih murah tetapi tambah masa dengan perhentian. SUV atau van peribadi sesuai dengan keluarga dan jadual penerbangan yang ketat.\",\"3\":\"Kaki biasa menghubungkan KBV atau Pekan Krabi dengan Lapangan Terbang Phuket, Patong atau hotel pantai barat.\",\"4\":\"Tempah perjalanan pergi dan balik jika anda terbang ke satu wilayah dan keluar dari wilayah yang lain — satu e-Baucar meliputi kedua-dua kaki.\"}}}},\"Boats\":{\"items\":{\"ao-nang-railay-longtail\":{\"routeLabel\":\"Jeti Ao Nang → Pantai Railay\",\"operator\":\"Ekor panjang tempatan (dikongsi)\",\"notes\":\"Ekor panjang yang kerap dikongsi; piagam swasta disediakan. Bot petang menipis selepas matahari terbenam.\"},\"railay-ao-nang-longtail\":{\"routeLabel\":\"Pantai Railay → Jeti Ao Nang\",\"operator\":\"
